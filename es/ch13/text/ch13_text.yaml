word_order:
  tema: Dos pronombres juntos
  tema_sub_ko: 대명사 두 개 — 사람이 먼저, 물건이 뒤에
  point_ko: '대명사 두 개: me lo · se lo (사람 먼저)'
  lead_ko: 대명사가 둘이면 사람이 먼저, 물건이 다음이에요. 둘 다 활용된 동사 바로 앞에 놓이고, le는 lo·la 앞에서 se가 돼요.
  sentences:
  - es: ¿Me lo sube a la habitación?
    en: Can you bring it up to my room?
    ko: 그거 방으로 올려 주시겠어요?
    note_ko: 사람 me가 먼저, 물건 lo가 다음 · 둘 다 동사 앞
    tokens:
    - es: ¿Me
      gloss_ko: 나에게
    - es: lo
      gloss_ko: 그것을
    - es: sube
      gloss_ko: 올린다
    - es: a
      gloss_ko: ~로
    - es: la
      gloss_ko: 그
    - es: habitación?
      gloss_ko: 방
    highlight: [0, 1]
  - es: ¿La maleta? ¿Me la guarda aquí?
    en: The suitcase? Can you keep it here?
    ko: 가방이요? 여기 맡아 주실래요?
    note_ko: la가 la maleta를 받아요 · 순서는 me + la
    tokens:
    - es: ¿La maleta?
      gloss_ko: 그 가방?
    - es: ¿Me
      gloss_ko: 나에게
    - es: la
      gloss_ko: 그것을
    - es: guarda
      gloss_ko: 보관한다
    - es: aquí?
      gloss_ko: 여기
    highlight: [1, 2]
  - es: ¿La llave? Se la doy a usted.
    en: The key? I'll give it to you.
    ko: 열쇠요? 손님께 드릴게요.
    note_ko: le + la는 쓰지 않아요 · se la로 바꿔요
    tokens:
    - es: ¿La llave?
      gloss_ko: 그 열쇠?
    - es: Se
      gloss_ko: 당신에게
    - es: la
      gloss_ko: 그것을
    - es: doy
      gloss_ko: 준다
    - es: a usted
      gloss_ko: 당신에게
    highlight: [1, 2]
  - es: Se lo subo ahora mismo.
    en: I'll bring it up right away.
    ko: 바로 올려 드릴게요.
    note_ko: 직원의 말 · se(손님께) + lo(그것을) + 동사
    tokens:
    - es: Se
      gloss_ko: 당신에게
    - es: lo
      gloss_ko: 그것을
    - es: subo
      gloss_ko: 올린다
    - es: ahora mismo
      gloss_ko: 바로 지금
    highlight: [0, 1]
  - es: ¿Las toallas? ¿Me las trae?
    en: The towels? Can you bring them to me?
    ko: 수건이요? 갖다주실래요?
    note_ko: 복수면 물건 자리가 las · 사람은 그대로 앞에
    tokens:
    - es: ¿Las
      gloss_ko: 그
    - es: toallas?
      gloss_ko: 수건들?
    - es: ¿Me
      gloss_ko: 나에게
    - es: las
      gloss_ko: 그것들을
    - es: trae?
      gloss_ko: 가져온다
    highlight: [2, 3]
  patterns:
  - title_ko: 사람 + 물건
    items:
    - es: me lo
      tag: m
      ko: 나에게 그것을
    - es: me la
      tag: f
      ko: 나에게 그것을
    - es: me los
      tag: m pl
      ko: 나에게 그것들을
    - es: me las
      tag: f pl
      ko: 나에게 그것들을
  - title_ko: le·les는 se로
    items:
    - es: le + lo → se lo
      ko: 그에게 그것을
    - es: le + la → se la
      ko: 그에게 그것을
    - es: les + los → se los
      ko: 그들에게 그것들을
  - title_ko: 명사를 대명사로
    items:
    - es: Me da la llave → Me la da
      ko: 열쇠 줘요 → 그걸 줘요
    - es: Me trae la toalla → Me la trae
      ko: 수건 줘요 → 그걸 줘요
    - es: Le doy la llave → Se la doy
      ko: 열쇠 줘요 → 그걸 줘요
  contrast:
    title_ko: 대명사 두 개의 자리
    items:
    - es: Me lo sube.
      label_ko: 활용된 동사 앞에
      ko: 그걸 올려 주세요.
    - es: ¿Puede subírmelo?
      label_ko: 동사원형 끝에 붙여서
      ko: 그걸 올려 주실 수 있어요?
    - es: ¡Súbamelo!
      label_ko: 긍정 명령도 끝에
      ko: 그거 올려 주세요!
  subject:
    title_ko: se가 누구인지 밝히기
    items:
    - es: Se lo doy a usted.
      ko: 손님께 그걸 드려요.
    - es: Se lo doy a él.
      ko: 그 사람에게 그걸 줘요.
    - es: Se lo doy a ella.
      ko: 그녀에게 그걸 줘요.
  extra_notes_ko:
  - '대명사가 둘이면 ‘누구에게’가 먼저, ‘무엇을’이 뒤에 와요. 둘은 떨어지지 않고 동사 앞에 나란히 서요: Me lo sube. 동사원형과 긍정 명령에서는 둘 다 동사 끝에 붙어요: ¡Súbamelo!'
  - le나 les 바로 뒤에 lo·la·los·las가 오면 le·les는 se가 돼요. Le la doy라고 하지 않고 Se la doy라고 해요. se만으로 누구인지 알기 어려우면 뒤에 a usted, a él, a ella를 덧붙여요.
practice:
- tiles: [lo, habitación, Me, a, sube, la]
  answer: ¿Me lo sube a la habitación?
  ko: 그거 방으로 올려 주시겠어요?
- tiles: [doy, la, Se]
  answer: Se la doy.
  ko: 그걸 드릴게요.
- tiles: [guarda, aquí, la, Me]
  answer: ¿Me la guarda aquí?
  ko: 그거 여기 맡아 주실래요?
- tiles: [ahora, lo, Se, subo, mismo]
  answer: Se lo subo ahora mismo.
  ko: 바로 올려 드릴게요.
- tiles: [cama, una, Quiero, doble]
  answer: Quiero una cama doble.
  ko: 더블 침대로 주세요.
