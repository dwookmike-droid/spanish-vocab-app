scenes:
- es: Tengo una reserva a nombre de Kim.
  en: I have a reservation under Kim.
  ko: 김이라는 이름으로 예약했어요.
- es: ¿A qué hora es el desayuno?
  en: What time is breakfast?
  ko: 아침 식사는 몇 시예요?
- es: ¿Cuál es la contraseña del wifi?
  en: What's the Wi-Fi password?
  ko: 와이파이 비밀번호가 뭐예요?
- es: ¿Me guarda la maleta hasta las doce?
  en: Can you keep my case until twelve?
  ko: 12시까지 가방 맡아 주실래요?
- es: Me falta una toalla.
  en: I'm missing a towel.
  ko: 수건이 하나 모자라요.
- es: ¿Me da la factura, por favor?
  en: Can I have the invoice, please?
  ko: 청구서 좀 주시겠어요?
extras:
  grammar_ko:
  - el recepcionista는 남자, la recepcionista는 여자 직원이에요. -ista로 끝나는 직업 명사는 형태가 같고 관사로 구분해요.
  - -ción으로 끝나는 명사는 여성이에요. la habitación, la recepción 모두 la를 붙여요.
  - la planta는 ‘식물’과 ‘층’을 다 가리켜요. 호텔에서 듣는 la planta는 대개 층이에요.
  cognates:
  - es: el hotel
    en: hotel
    note_ko: 철자가 같아요. 스페인어는 h를 읽지 않아서 ‘오뗄’이 돼요.
  - es: la recepción
    en: reception
    note_ko: 스페인어 -ción과 영어 -tion이 짝을 이루는 경우가 많아요.
  - es: el pasaporte
    en: passport
    note_ko: 철자가 비슷해서 뜻이 바로 보여요.
  false_friend:
    es: la carpeta
    en: carpet
    note_ko: la carpeta는 서류철이에요. 카펫은 la alfombra라고 해요.
  fun_fact_ko: 스페인은 planta baja(지상층) 위부터 세요. la primera planta는 한국식으로 2층이에요.
