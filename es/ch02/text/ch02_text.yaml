  tema: Hay y está
  tema_sub_ko: 있다 — hay와 está, 장소는 뒤에
  point_ko: hay(있다) vs está(…에 있다) · 장소는 뒤에
  lead_ko: 처음 꺼내는 물건은 hay로, 이미 아는 물건은 está로 말해요. 장소는 둘 다 뒤쪽에 놓아요.
  sentences:
