extras:
  grammar_ko:
  - hay는 단수든 복수든 모양이 같아요. Hay un vaso. Hay dos vasos. 이렇게요.
  - está의 복수는 están이에요. El vaso está…, Los vasos están…처럼 앞에 오는 명사에 맞춰요.
  - la sartén은 끝 글자만 봐서는 성을 알 수 없어요. 스페인에서는 여성이라 la sartén nueva처럼 말해요.
  - el microondas는 -s로 끝나지만 단수예요. 복수도 los microondas로 모양이 같아요.
  cognates:
  - es: el microondas
    en: microwave
    note_ko: ondas는 ‘파동’이에요. micro + wave와 짜임이 같아요.
  - es: la tostadora
    en: toaster
    note_ko: 둘 다 ‘구운’을 뜻하는 라틴어 tostus에서 왔어요.
  - es: el mortero
    en: mortar
    note_ko: 둘 다 라틴어 mortarium에서 왔어요.
  - es: el vaso
    en: vase
    note_ko: 뿌리는 같은 라틴어 vas(그릇)인데, 스페인어에서는 유리컵, 영어에서는 꽃병이에요.
  false_friend:
    es: el horno
    en: horn
    note_ko: el horno는 오븐이에요. 영어 horn(뿔)은 스페인어로 el cuerno라고 해요.
  fun_fact_ko: paella는 원래 발렌시아 말로 음식이 아니라 그 팬을 가리켜요.
