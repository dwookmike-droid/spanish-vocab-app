  patterns:
  - title_ko: hay + 처음 말하는 물건
    items:
    - es: Hay un vaso.
      en: There's a glass.
      ko: 유리컵이 하나 있어요.
    - es: Hay dos tazas.
      en: There are two cups.
      ko: 찻잔이 두 개 있어요.
    - es: Hay leche.
      en: There's milk.
      ko: 우유가 있어요.
  - title_ko: está + 장소
    items:
    - es: La taza está en la mesa.
      en: The cup is on the table.
      ko: 찻잔은 식탁에 있어요.
    - es: La nevera está allí.
      en: The fridge is over there.
      ko: 냉장고는 저기 있어요.
    - es: Los platos están aquí.
      en: The plates are here.
      ko: 접시들은 여기 있어요.
  contrast:
    title_ko: hay와 está 고르기
    items:
    - es: Hay una taza en la mesa.
      label_ko: 처음 꺼내는 물건
      ko: 식탁에 찻잔이 하나 있어요.
    - es: La taza está en la mesa.
      label_ko: 이미 아는 물건
      ko: 그 찻잔은 식탁에 있어요.
    - es: En la mesa hay una taza.
      label_ko: 장소를 앞에 두기도 해요
      ko: 식탁에 찻잔이 하나 있어요.
  subject:
    title_ko: hay는 모양이 그대로예요
    items:
    - es: Hay un plato.
      ko: 접시가 하나 있어요.
    - es: Hay dos platos.
      ko: 접시가 두 개 있어요.
    - es: No hay platos.
      ko: 접시가 없어요.
  extra_notes_ko:
  - 듣는 사람이 아직 모르는 물건이 있다고 알려 줄 때는 hay를 써요. 그래서 뒤에 un, una, dos가 오거나 관사 없이 명사가 와요. 이미 아는 물건이 어디 있는지 말할 때는 está를 써요.
  - 장소는 en la mesa처럼 en(…에) 뒤에 놓아요. 한국어는 ‘식탁에’를 먼저 말하지만 스페인어는 보통 문장 끝에 둬요. 장소를 내세우고 싶으면 En la mesa hay dos platos처럼 앞으로 옮겨도 돼요.
