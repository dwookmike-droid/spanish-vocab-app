scenes:
- es: ¿Me lo puedo probar?
  en: Can I try it on?
  ko: 입어 봐도 돼요?
- es: ¿Lo tiene en otra talla?
  en: Do you have it in another size?
  ko: 다른 사이즈 있어요?
- es: Me queda pequeño.
  en: It's too small for me.
  ko: 저한테 작아요.
- es: Me lo llevo.
  en: I'll take it.
  ko: 이걸로 살게요.
- es: Se ha caído un botón.
  en: A button has come off.
  ko: 단추가 떨어졌어요.
extras:
  grammar_ko:
  - el pantalón과 los pantalones는 뜻이 같아요. 바지 한 벌을 말할 때 어느 쪽을 써도 돼요.
  - 짝을 이루는 것은 복수로 자주 써요. los zapatos, las botas, los calcetines, los guantes처럼요.
  - llevar는 '입고 있다'예요. Lleva un abrigo는 지금 입은 상태, Se pone un abrigo는 입는 동작이에요.
  - el jersey는 복수가 los jerséis예요. 끝의 y가 i로 바뀌고 부호가 붙어요.
  cognates:
  - es: el botón
    en: button
    note_ko: 철자가 닮았어요. 강세는 끝 음절에 와요.
  - es: las botas
    en: boots
    note_ko: 복수 -s까지 같아서 외우기 쉬워요.
  - es: el pantalón
    en: pants
    note_ko: 영어 pants는 pantaloons를 줄인 말이라 뿌리가 같아요.
  - es: el jersey
    en: jersey
    note_ko: 스페인어로는 '스웨터'예요. j를 ㅎ으로 읽어요.
  false_friend:
    es: la ropa
    en: rope
    note_ko: la ropa는 '옷'이에요. 밧줄 rope는 la cuerda라고 해요.
  fun_fact_ko: el jersey는 영어에서 들어온 말이에요. 스페인에서는 스웨터를 이렇게 불러요.
