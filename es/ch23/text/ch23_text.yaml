word_order:
  tema: Ponerse la ropa
  tema_sub_ko: ponerse — 대명사 두 개를 동사 끝에
  point_ko: 재귀 ponerse + 대명사 두 개 붙이기
  lead_ko: 옷을 입을 때는 me pongo를 써요. 긍정 명령과 동사원형에서는 대명사 두 개를 동사 끝에 붙이고, 그 밖에는 앞에 둬요.
  sentences:
  - es: Me pongo el abrigo. · ¡Póntelo!
    en: I put on my coat. · Put it on!
    ko: 외투를 입어요. · 그거 입어!
    note_ko: 긍정 명령은 te + lo를 동사 끝에 붙여요
    tokens:
    - es: Me
      gloss_ko: 나 자신(에게)
    - es: pongo
      gloss_ko: 입는다
    - es: el abrigo.
      gloss_ko: 그 외투
    - es: · ¡Póntelo!
      gloss_ko: 입어+네게+그것
    highlight: [0, 3]
  - es: ¿La chaqueta? Me la pongo.
    en: The jacket? I'll put it on.
    ko: 재킷이요? 입을게요.
    note_ko: la(그것)는 me 뒤, 동사 앞
    tokens:
    - es: ¿La
      gloss_ko: 그
    - es: chaqueta?
      gloss_ko: 재킷?
    - es: Me
      gloss_ko: 나 자신(에게)
    - es: la
      gloss_ko: 그것을
    - es: pongo
      gloss_ko: 입는다
    highlight: [2, 3]
  - es: ¿Los zapatos? Voy a ponérmelos.
    en: The shoes? I'm going to put them on.
    ko: 신발이요? 신을 거예요.
    note_ko: 동사원형 끝에 me + los · 강세 표시가 붙어요
    tokens:
    - es: ¿Los
      gloss_ko: 그
    - es: zapatos?
      gloss_ko: 신발들?
    - es: Voy
      gloss_ko: 간다
    - es: a
      gloss_ko: ~하러
    - es: ponérmelos
      gloss_ko: 신기+나+그것들
    highlight: [4]
  - es: ¿El jersey? ¡Póntelo, hace frío!
    en: The jumper? Put it on, it's cold!
    ko: 스웨터요? 입어, 추워!
    note_ko: 긍정 명령에서는 앞에 두지 않아요
    tokens:
    - es: ¿El jersey?
      gloss_ko: 그 스웨터?
    - es: ¡Póntelo,
      gloss_ko: 입어+네게+그것
    - es: hace
      gloss_ko: ~하다
    - es: frío!
      gloss_ko: 추위
    highlight: [1]
  - es: ¿La bufanda? ¡Quítatela!
    en: The scarf? Take it off!
    ko: 목도리요? 벗어!
    note_ko: quitarse(벗다)도 틀이 같아요
    tokens:
    - es: ¿La bufanda?
      gloss_ko: 그 목도리?
    - es: ¡Quítatela!
      gloss_ko: 벗어+네게+그것
    highlight: [1]
  patterns:
  - title_ko: 옷 이름을 대명사로
    items:
    - es: Me pongo el jersey.
      en: I put on the jumper.
      ko: 스웨터를 입어요.
    - es: Me lo pongo.
      en: I put it on.
      ko: 그걸 입어요.
    - es: Me pongo las botas.
      en: I put on the boots.
      ko: 부츠를 신어요.
    - es: Me las pongo.
      en: I put them on.
      ko: 그걸 신어요.
  - title_ko: 옷의 성·수를 따라요
    items:
    - es: el sombrero → Póntelo.
      tag: m
      ko: 그 모자 써.
    - es: la gorra → Póntela.
      tag: f
      ko: 그 모자 써.
    - es: los guantes → Póntelos.
      tag: m pl
      ko: 그 장갑 껴.
    - es: las botas → Póntelas.
      tag: f pl
      ko: 그 부츠 신어.
  - title_ko: 붙이면 강세 표시
    items:
    - es: pon → ponte → póntelo
      lit: pon + te + lo
      en: put it on
      ko: 그거 입어
    - es: poner → ponérmelo
      lit: poner + me + lo
      en: to put it on
      ko: 그걸 입기
    - es: quita → quítate → quítatelo
      lit: quita + te + lo
      en: take it off
      ko: 그거 벗어
  contrast:
    title_ko: 대명사 자리
    items:
    - es: Me lo pongo.
      label_ko: 활용된 동사 앞에
      ko: 그걸 입어요.
    - es: ¡Póntelo!
      label_ko: 긍정 명령 끝에
      ko: 그거 입어!
    - es: Voy a ponérmelo.
      label_ko: 동사원형 끝에
      ko: 그걸 입을 거예요.
    - es: Me lo voy a poner.
      label_ko: 앞에 둬도 같은 뜻
      ko: 그걸 입을 거예요.
  subject:
    title_ko: 나 · 너 · 그
    items:
    - es: (Yo) me pongo el abrigo.
      ko: 나는 외투를 입어요.
    - es: (Tú) te pones el abrigo.
      ko: 너는 외투를 입어.
    - es: (Ella) se pone el abrigo.
      ko: 그녀는 외투를 입어요.
  extra_notes_ko:
  - 대명사가 둘이면 '사람(me·te·se) + 물건(lo·la·los·las)' 순서예요. ch13에서 본 me lo와 같아요. 한 단어로 붙이면 강세 자리를 지키려고 악센트 부호가 생겨요.
  - ponerse는 '자기 몸에 걸치다'라서 옷, 신발, 모자, 장갑에 모두 써요. 한국어처럼 입다, 신다, 쓰다, 끼다로 나누지 않아요. 반대말은 quitarse예요.
