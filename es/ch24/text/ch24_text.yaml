  ko: 3월에 파야를 태워요.
variants:
- es: la falla
  alt: las Fallas (축제 이름은 대문자 복수)
- es: el ninot
  alt: el muñeco (스페인어로 '인형')
- es: la hoguera
  alt: la fogata (같은 뜻) · la foguera (발렌시아어)
- es: el traje
  alt: el traje de fallera (파야스 여성 의상)
- es: el farolillo
  alt: el farol (더 큰 등)
scenes:
- es: ¿Cuándo son las Fallas?
  en: When is Las Fallas?
  ko: 파야스는 언제예요?
- es: Las Fallas son en marzo.
  en: Las Fallas is in March.
  ko: 파야스는 3월에 열려요.
- es: ¿Dónde está el museo de los ninots?
  en: Where's the ninot museum?
  ko: 니놋 박물관이 어디예요?
- es: Mañana volvemos a casa en avión.
  en: Tomorrow we fly home.
  ko: 내일 비행기로 집에 돌아가요.
- es: ¡Hasta pronto, València!
  en: See you soon, València!
  ko: 발렌시아, 또 만나요!
extras:
  grammar_ko:
  - mañana는 '내일'이고, la mañana는 '아침, 오전'이에요. por la mañana는 '오전에'예요.
  - a + el은 al로 줄여요. 그래서 a el museo가 아니라 al museo예요.
  - 달 이름 앞에는 en을 쓰고 소문자로 적어요. en marzo, en mayo처럼요.
  - la mascletà는 발렌시아어에서 온 말이에요. 끝 음절 강세를 à로 표시해요.
  cognates:
  - es: la música
    en: music
    note_ko: 악센트 부호가 첫 음절 강세를 알려 줘요.
  - es: la procesión
    en: procession
    note_ko: 영어 -ssion이 스페인어에서는 -sión이 돼요.
  - es: el confeti
    en: confetti
    note_ko: 이탈리아어에서 온 말이에요. 스페인어는 t가 하나예요.
  false_friend:
    es: la cena
    en: scene
    note_ko: la cena는 '저녁 식사'예요. 장면 scene은 la escena라고 해요.
  fun_fact_ko: 해마다 불길에서 구한 니놋(ninot indultat)은 파야스 박물관에 모여요.
