word_order:
  tema: Cuándo, dónde y cómo
  tema_sub_ko: 종합 — 시간 · 장소 · 방식의 순서
  point_ko: '종합: 시간 · 장소 · 방식의 순서와 강조'
  lead_ko: 시간은 문장 앞에, 장소와 방식은 동사 뒤에 두는 순서가 무난해요. 강조하고 싶은 말은 맨 앞으로 옮겨요.
  sentences:
  - es: Mañana vamos a la plaza en metro.
    en: Tomorrow we go to the square by metro.
    ko: 내일 지하철로 광장에 가요.
    note_ko: 시간 + 동사 + 장소 + 방식
    tokens:
    - es: Mañana
      gloss_ko: 내일
    - es: vamos
      gloss_ko: 간다(우리)
    - es: a la plaza
      gloss_ko: 그 광장으로
    - es: en metro
      gloss_ko: 지하철로
    highlight: [0, 2, 3]
  - es: Esta tarde vamos al museo a pie.
    en: This afternoon we walk to the museum.
    ko: 오후에 걸어서 박물관에 가요.
    note_ko: 같은 순서 · a pie도 방식이에요
    tokens:
    - es: Esta tarde
      gloss_ko: 오늘 오후
    - es: vamos
      gloss_ko: 간다(우리)
    - es: al museo
      gloss_ko: 그 박물관으로
    - es: a pie
      gloss_ko: 걸어서
    highlight: [0, 2, 3]
  - es: Hoy vamos a la feria en autobús.
    en: Today we're going to the fair by bus.
    ko: 오늘 버스로 장터에 가요.
    note_ko: 한국어는 방식이 먼저, 스페인어는 장소가 먼저
    tokens:
    - es: Hoy
      gloss_ko: 오늘
    - es: vamos
      gloss_ko: 간다(우리)
    - es: a la feria
      gloss_ko: 그 장터로
    - es: en autobús
      gloss_ko: 버스로
    highlight: [0, 2, 3]
  - es: En marzo hay fiesta en València.
    en: In March there's a festival in València.
    ko: 3월에 발렌시아에 축제가 있어요.
    note_ko: hay 앞에 시간 · 뒤에 장소
    tokens:
    - es: En marzo
      gloss_ko: 3월에
    - es: hay
      gloss_ko: 있다
    - es: fiesta
      gloss_ko: 축제
    - es: en València
      gloss_ko: 발렌시아에
    highlight: [0, 3]
  - es: A la plaza vamos mañana en metro.
    en: To the square we go tomorrow by metro.
    ko: 광장에는 내일 지하철로 가요.
    note_ko: 강조하려면 장소를 맨 앞으로
    tokens:
    - es: A la plaza
      gloss_ko: 그 광장으로
    - es: vamos
      gloss_ko: 간다(우리)
    - es: mañana
      gloss_ko: 내일
    - es: en metro
      gloss_ko: 지하철로
    highlight: [0]
  patterns:
  - title_ko: 언제 (시간)
    items:
    - es: hoy
      en: today
      ko: 오늘
    - es: mañana
      en: tomorrow
      ko: 내일
    - es: esta noche
      en: tonight
      ko: 오늘 밤
    - es: en marzo
      en: in March
      ko: 3월에
  - title_ko: 어디로 (장소)
    items:
    - es: a la plaza
      tag: a
      ko: 광장으로
    - es: al museo
      tag: a + el
      ko: 박물관으로
    - es: en València
      tag: en
      ko: 발렌시아에
    - es: por la calle
      tag: por
      ko: 거리를 따라
  - title_ko: 어떻게 (방식)
    items:
    - es: en metro
      lit: in · metro
      en: by metro
      ko: 지하철로
    - es: a pie
      lit: on · foot
      en: on foot
      ko: 걸어서
    - es: con mi familia
      lit: with · my · family
      en: with my family
      ko: 가족과 함께
  contrast:
    title_ko: 앞에 둔 말이 강조돼요
    items:
    - es: Mañana voy a la plaza en metro.
      label_ko: '기본: 시간이 앞'
      ko: 내일 지하철로 광장에 가요.
    - es: A la plaza voy mañana en metro.
      label_ko: '강조: 장소'
      ko: 광장에는 내일 지하철로 가요.
    - es: En metro voy a la plaza mañana.
      label_ko: '강조: 방식'
      ko: 지하철로 내일 광장에 가요.
  subject:
    title_ko: 지금까지 배운 어순으로
    items:
    - es: Me gustan las flores.
      ko: 꽃을 좋아해요.
    - es: Se prohíbe tocar el ninot.
      ko: 니놋을 만지면 안 돼요.
    - es: El ninot que me gusta es este.
      ko: 제가 좋아하는 니놋은 이거예요.
  extra_notes_ko:
  - 스페인어 어순은 꽤 자유로워서 시간을 문장 끝에 둬도 틀리지 않아요. Vamos a la plaza mañana도 맞는 말이에요. 다만 맨 앞에 둔 말에 무게가 실려요.
  - 장소와 방식은 보통 '어디로 + 어떻게' 순서예요. 한국어 '지하철로 광장에'와 반대라서 처음에는 자주 헷갈려요. 대표 예문을 통째로 외워 두면 편해요.
