word_order:
  tema: Dos sitios para el pronombre
  tema_sub_ko: 진행형 — 대명사 자리는 두 곳
  point_ko: '진행형: 대명사 자리 두 가지'
  lead_ko: estar + -ndo는 ‘지금 ~하는 중’이에요. 대명사는 estar 앞에 두거나 -ndo 끝에 붙이고, 뜻은 같아요.
  sentences:
  - es: Me estoy bañando. = Estoy bañándome.
    en: I'm swimming right now.
    ko: 지금 수영하고 있어요.
    note_ko: me는 estar 앞이나 -ndo 끝 · 붙이면 강세 부호
    tokens:
    - es: Me
      gloss_ko: 나 자신을
    - es: estoy
      gloss_ko: 있다(나는)
    - es: bañando. =
      gloss_ko: 담그는 중
    - es: Estoy
      gloss_ko: 있다(나는)
    - es: bañándome
      gloss_ko: 담그는 중+나
    highlight: [0, 4]
  - es: ¿La crema? Me la estoy poniendo.
    en: The sunscreen? I'm putting it on.
    ko: 선크림이요? 지금 바르고 있어요.
    note_ko: 대명사 두 개도 함께 estar 앞에 · 사람이 먼저
    tokens:
    - es: ¿La crema?
      gloss_ko: 그 크림?
    - es: Me
      gloss_ko: 내 몸에
    - es: la
      gloss_ko: 그것을
    - es: estoy
      gloss_ko: 있다(나는)
    - es: poniendo
      gloss_ko: 바르는 중
    highlight: [1, 2]
  - es: ¿La crema? Estoy poniéndomela.
    en: The sunscreen? I'm putting it on.
    ko: 선크림이요? 지금 바르고 있어요.
    note_ko: 끝에 붙일 때도 me가 먼저, la가 뒤
    tokens:
    - es: ¿La crema?
      gloss_ko: 그 크림?
    - es: Estoy
      gloss_ko: 있다(나는)
    - es: poniéndomela
      gloss_ko: 바름+내게+그걸
    highlight: [2]
  - es: ¿El helado? Lo estoy comiendo.
    en: The ice cream? I'm eating it.
    ko: 아이스크림요? 지금 먹고 있어요.
    note_ko: 직접목적 lo도 같은 자리 · = Estoy comiéndolo.
    tokens:
    - es: ¿El helado?
      gloss_ko: 그 아이스크림?
    - es: Lo
      gloss_ko: 그것을
    - es: estoy
      gloss_ko: 있다(나는)
    - es: comiendo
      gloss_ko: 먹는 중
    highlight: [1]
  - es: El socorrista nos está mirando.
    en: The lifeguard is watching us.
    ko: 안전 요원이 우리를 보고 있어요.
    note_ko: 주어는 맨 앞 · nos는 está 앞이나 mirando 끝
    tokens:
    - es: El
      gloss_ko: 그
    - es: socorrista
      gloss_ko: 안전 요원
    - es: nos
      gloss_ko: 우리를
    - es: está
      gloss_ko: 있다
    - es: mirando
      gloss_ko: 보는 중
    highlight: [2]
  patterns:
  - title_ko: -ndo 만들기
    items:
    - es: tomar → tomando
      en: -ar → -ando
      ko: (볕을) 쬐는 중
    - es: bañar → bañando
      en: -ar → -ando
      ko: 담그는 중
    - es: comer → comiendo
      en: -er → -iendo
      ko: 먹는 중
    - es: salir → saliendo
      en: -ir → -iendo
      ko: 나가는 중
  - title_ko: 붙이면 강세 부호
    items:
    - es: bañando → bañándome
      ko: 나를 담그며
    - es: comiendo → comiéndolo
      ko: 그것을 먹으며
    - es: poniendo → poniéndome
      ko: 내 몸에 바르며
    - es: mirando → mirándonos
      ko: 우리를 보며
  contrast:
    title_ko: me의 자리
    items:
    - es: Me estoy poniendo crema.
      label_ko: estar 앞에
      ko: 크림을 바르고 있어요.
    - es: Estoy poniéndome crema.
      label_ko: -ndo 끝에 붙여서
      ko: 크림을 바르고 있어요.
  subject:
    title_ko: estar로 주어 알기
    items:
    - es: (Yo) estoy nadando.
      ko: 나는 헤엄치고 있어요.
    - es: (Tú) estás nadando.
      ko: 너는 헤엄치고 있어.
    - es: (Ella) está nadando.
      ko: 그녀는 헤엄치고 있어요.
  extra_notes_ko:
  - '-ndo 끝에 대명사가 붙으면 강세 자리를 지키려고 부호를 찍어요: bañando → bañándome. 읽는 강세는 달라지지 않아요.'
  - bañarse는 바다에 들어가 몸을 담그는 일이고, nadar는 헤엄치는 일이에요. 한국어로는 둘 다 ‘수영하다’로 옮길 때가 많아요.
practice:
- tiles: [bañando, Me, estoy]
  answer: Me estoy bañando.
  ko: 지금 수영하고 있어요.
- tiles: [bañándome, Estoy]
  answer: Estoy bañándome.
  ko: 지금 수영하고 있어요.
- tiles: [comiendo, estoy, Lo]
  answer: Lo estoy comiendo.
  ko: 지금 그걸 먹고 있어요.
- tiles: [la, poniendo, Me, estoy]
  answer: Me la estoy poniendo.
  ko: 지금 그걸 바르고 있어요.
- tiles: [sol, Estoy, el, tomando]
  answer: Estoy tomando el sol.
  ko: 일광욕을 하고 있어요.
