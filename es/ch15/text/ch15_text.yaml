scenes:
- es: ¿Cuánto cuesta alquilar una hamaca?
  en: How much to rent a sun lounger?
  ko: 선베드 빌리는 데 얼마예요?
- es: ¿Está fría el agua?
  en: Is the water cold?
  ko: 물이 차가워요?
- es: Me estoy poniendo crema solar.
  en: I'm putting on sunscreen.
  ko: 선크림 바르고 있어요.
- es: ¿Hay socorrista en esta playa?
  en: Is there a lifeguard on this beach?
  ko: 이 해변에 안전 요원이 있어요?
- es: ¿Me guardas la bolsa? Voy a bañarme.
  en: Can you watch my bag? I'm going in.
  ko: 가방 봐줄래요? 수영하러 가요.
- es: Un helado de limón, por favor.
  en: A lemon ice cream, please.
  ko: 레몬 아이스크림 하나 주세요.
extras:
  grammar_ko:
  - el socorrista는 -a로 끝나도 남성이에요. 여자 안전 요원은 la socorrista라고 해요.
  - las gafas는 늘 복수로 써요. 안경 하나를 가리킬 때도 las gafas예요.
  - el mar는 보통 남성으로 쓰지만, 뱃사람의 말이나 시에서는 la mar도 나와요.
  cognates:
  - es: la arena
    en: arena
    note_ko: 영어 arena는 라틴어로 ‘모래’였던 말에서 왔어요.
  - es: la roca
    en: rock
    note_ko: 철자와 소리가 비슷해요.
  - es: el puerto
    en: port
    note_ko: 둘 다 라틴어 portus에서 왔어요.
  fun_fact_ko: 라 칼레타 해변은 산 세바스티안 성과 산타 카탈리나 성 사이에 있어요.
