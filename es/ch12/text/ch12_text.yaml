word_order:
  tema: Siga recto y gire
  tema_sub_ko: 어순 — 대명사는 동사 끝에
  point_ko: '긍정 명령: 대명사는 동사 끝에 붙임'
  lead_ko: 길을 알려 줄 때는 동사로 바로 시작해요. me, lo 같은 대명사는 동사 끝에 붙여 한 단어로 써요.
  sentences:
  - es: Siga recto y gire a la derecha.
    en: Go straight and turn right.
    ko: 직진하다가 오른쪽으로 도세요.
    note_ko: 명령은 동사로 시작 · siga(계속 가다), gire(돌다)
    tokens:
    - es: Siga
      gloss_ko: 계속 가다
    - es: recto
      gloss_ko: 곧장
    - es: 'y'
      gloss_ko: 그리고
    - es: gire
      gloss_ko: 돌다
    - es: a la derecha
      gloss_ko: 오른쪽으로
    highlight: [0, 3]
  - es: Sígame, por favor.
    en: Follow me, please.
    ko: 따라오세요.
    note_ko: siga + me = sígame · 악센트를 찍어요
    tokens:
    - es: Sígame,
      gloss_ko: 나를 따라오다
    - es: por favor
      gloss_ko: 부탁해요
    highlight: [0]
  - es: Dígame el nombre de la calle.
    en: Tell me the name of the street.
    ko: 거리 이름을 말해 주세요.
    note_ko: diga + me = dígame · 목적어는 그 뒤에 와요
    tokens:
    - es: Dígame
      gloss_ko: 나에게 말하다
    - es: el nombre
      gloss_ko: 그 이름
    - es: de
      gloss_ko: ~의
    - es: la calle
      gloss_ko: 그 거리
    highlight: [0]
  - es: Enséñeme el mapa, por favor.
    en: Show me the map, please.
    ko: 지도 좀 보여 주세요.
    note_ko: enseñe + me = enséñeme · 강세 자리는 그대로
    tokens:
    - es: Enséñeme
      gloss_ko: 나에게 보이다
    - es: el mapa,
      gloss_ko: 그 지도
    - es: por favor
      gloss_ko: 부탁해요
    highlight: [0]
  - es: Mírelo en el mapa.
    en: Look at it on the map.
    ko: 지도에서 그걸 보세요.
    note_ko: lo(그것을)도 명령에서는 동사 끝 · mire + lo
    tokens:
    - es: Mírelo
      gloss_ko: 그것을 보다
    - es: en
      gloss_ko: ~에서
    - es: el mapa
      gloss_ko: 그 지도
    highlight: [0]
  patterns:
  - title_ko: usted와 tú의 명령
    items:
    - es: Siga recto.
      en: Go straight.
      tag: usted
      ko: 직진하세요.
    - es: Sigue recto.
      en: Go straight.
      tag: tú
      ko: 직진해.
    - es: Gire a la derecha.
      en: Turn right.
      tag: usted
      ko: 오른쪽으로 도세요.
    - es: Gira a la derecha.
      en: Turn right.
      tag: tú
      ko: 오른쪽으로 돌아.
    - es: Sígame.
      en: Follow me.
      tag: usted
      ko: 따라오세요.
    - es: Sígueme.
      en: Follow me.
      tag: tú
      ko: 따라와.
  - title_ko: de로 잇는 위치 말
    items:
    - es: al lado de la plaza
      en: next to the square
      ko: 광장 옆에
    - es: enfrente de la iglesia
      en: opposite the church
      ko: 성당 맞은편에
    - es: detrás de la catedral
      en: behind the cathedral
      ko: 대성당 뒤에
    - es: delante de la señal
      en: in front of the sign
      ko: 표지판 앞에
  contrast:
    title_ko: me의 자리
    items:
    - es: Sígame.
      label_ko: 긍정 명령은 끝에
      ko: 따라오세요.
    - es: No me siga.
      label_ko: 부정 명령은 앞에
      ko: 따라오지 마세요.
    - es: Usted me sigue.
      label_ko: 평서문도 앞에
      ko: 당신은 저를 따라와요.
  extra_notes_ko:
  - 대명사를 붙이면 단어가 길어져서 원래 강세 자리에 악센트를 찍어요. siga → sígame, mire → mírelo, enseñe → enséñeme처럼요. 소리 나는 자리는 그대로예요.
  - 모르는 사람에게 길을 알려 줄 때는 보통 usted 모양(siga, gire, tome)으로 말해요. 친구끼리는 tú 모양(sigue, gira, toma)을 써요.
