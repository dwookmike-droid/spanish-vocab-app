scenes:
- es: Perdón, ¿cómo se va a la catedral?
  en: How do I get to the cathedral?
  ko: 저기요, 대성당에 어떻게 가요?
- es: Siga todo recto hasta el final.
  en: Go straight on to the end.
  ko: 끝까지 쭉 가세요.
- es: Gire en la primera esquina.
  en: Turn at the first corner.
  ko: 첫 번째 모퉁이에서 도세요.
- es: Está a cinco minutos a pie.
  en: It's a five-minute walk.
  ko: 걸어서 5분 거리예요.
- es: ¿Está lejos de aquí?
  en: Is it far from here?
  ko: 여기서 멀어요?
- es: Me he perdido. ¿Puede ayudarme?
  en: I'm lost. Can you help me?
  ko: 길을 잃었어요. 도와주시겠어요?
extras:
  grammar_ko:
  - recto만 써도, todo recto라고 해도 ‘곧장’이에요. todo를 넣으면 ‘쭉’ 하는 느낌이 더해져요.
  - delante de는 ‘바로 앞에’, enfrente de는 ‘길 건너 맞은편에’에 가까워요.
  - el mapa는 -a로 끝나도 남성이에요. 관사까지 한 덩어리로 외워요.
  - de 뒤에 el이 오면 del로 줄어요. al lado del parque, delante del banco처럼요.
  cognates:
  - es: el mapa
    en: map
    note_ko: 둘 다 라틴어 mappa에서 왔어요.
  - es: el norte
    en: north
    note_ko: 소리가 닮았어요. el sur와 south도 그래요.
  - es: la señal
    en: signal
    note_ko: 철자가 닮았지만 여기서는 길가의 표지판을 가리켜요.
  false_friend:
    es: la cuesta
    en: coast
    note_ko: la cuesta는 비탈길이에요. 영어 coast(해안)는 스페인어로 la costa예요.
  fun_fact_ko: 톨레도 Zocodover 광장의 이름은 ‘가축 시장’을 뜻하는 아랍어에서 왔어요.
