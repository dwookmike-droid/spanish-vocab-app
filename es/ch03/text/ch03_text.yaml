word_order:
  tema: ¿Dónde está?
  tema_sub_ko: 위치 — 옆에, 뒤에, 위에, 아래에
  point_ko: 위치 전치사구 · 명사 + está + al lado de …
  lead_ko: 물건을 먼저 말하고 está를 놓은 뒤 위치 표현을 이어요. 위치 말이 기준 명사보다 앞에 와요.
  sentences:
  - es: El sofá está al lado de la ventana.
    en: The sofa is next to the window.
    ko: 소파는 창문 옆에 있어요.
    note_ko: 위치(al lado de)가 기준(la ventana)보다 먼저
    tokens:
    - es: El sofá
      gloss_ko: 그 소파
    - es: está
      gloss_ko: 있다
    - es: al lado de
      gloss_ko: ~의 옆에
    - es: la ventana
      gloss_ko: 그 창문
    highlight: [2]
  - es: La lámpara está detrás del sillón.
    en: The lamp is behind the armchair.
    ko: 램프는 안락의자 뒤에 있어요.
    note_ko: de + el은 del로 합쳐요
    tokens:
    - es: La lámpara
      gloss_ko: 그 램프
    - es: está
      gloss_ko: 있다
    - es: detrás del
      gloss_ko: 그 ~의 뒤에
    - es: sillón
      gloss_ko: 안락의자
    highlight: [2]
  - es: La alfombra está debajo de la mesa.
    en: The rug is under the table.
    ko: 양탄자는 탁자 아래에 있어요.
    note_ko: debajo de는 ‘아래에’ · la 앞에서는 합치지 않아요
    tokens:
    - es: La alfombra
      gloss_ko: 그 양탄자
    - es: está
      gloss_ko: 있다
    - es: debajo de
      gloss_ko: ~의 아래에
    - es: la mesa
      gloss_ko: 그 탁자
    highlight: [2]
  - es: El cuadro está encima del sofá.
    en: The painting is above the sofa.
    ko: 그림은 소파 위에 있어요.
    note_ko: encima de는 ‘위에’ · 닿아 있지 않아도 써요
    tokens:
    - es: El cuadro
      gloss_ko: 그 그림
    - es: está
      gloss_ko: 있다
    - es: encima del
      gloss_ko: 그 ~의 위에
    - es: sofá
      gloss_ko: 소파
    highlight: [2]
  - es: La planta está entre dos sillas.
    en: The plant is between two chairs.
    ko: 식물은 의자 둘 사이에 있어요.
    note_ko: entre(사이에)는 de 없이 바로 명사가 와요
    tokens:
    - es: La planta
      gloss_ko: 그 식물
    - es: está
      gloss_ko: 있다
    - es: entre
      gloss_ko: ~ 사이에
    - es: dos sillas
      gloss_ko: 두 의자
    highlight: [2]
  patterns:
  - title_ko: 위치 표현
    items:
    - es: al lado de
      en: next to
      ko: ~ 옆에
    - es: delante de
      en: in front of
      ko: ~ 앞에
    - es: detrás de
      en: behind
      ko: ~ 뒤에
    - es: encima de
      en: on, above
      ko: ~ 위에
    - es: debajo de
      en: under
      ko: ~ 아래에
    - es: enfrente de
      en: opposite
      ko: ~ 맞은편에
  - title_ko: de + el = del
    items:
    - es: al lado del sofá
      en: next to the sofa
      ko: 소파 옆에
    - es: detrás del sillón
      en: behind the armchair
      ko: 안락의자 뒤에
    - es: delante de la puerta
      en: in front of the door
      ko: 문 앞에
    - es: encima de la mesa
      en: on the table
      ko: 탁자 위에
  contrast:
    title_ko: está와 hay, 다시 보기
    items:
    - es: El libro está en la mesa.
      label_ko: 아는 물건 + está
      ko: 그 책은 탁자에 있어요.
    - es: Hay un libro en la mesa.
      label_ko: hay + 처음 말하는 물건
      ko: 탁자에 책이 한 권 있어요.
    - es: Al lado del sofá hay una planta.
      label_ko: 위치를 앞에 두기도 해요
      ko: 소파 옆에 식물이 있어요.
  subject:
    title_ko: 주어 없이 답하기
    items:
    - es: ¿Dónde está el mando?
      ko: 리모컨이 어디 있어요?
    - es: Está en el sofá.
      ko: 소파에 있어요.
    - es: Está debajo del cojín.
      ko: 쿠션 밑에 있어요.
  extra_notes_ko:
  - al lado de, detrás de, encima de 같은 위치 표현은 de까지 한 덩어리로 외워요. 뒤에 el이 오면 de + el이 del로 합쳐져서 al lado del sofá가 돼요.
  - 한국어는 ‘창문 옆에’처럼 기준이 먼저 나오지만 스페인어는 al lado de la ventana처럼 위치 말이 먼저 나와요. 말하는 순서가 거꾸로라고 기억해 두면 편해요.
