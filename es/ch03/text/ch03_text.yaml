scenes:
- es: ¿Dónde está el mando?
  en: Where's the remote?
  ko: 리모컨이 어디 있어요?
- es: Está debajo del cojín.
  en: It's under the cushion.
  ko: 쿠션 밑에 있어요.
- es: Siéntate en el sofá.
  en: Sit on the sofa.
  ko: 소파에 앉아요.
- es: ¿Puedes cerrar la ventana?
  en: Can you close the window?
  ko: 창문 좀 닫아 줄래요?
- es: Apaga la tele, por favor.
  en: Turn off the TV, please.
  ko: 텔레비전 좀 꺼 주세요.
extras:
  grammar_ko:
  - el sofá는 -á로 끝나지만 남성이에요. 관사까지 한 덩어리로 외워 두세요.
  - la pared와 la televisión은 여성이에요. -d나 -sión으로 끝나는 명사는 대부분 여성이에요.
  - a + el은 al, de + el은 del로 합쳐요. la 앞에서는 a la mesa, de la mesa처럼 그대로 둬요.
  - el reloj의 끝소리 j는 아주 약해서 말할 때 거의 안 들리기도 해요.
  cognates:
  - es: el sofá
    en: sofa
    note_ko: 둘 다 아랍어 ṣuffa에서 온 말이에요.
  - es: la lámpara
    en: lamp
    note_ko: 둘 다 ‘횃불’을 뜻하는 그리스어 lampas에서 왔어요.
  - es: la televisión
    en: television
    note_ko: tele(멀리) + visión(보기). 짜임이 영어와 같아요.
  - es: la planta
    en: plant
    note_ko: 철자가 거의 같아서 뜻이 바로 보여요.
  false_friend:
    es: la librería
    en: library
    note_ko: la librería는 서점이에요. 도서관은 la biblioteca라고 해요.
  fun_fact_ko: alfombra와 azulejo(타일)는 둘 다 아랍어에서 온 말이에요.
