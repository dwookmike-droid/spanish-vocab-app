word_order:
  tema: El orden de las palabras
  tema_sub_ko: 어순 — 명사가 먼저, 꾸밈은 뒤에
  point_ko: 명사 + 형용사 · 성·수 일치 · de 합성어 · 주어 생략
  lead_ko: 스페인어는 대부분 중심 명사가 먼저 오고 꾸미는 말이 뒤따라요. 영어와 순서가 다른 자리에 적갈색 밑줄을 그었어요.
  sentences:
  - es: Me lavo los dientes.
    en: I brush my teeth.
    ko: 이를 닦아요.
    note_ko: me(나 자신)는 동사 앞 · 영어 my 대신 정관사 los
    tokens:
    - es: Me
      gloss_ko: 나 자신(의)
    - es: lavo
      gloss_ko: 씻는다
    - es: los
      gloss_ko: 그
    - es: dientes
      gloss_ko: 이들
    highlight: [0, 2]
  - es: Me cepillo el pelo.
    en: I brush my hair.
    ko: 머리를 빗어요.
    note_ko: '같은 틀: me + 동사 + 정관사 + 신체 부위'
    tokens:
    - es: Me
      gloss_ko: 나 자신(의)
    - es: cepillo
      gloss_ko: 빗는다
    - es: el
      gloss_ko: 그
    - es: pelo
      gloss_ko: 머리카락
    highlight: [0, 2]
  - es: Necesito una toalla limpia.
    en: I need a clean towel.
    ko: 깨끗한 수건이 하나 필요해요.
    note_ko: 주어 yo 없이 동사로 시작 · 형용사는 명사 뒤
    tokens:
    - es: Necesito
      gloss_ko: 필요하다(나는)
    - es: una
      gloss_ko: 하나의
    - es: toalla
      gloss_ko: 수건
    - es: limpia
      gloss_ko: 깨끗한
    highlight: [0, 3]
  - es: No hay papel higiénico.
    en: There's no toilet paper.
    ko: 화장지가 없어요.
    note_ko: no는 동사 바로 앞 · 종이 + 위생의 순서
    tokens:
    - es: 'No'
      gloss_ko: 안
    - es: hay
      gloss_ko: 있다
    - es: papel
      gloss_ko: 종이
    - es: higiénico
      gloss_ko: 위생의
    highlight: [0, 3]
  - es: ¿El jabón? Lo dejo en el lavabo.
    en: The soap? I leave it on the sink.
    ko: 비누요? 세면대에 둬요.
    note_ko: 목적어 lo(그것을)는 동사 앞 · 영어 it은 동사 뒤
    tokens:
    - es: ¿El jabón?
      gloss_ko: 그 비누?
    - es: Lo
      gloss_ko: 그것을
    - es: dejo
      gloss_ko: 둔다
    - es: en
      gloss_ko: ~에
    - es: el lavabo
      gloss_ko: 그 세면대
    highlight: [1]
  patterns:
  - title_ko: 명사 + 형용사
    items:
    - es: la toalla blanca
      en: the white towel
      ko: 하얀 수건
    - es: el jabón nuevo
      en: the new soap
      ko: 새 비누
    - es: las toallas limpias
      en: the clean towels
      ko: 깨끗한 수건들
  - title_ko: 성·수 일치
    items:
    - es: el espejo limpio
      tag: m
      ko: 깨끗한 거울
    - es: la toalla limpia
      tag: f
      ko: 깨끗한 수건
    - es: los peines limpios
      tag: m pl
      ko: 깨끗한 빗들
    - es: las tijeras limpias
      tag: f pl
      ko: 깨끗한 가위
  - title_ko: de로 잇는 말 · 뒤에서 꾸미기
    items:
    - es: el cepillo de dientes
      lit: brush · of · teeth
      en: toothbrush
      ko: 칫솔
    - es: la pasta de dientes
      lit: paste · of · teeth
      en: toothpaste
      ko: 치약
    - es: el secador de pelo
      lit: dryer · of · hair
      en: hair dryer
      ko: 헤어드라이어
    - es: el papel higiénico
      lit: paper · hygienic
      en: toilet paper
      ko: 화장지
  contrast:
    title_ko: me의 자리
    items:
    - es: Me lavo los dientes.
      label_ko: 활용된 동사 앞에
      ko: 이를 닦아요.
    - es: Voy a lavarme los dientes.
      label_ko: 동사원형 끝에 붙여서
      ko: 이를 닦을 거예요.
    - es: Me voy a lavar los dientes.
      label_ko: 앞에 둬도 같은 뜻
      ko: 이를 닦을 거예요.
  subject:
    title_ko: 주어 생략
    items:
    - es: (Yo) me ducho.
      ko: 나는 샤워해요.
    - es: (Tú) te duchas.
      ko: 너는 샤워해.
    - es: (Ella) se ducha.
      ko: 그녀는 샤워해요.
  extra_notes_ko:
  - 'lavarse los dientes는 ‘(자기) 이를 닦다’예요. me가 ‘내 몸의’를 맡으니 영어 my 대신 정관사 los를 써요. me는 활용된 동사 바로 앞에 오고, 동사원형·긍정 명령에서는 끝에 붙어요: ¡Lávate los dientes! (이 닦아!)'
  - ducho(나) · duchas(너) · ducha(그·그녀·당신) — 끝만 봐도 누가 하는지 알 수 있어서 yo · tú · ella는 강조하거나 대비할 때 주로 말해요.
