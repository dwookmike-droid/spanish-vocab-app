  ko: 화장지가 다 떨어졌어요.
- es: Me lavo los dientes después de comer.
  en: I brush my teeth after eating.
  ko: 밥 먹고 나서 이를 닦아요.
extras:
  grammar_ko:
  - 스페인어 명사는 모두 남성(m) 아니면 여성(f)이에요. '그'에 해당하는 정관사는 남성 el, 여성 la, 복수는 los / las예요.
  - -o로 끝나면 대개 남성(el espejo, el inodoro), -a로 끝나면 대개 여성(la toalla, la ducha)이에요.
  - 끝 글자로 알 수 없는 단어도 많아요. el jabón, el peine, el champú, el secador처럼요. 관사까지 한 덩어리로 외우는 게 가장 확실해요.
  - 가위(las tijeras)나 슬리퍼(las chanclas)처럼 짝을 이루는 물건은 복수로 자주 써요.
  cognates:
  - es: el champú
    en: shampoo
    note_ko: 영어 shampoo를 그대로 빌려 온 말이에요.
  - es: la esponja
    en: sponge
    note_ko: 둘 다 라틴어 spongia에서 왔어요.
  - es: la toalla
    en: towel
    note_ko: 둘 다 프랑크어 *þwahilu(천)에서 왔어요.
  - es: el papel higiénico
    en: toilet paper
    note_ko: papel ≈ paper, higiénico ≈ hygienic. 철자를 보면 뜻이 짐작돼요.
  false_friend:
    es: constipado
    en: constipated
    note_ko: Estoy constipado는 '감기에 걸렸어요, 코가 막혔어요'라는 뜻이에요. 변비는 estreñido라고 해요.
  fun_fact_ko: el inodoro는 원래 '냄새가 없는'이라는 뜻의 형용사이기도 해요. (라틴어 in- + odor)
