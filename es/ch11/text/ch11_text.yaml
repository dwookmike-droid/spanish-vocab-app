extras:
  grammar_ko:
  - a + el은 al, de + el은 del로 줄여 써요. al aeropuerto, del andén처럼요. a la, de la는 줄지 않아요.
  - la moto는 -o로 끝나도 여성이에요. la motocicleta를 줄인 말이라서 그래요.
  - 스페인에서는 ‘타다’를 coger로 자주 말해요. 중남미 일부에서는 이 말이 비속어로 들려서 tomar를 써요.
  - 지폐도 el billete라고 해요. 앞뒤 말을 보고 표인지 지폐인지 구별해요.
  cognates:
  - es: el autobús
    en: bus
    note_ko: 영어 bus는 omnibus를 줄인 말이고, autobús도 이 말과 이어져요.
  - es: el aeropuerto
    en: airport
    note_ko: aero ≈ air, puerto ≈ port. 조각을 나눠 보면 뜻이 보여요.
  - es: la bicicleta
    en: bicycle
    note_ko: 철자가 닮아서 뜻이 금방 짐작돼요.
  false_friend:
    es: el coche
    en: coach
    note_ko: el coche는 자동차예요. 장거리 버스는 el autobús나 el autocar라고 해요.
  fun_fact_ko: 마드리드 Puerta del Sol에는 스페인 도로의 기점을 뜻하는 km 0 표지가 있어요.
