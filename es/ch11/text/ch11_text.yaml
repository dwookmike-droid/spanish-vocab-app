    - es: a la estación
      lit: to · the · station
      ko: 역으로
    - es: al aeropuerto
      lit: to + the · airport
      ko: 공항으로
  - title_ko: en + 교통수단 · 관사 없이
    items:
    - es: en tren
      lit: in · train
      en: by train
