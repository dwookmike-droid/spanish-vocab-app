    title_ko: a와 en의 쓰임
    items:
    - es: Voy a Madrid.
      label_ko: 장소는 a
      ko: 마드리드에 가요.
    - es: Voy en metro.
      label_ko: 탈것은 en
      ko: 지하철로 가요.
    - es: Voy a pie.
      label_ko: 걷기는 a pie
      ko: 걸어서 가요.
  subject:
    title_ko: 주어 생략
    items:
    - es: (Yo) voy a pie.
      ko: 나는 걸어가요.
    - es: (Tú) vas en metro.
      ko: 너는 지하철로 가.
    - es: (Nosotros) vamos en coche.
      ko: 우리는 차로 가요.
  extra_notes_ko:
  - 교통수단 앞에는 관사를 쓰지 않아요. en tren, en coche처럼 en 뒤에 바로 이어요. 어떤 기차인지 짚어 말할 때만 en el tren de las nueve처럼 관사를 넣어요.
  - ir의 모양은 voy, vas, va, vamos, vais, van이에요. 끝만 봐도 누가 가는지 알 수 있어서 yo, tú는 보통 말하지 않아요.
