word_order:
  tema: Voy a Toledo en tren
  tema_sub_ko: 어순 — ir a + 장소, en + 교통수단
  point_ko: '이동: ir a + 장소 · en + 교통수단 · a pie'
  lead_ko: 어디로 가는지는 a로, 무엇을 타고 가는지는 en으로 말해요. 걸어갈 때만 a pie라고 해요.
  sentences:
  - es: Voy a Toledo en tren.
    en: I'm going to Toledo by train.
    ko: 기차로 톨레도에 가요.
    note_ko: 동사 + a 장소 + en 교통수단 · 한국어와 순서가 달라요
    tokens:
    - es: Voy
      gloss_ko: 가다(나)
