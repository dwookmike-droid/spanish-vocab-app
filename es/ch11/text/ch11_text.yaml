    ko: 택시로 공항에 가요.
    note_ko: a + el은 al로 줄여요 · vamos는 ‘우리가 가다’
    tokens:
    - es: Vamos
      gloss_ko: 가다(우리)
    - es: al
      gloss_ko: 그 ~로
    - es: aeropuerto
      gloss_ko: 공항
    - es: en taxi
