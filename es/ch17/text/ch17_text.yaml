word_order:
  tema: Siempre, nunca, a veces
  tema_sub_ko: 빈도부사 — 동사 앞이 기본
  point_ko: '빈도부사 자리: Nunca juego = No juego nunca'
  lead_ko: siempre나 nunca 같은 빈도부사는 보통 동사 앞에 와요. nunca를 동사 뒤로 보내면 동사 앞에 no를 붙여요.
  sentences:
  - es: Siempre corro por la mañana.
    en: I always run in the morning.
    ko: 나는 늘 아침에 달려요.
    note_ko: 빈도부사 + 동사 · 때를 나타내는 말은 뒤에
    tokens:
    - es: Siempre
      gloss_ko: 늘
    - es: corro
      gloss_ko: 달린다
    - es: por
      gloss_ko: ~에
    - es: la mañana
      gloss_ko: 그 아침
    highlight: [0]
  - es: Nunca juego al fútbol.
    en: I never play football.
    ko: 저는 축구를 절대 안 해요.
    note_ko: nunca가 동사 앞이면 no 없이
    tokens:
    - es: Nunca
      gloss_ko: 결코
    - es: juego
      gloss_ko: 경기한다
    - es: al
      gloss_ko: ~를
    - es: fútbol
      gloss_ko: 축구
    highlight: [0]
  - es: No juego nunca al fútbol.
    en: I never play football.
    ko: 저는 축구를 절대 안 해요.
    note_ko: nunca가 동사 뒤면 no가 동사 앞에 · 뜻은 같아요
    tokens:
    - es: 'No'
      gloss_ko: 안
    - es: juego
      gloss_ko: 경기한다
    - es: nunca
      gloss_ko: 결코
    - es: al
      gloss_ko: ~를
    - es: fútbol
      gloss_ko: 축구
    highlight: [0, 2]
  - es: A veces voy a la piscina.
    en: Sometimes I go to the pool.
    ko: 가끔 수영장에 가요.
    note_ko: a veces도 동사 앞 · ir a + 장소는 그대로
    tokens:
    - es: A veces
      gloss_ko: 가끔
    - es: voy
      gloss_ko: 간다
    - es: a
      gloss_ko: ~에
    - es: la piscina
      gloss_ko: 그 수영장
    highlight: [0]
  - es: Voy al gimnasio todos los días.
    en: I go to the gym every day.
    ko: 매일 체육관에 가요.
    note_ko: todos los días는 문장 끝에 자주 와요
    tokens:
    - es: Voy
      gloss_ko: 간다
    - es: al
      gloss_ko: ~에
    - es: gimnasio
      gloss_ko: 체육관
    - es: todos
      gloss_ko: 모든
    - es: los días
      gloss_ko: 그 날들
    highlight: [3, 4]
  patterns:
  - title_ko: 얼마나 자주
    items:
    - es: siempre
      en: always
      ko: 늘
    - es: normalmente
      en: usually
      ko: 보통
    - es: a menudo
      en: often
      ko: 자주
    - es: a veces
      en: sometimes
      ko: 가끔
    - es: nunca
      en: never
      ko: 절대 안
  - title_ko: 빈도부사 + 동사
    items:
    - es: Siempre gana mi equipo.
      en: My team always wins.
      ko: 우리 팀이 늘 이겨요.
    - es: A veces voy al estadio.
      en: Sometimes I go to games.
      ko: 가끔 경기장에 가요.
    - es: Nunca veo el partido.
      en: I never watch the match.
      ko: 경기를 절대 안 봐요.
  contrast:
    title_ko: nunca의 자리
    items:
    - es: Nunca juego.
      label_ko: 동사 앞에는 no 없이
      ko: 절대 경기 안 해요.
    - es: No juego nunca.
      label_ko: 동사 뒤에는 no와 함께
      ko: 절대 경기 안 해요.
  extra_notes_ko:
  - 'siempre와 a veces는 동사 뒤나 문장 끝으로 가도 no가 따라붙지 않아요: Corro siempre por la mañana. no가 필요한 건 nunca 같은 부정어가 동사 뒤에 올 때뿐이에요.'
  - '축구처럼 공으로 하는 경기는 jugar a로 말해요: juego al fútbol. a와 el이 만나면 al이 돼요.'
practice:
