  answer: Siempre corro por la mañana.
  ko: 나는 늘 아침에 달려요.
- tiles: [fútbol, juego, Nunca, al]
  answer: Nunca juego al fútbol.
  ko: 축구를 절대 안 해요.
- tiles: [nunca, al, 'No', fútbol, juego]
  answer: No juego nunca al fútbol.
  ko: 축구를 절대 안 해요.
- tiles: [la, A, piscina, voy, a, veces]
  answer: A veces voy a la piscina.
  ko: 가끔 수영장에 가요.
- tiles: [mi, gana, equipo, Siempre]
  answer: Siempre gana mi equipo.
  ko: 우리 팀이 늘 이겨요.
