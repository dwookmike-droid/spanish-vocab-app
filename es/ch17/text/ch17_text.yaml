scenes:
- es: ¿Cómo va el partido?
  en: How's the match going?
  ko: 경기 어떻게 돼 가요?
- es: ¿Quién gana?
  en: Who's winning?
  ko: 누가 이기고 있어요?
- es: Dos entradas para el partido, por favor.
  en: Two tickets for the match, please.
  ko: 경기 입장권 두 장 주세요.
- es: ¿Dónde puedo alquilar una bicicleta?
  en: Where can I rent a bike?
  ko: 자전거 어디서 빌릴 수 있어요?
- es: Nunca me pierdo un partido.
  en: I never miss a match.
  ko: 저는 경기를 절대 안 놓쳐요.
- es: ¿Ya ha empezado el desfile?
  en: Has the parade started yet?
  ko: 행진이 벌써 시작했어요?
extras:
  grammar_ko:
  - el balón은 축구공처럼 큰 공이고, la pelota는 공을 두루 가리켜요. 테니스공처럼 작은 공은 la pelota라고 해요.
  - el campeón의 복수는 los campeones예요. 음절이 늘면서 강세 부호가 빠져요. 여성은 la campeona예요.
  - los fuegos artificiales는 ‘불들 + 인공의’ 순서예요. 명사가 앞, 형용사가 뒤이고 형용사도 복수가 돼요.
  cognates:
  - es: el fútbol
    en: football
    note_ko: 영어 football을 스페인어 소리로 옮긴 말이에요.
  - es: el estadio
    en: stadium
    note_ko: 철자가 비슷해서 뜻이 바로 보여요.
  - es: el campeón
    en: champion
    note_ko: 철자와 뜻이 비슷해요.
  false_friend:
    es: el partido
    en: party
    note_ko: el partido는 ‘경기’, 정치에서는 ‘정당’이에요. 파티는 la fiesta라고 해요.
  fun_fact_ko: 산 페르민은 7월에 열려요. 흰 옷에 빨간 pañuelo를 두른 사람들로 거리가 가득 차요.
