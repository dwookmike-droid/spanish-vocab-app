  patterns:
  - title_ko: 명사에 맞춰 고르는 말
    items:
    - es: el café → lo quiero
      tag: m
      ko: 커피 → 그걸 원해요
    - es: la tostada → la quiero
      tag: f
      ko: 토스트 → 그걸 원해요
