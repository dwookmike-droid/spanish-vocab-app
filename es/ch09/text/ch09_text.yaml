word_order:
  tema: Lo quiero, la quiero
  tema_sub_ko: 어순 — lo · la는 동사 바로 앞에
  point_ko: 직접목적 lo / la는 동사 앞
  lead_ko: 앞에서 말한 물건을 ‘그것을’로 받을 때 lo나 la를 동사 바로 앞에 놓아요. 남성 명사는 lo, 여성 명사는 la예요.
  sentences:
  - es: ¿El café? Lo quiero con leche.
    en: The coffee? I'd like it with milk.
    ko: 커피요? 우유 넣어서 주세요.
    note_ko: lo(그것을)는 동사 앞 · 영어 it은 동사 뒤
    tokens:
    - es: ¿El café?
      gloss_ko: 그 커피?
    - es: Lo
      gloss_ko: 그것을
    - es: quiero
      gloss_ko: 원하다(나)
    - es: con
      gloss_ko: ~와 함께
    - es: leche
      gloss_ko: 우유
    highlight: [1]
  - es: ¿La tostada? La quiero con tomate.
    en: The toast? I'd like it with tomato.
    ko: 토스트요? 토마토 올려서 주세요.
    note_ko: la tostada가 여성 명사라서 la로 받아요
    tokens:
    - es: ¿La tostada?
      gloss_ko: 그 토스트?
    - es: La
      gloss_ko: 그것을
    - es: quiero
      gloss_ko: 원하다(나)
    - es: con
      gloss_ko: ~와 함께
    - es: tomate
      gloss_ko: 토마토
    highlight: [1]
  - es: ¿Los churros? Los quiero calientes.
    en: The churros? I'd like them hot.
    ko: 추로스요? 따뜻한 걸로 주세요.
    note_ko: 복수는 los · 형용사도 복수 calientes
    tokens:
    - es: ¿Los
      gloss_ko: 그
    - es: churros?
      gloss_ko: 추로스?
    - es: Los
      gloss_ko: 그것들을
    - es: quiero
      gloss_ko: 원하다(나)
    - es: calientes
      gloss_ko: 따뜻한
    highlight: [2]
