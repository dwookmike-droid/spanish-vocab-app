  ko: 계산해 주시겠어요?
extras:
  grammar_ko:
  - Lo quiero를 그대로 옮기면 ‘그걸 원해요’예요. 카페에서는 ‘그걸로 주세요’에 가까운 말이에요.
  - el azúcar는 남성으로도 여성으로도 쓰는 단어예요. 처음에는 el azúcar로 외우면 충분해요.
  - -ería로 끝나는 말은 가게 이름인 경우가 많아요. panadería(빵집), cafetería(카페), frutería(과일 가게)처럼요.
  - la cucharilla는 la cuchara(숟가락)에 ‘작은’을 뜻하는 -illa가 붙은 말이에요.
  cognates:
  - es: el café
    en: coffee
    note_ko: 둘 다 아랍어 qahwa에서 왔어요.
  - es: el té
    en: tea
    note_ko: 둘 다 중국 남부 말 te에서 왔어요.
  - es: el azúcar
    en: sugar
    note_ko: 둘 다 아랍어 sukkar에서 왔어요.
  - es: el chocolate
    en: chocolate
    note_ko: 영어 chocolate는 스페인어에서 건너간 말이에요.
  false_friend:
    es: la tarta
    en: tart
    note_ko: la tarta는 케이크를 두루 가리켜요. tarta de queso는 치즈케이크예요.
  fun_fact_ko: cortado는 동사 cortar(자르다)에서 온 말로, 직역하면 ‘잘린’ 커피예요.
