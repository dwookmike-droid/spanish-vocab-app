scenes:
- es: ¿Para tomar aquí o para llevar?
  en: For here or to take away?
  ko: 여기서 드세요, 가져가세요?
- es: Una barra de pan, por favor.
  en: A baguette, please.
  ko: 바게트 하나 주세요.
- es: ¿Nos sentamos en la terraza?
  en: Shall we sit on the terrace?
  ko: 테라스에 앉을까요?
- es: ¿A qué hora abre la panadería?
  en: What time does the bakery open?
