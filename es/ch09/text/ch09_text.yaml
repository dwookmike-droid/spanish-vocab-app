  contrast:
    title_ko: 명사와 lo의 자리
    items:
    - es: Quiero el café con leche.
      label_ko: 명사는 동사 뒤에
      ko: 커피는 우유 넣어서 주세요.
    - es: Lo quiero con leche.
      label_ko: lo는 동사 앞에
      ko: 우유 넣어서 주세요.
    - es: Voy a tomarlo con leche.
      label_ko: 동사원형 끝에 붙여서
      ko: 우유 넣어서 마실 거예요.
  extra_notes_ko:
  - 이미 나온 물건은 이름을 다시 말하지 않고 lo · la · los · las로 받아요. 이 말은 활용된 동사 바로 앞에 와요. 동사원형이 있으면 Voy a tomarlo처럼 끝에 붙일 수도 있어요.
  - 앞 장의 me(나에게)는 받는 사람을, 이 장의 lo · la(그것을)는 물건을 가리켜요. ¿Me trae un café?와 Lo quiero con leche를 나란히 읽어 보면 자리가 같다는 걸 알 수 있어요.
