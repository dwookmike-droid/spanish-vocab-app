schema_version: 1
chapter: 19
dialogues:
  - id: d1
    title_es: Entradas para el tablao
    title_ko: 타블라오 입장권 사기
    setting_ko: 세비야 트리아나의 타블라오 입구. 오늘 밤 공연 표를 사려고 해요.
    roles:
      A: {es: Taquillera, ko: 매표 직원}
      B: {es: Turista, ko: 여행자}
    lines:
      - who: B
        textbook:
          es: Buenas tardes. ¿Quedan entradas para esta noche?
          ko: 안녕하세요. 오늘 밤 표 남았어요?
        native:
          es: Buenas. ¿Os quedan entradas para esta noche?
          ko: 안녕하세요. 오늘 밤 표 아직 있어요?
          note_ko: os quedan은 ‘(여러분 가게에) 남아 있어요?’예요. 가게 사람들을 묶어 vosotros로 불러요.
      - who: A
        textbook:
          es: Sí, quedan pocas. Hay un espectáculo a las siete y otro a las nueve.
          ko: 네, 몇 장 안 남았어요. 7시 공연과 9시 공연이 있어요.
        native:
          es: Sí, pero quedan poquitas. ¿Para el pase de las siete o el de las nueve?
          ko: 네, 근데 얼마 안 남았어요. 7시 회차요, 9시 회차요?
          note_ko: el pase는 공연의 ‘회차’예요. 타블라오는 하룻밤에 공연을 여러 번 하기도 해요.
      - who: B
        textbook:
          es: Para las nueve. ¿Cuánto cuesta una entrada?
          ko: 9시요. 표 한 장에 얼마예요?
        native:
          es: El de las nueve. ¿Cuánto es?
          ko: 9시 거요. 얼마예요?
          note_ko: el de las nueve는 el pase de las nueve를 줄인 말이에요.
      - who: A
        textbook:
          es: Cuesta veinticinco euros. Con una bebida, cuesta treinta.
          ko: 25유로예요. 음료 포함이면 30유로예요.
        native:
          es: Veinticinco, o treinta con consumición.
          ko: 25유로요. 음료 포함이면 30이고요.
          note_ko: consumición은 표값에 들어 있는 ‘음료 한 잔’이에요.
      - who: B
        textbook:
          es: Una entrada con bebida, por favor. ¿Hay sitio cerca del escenario?
          ko: 음료 포함으로 한 장 주세요. 무대 가까운 자리 있어요?
        native:
          es: Una con consumición. ¿Y me pones cerca del escenario, si puede ser?
          ko: 음료 포함으로 한 장이요. 되면 무대 가까이로 해 주세요.
          note_ko: ¿me pones…?는 ‘~로 해 줄래요?’라는 부탁이에요. si puede ser는 ‘가능하면’이에요.
      - who: A
        textbook:
          es: Sí. Tiene un asiento en la fila dos. Desde allí se ven muy bien los pies de la bailaora.
          ko: 네. 2열에 자리가 있어요. 거기서는 여자 무용수의 발이 아주 잘 보여요.
        native:
          es: Te pongo en la fila dos, que se ven genial los pies de la bailaora.
          ko: 2열로 해 드릴게요. 무용수 발놀림이 아주 잘 보이거든요.
          note_ko: 플라멩코에서는 발로 바닥을 구르는 소리도 음악의 한 부분이에요.
      - who: B
        textbook:
          es: ¿Puedo hacer fotos durante el espectáculo?
          ko: 공연 중에 사진 찍어도 돼요?
        native:
          es: Una pregunta, ¿se pueden hacer fotos?
          ko: 하나만 물어볼게요, 사진 찍어도 돼요?
          note_ko: 스페인에서는 사진을 ‘찍다’를 hacer fotos라고 많이 해요.
      - who: A
        textbook:
          es: Durante el baile, no. Al final, sí.
          ko: 춤추는 동안은 안 돼요. 끝날 때는 괜찮아요.
        native:
          es: Durante el baile, mejor no, ¿vale? Al final, cuando saludan, ya sí.
          ko: 춤출 땐 안 찍는 게 좋아요, 알겠죠? 끝나고 인사할 때는 찍어도 돼요.
          note_ko: ya sí는 ‘그때는 돼요’라는 뜻이에요.
      - who: B
        textbook:
          es: Muy bien. Aquí tiene treinta euros.
          ko: 좋아요. 여기 30유로요.
        native:
          es: Perfecto. Toma, treinta.
          ko: 좋아요. 여기요, 30유로.
          note_ko: perfecto는 ‘좋아요, 딱 좋네요’라는 맞장구예요. 스페인에서 아주 흔해요.
      - who: A
        textbook:
          es: Gracias. La puerta abre a las ocho y media. ¡Que disfrute!
          ko: 고맙습니다. 문은 8시 반에 열어요. 즐겁게 보세요!
        native:
          es: Gracias. Abrimos a las ocho y media. ¡Ya verás qué noche!
          ko: 고마워요. 8시 반에 문 열어요. 오늘 밤 정말 좋을 거예요!
          note_ko: ya verás는 ‘곧 알게 될 거예요’라는 말로, 기대를 실어 말할 때 써요.
  - id: d2
    title_es: Aprender a tocar las palmas
    title_ko: 손뼉 장단 배우기
    setting_ko: 공연이 끝난 타블라오. 옆자리에 앉은 아주머니와 이야기를 나눠요.
    roles:
      A: {es: Señora, ko: 아주머니}
      B: {es: Turista, ko: 여행자}
    lines:
      - who: A
        textbook:
          es: ¿Le ha gustado el espectáculo?
          ko: 공연 마음에 드셨어요?
        native:
          es: ¿Qué, te ha gustado?
          ko: 어때요, 좋았어요?
          note_ko: 앞에 ¿qué?를 붙여 ‘어때요?’ 하고 소감을 물어요.
      - who: B
        textbook:
          es: Sí, mucho. La bailaora baila muy bien.
          ko: 네, 아주요. 여자 무용수가 춤을 정말 잘 춰요.
        native:
          es: ¡Me ha encantado! ¡Qué bien baila la bailaora!
          ko: 너무 좋았어요! 무용수가 정말 잘 추네요!
          note_ko: encantar는 gustar보다 센 ‘정말 좋다’예요.
      - who: A
        textbook:
          es: Sí, y el cante también es muy bueno. ¿Entiende las canciones?
          ko: 네, 노래도 아주 좋아요. 노래는 알아들으세요?
        native:
          es: Y el cantaor, ¡qué voz! ¿Te enteras de lo que canta?
          ko: 가수 목소리도 대단하죠! 무슨 노래인지 알아듣겠어요?
          note_ko: cantaor는 플라멩코 남자 가수예요. enterarse는 ‘알아듣다’예요.
      - who: B
        textbook:
          es: No, no entiendo mucho. Pero el ritmo me gusta mucho.
          ko: 아니요, 잘 못 알아들어요. 그래도 리듬이 정말 좋아요.
        native:
          es: Poquito, la verdad. Pero el ritmo, ¡qué pasada!
          ko: 사실 거의 못 알아들어요. 그래도 리듬은 정말 끝내줘요!
          note_ko: ¡qué pasada!는 ‘끝내준다’는 스페인 구어예요.
      - who: A
        textbook:
          es: ¿Sabe tocar las palmas?
          ko: 손뼉 장단 칠 줄 아세요?
        native:
          es: ¿Y las palmas? ¿Te atreves?
          ko: 손뼉 장단은요? 한번 해 볼래요?
          note_ko: atreverse는 ‘용기 내서 해 보다’예요.
      - who: B
        textbook:
          es: No. Es muy difícil. ¿Me enseña?
          ko: 아니요. 너무 어려워요. 가르쳐 주실래요?
        native:
          es: Uy, no, ¡es dificilísimo! ¿Me enseña un poco?
          ko: 아이고, 아니요, 엄청 어려워요! 조금만 가르쳐 주실래요?
          note_ko: -ísimo를 붙이면 ‘아주 ~한’이 돼요. difícil → dificilísimo.
      - who: A
        textbook:
          es: Sí. Mire, así. Primero despacio, y después más rápido.
          ko: 그럼요. 보세요, 이렇게요. 처음엔 천천히, 그다음엔 더 빠르게요.
        native:
          es: Mira, así, suave al principio, y luego fuerte, con la guitarra.
          ko: 봐요, 이렇게요. 처음엔 살살, 그다음엔 기타에 맞춰 세게요.
          note_ko: 손바닥을 오므려 치면 소리가 부드럽고, 펴서 치면 소리가 커요.
      - who: B
        textbook:
          es: ¿Así?
          ko: 이렇게요?
        native:
          es: ¿Así? ¿Voy bien?
          ko: 이렇게요? 잘하고 있어요?
          note_ko: ¿voy bien?은 ‘맞게 하고 있어요?’라는 말이에요.
      - who: A
        textbook:
          es: ¡Muy bien! Y cuando la bailaora baila muy bien, decimos «¡olé!».
          ko: 아주 좋아요! 그리고 무용수가 정말 잘 추면 «올레!» 하고 외쳐요.
        native:
          es: ¡Eso es! Y cuando algo te emociona, se dice «¡olé!», con ganas.
          ko: 바로 그거예요! 그리고 뭔가 가슴이 뛰면 힘차게 «올레!» 하고 외쳐요.
          note_ko: con ganas는 ‘힘껏, 신나게’예요.
      - who: B
        textbook:
          es: ¡Olé! ¡Muchas gracias por la clase!
          ko: 올레! 가르쳐 주셔서 정말 고마워요!
        native:
          es: ¡Olé! ¡Mil gracias por la clase!
          ko: 올레! 수업 정말 고마워요!
          note_ko: mil gracias는 ‘천 번 고마워요’라는 말로, 아주 고맙다는 뜻이에요.
readings:
  - id: r1
    title_es: Una noche de flamenco
    title_ko: 플라멩코의 밤
    level: A1
    paragraphs:
      - es: Hoy es 24 de mayo y estoy en Sevilla. Por la noche voy a un tablao en Triana. Es pequeño, y el público está muy cerca del escenario.
        ko: 오늘은 5월 24일, 저는 세비야에 있어요. 밤에 트리아나의 타블라오에 가요. 공연장이 작아서 관객이 무대와 아주 가까워요.
      - es: Primero, un músico toca la guitarra. Después, un cantaor empieza a cantar. Luego sale la bailaora, con un vestido rojo y un abanico. Baila con mucha fuerza.
        ko: 먼저 음악가 한 명이 기타를 쳐요. 그다음 남자 가수가 노래를 시작해요. 이어서 빨간 옷을 입고 부채를 든 여자 무용수가 나와요. 아주 힘 있게 춤을 춰요.
      - es: El público toca las palmas y dice «¡olé!». Yo no sé tocar las palmas, pero una señora me enseña. ¡Qué noche tan bonita!
        ko: 관객들은 손뼉 장단을 치며 «올레!»를 외쳐요. 저는 손뼉 장단을 칠 줄 모르는데, 옆자리 아주머니가 가르쳐 줘요. 정말 멋진 밤이에요!
    questions:
      - q_ko: 타블라오는 어디에 있나요?
        choices_ko: [트리아나, 론다, 카디스]
        answer: 0
      - q_ko: 무용수는 손에 무엇을 들고 있었나요?
        choices_ko: [부채, 캐스터네츠, 북]
        answer: 0
      - q_ko: 손뼉 장단은 누가 가르쳐 줬나요?
        choices_ko: [기타 연주자, 옆자리 아주머니, 무용수]
        answer: 1
  - id: r2
    title_es: Flamenco y sevillanas
    title_ko: 플라멩코와 세비야나스
    level: A2
    paragraphs:
      - es: El flamenco tiene tres partes principales, el cante, el baile y la guitarra. Las palmas también son muy importantes, porque marcan el ritmo. Hoy, algunos músicos tocan flamenco con piano o violín.
        ko: 플라멩코는 크게 노래, 춤, 기타로 이루어져요. 손뼉 장단도 아주 중요해요. 리듬을 잡아 주거든요. 요즘은 피아노나 바이올린으로 플라멩코를 연주하는 음악가도 있어요.
      - es: Las sevillanas son otra cosa. Son un baile popular de Sevilla, y se bailan en pareja. En la Feria de Sevilla, en primavera, mucha gente baila sevillanas. Muchas mujeres llevan vestido de flamenca y, a veces, tocan las castañuelas.
        ko: 세비야나스는 또 달라요. 세비야의 민속춤으로, 둘이 짝을 지어 춰요. 봄에 열리는 세비야 페리아에서는 많은 사람이 세비야나스를 춰요. 플라멩코 의상을 입는 여자가 많고, 캐스터네츠를 치기도 해요.
      - es: Si vas a un tablao, mira bien los pies de los bailaores. ¡Con los pies también hacen música!
        ko: 타블라오에 가면 무용수들의 발을 잘 보세요. 발로도 음악을 만들거든요!
    questions:
      - q_ko: 플라멩코의 세 가지 큰 요소가 아닌 것은?
        choices_ko: [노래, 피아노, 기타]
        answer: 1
      - q_ko: 세비야나스는 어떻게 추나요?
        choices_ko: [혼자서, 둘이 짝을 지어, 열 명이 줄을 서서]
        answer: 1
      - q_ko: 타블라오에서 무엇을 잘 보라고 했나요?
        choices_ko: [무용수의 발, 기타 줄, 관객의 손]
        answer: 0
glossary:
  "a": {lemma: "a", ko: "~에, ~로", en: "to, at", pron: "아"}
  "abre": {lemma: "abrir", ko: "열다(그것은)", en: "opens", pron: "**아**브레"}
  "abrimos": {lemma: "abrir", ko: "열다(우리는)", en: "we open", pron: "아**브리**모스"}
  "al": {lemma: "a + el", ko: "~에(a+el)", en: "to the", pron: "알"}
  "algo": {lemma: "algo", ko: "무언가", en: "something", pron: "**알**고"}
  "algunos": {lemma: "alguno", ko: "몇몇의(남성 복수)", en: "some", pron: "알**구**노스"}
  "allí": {lemma: "allí", ko: "거기, 저기", en: "there", pron: "아**이**"}
  "aquí": {lemma: "aquí", ko: "여기", en: "here", pron: "아**끼**"}
  "asiento": {lemma: "asiento", ko: "좌석, 자리", en: "seat", pron: "아**시엔**또"}
  "así": {lemma: "así", ko: "이렇게", en: "like this", pron: "아**시**"}
  "atreves": {lemma: "atreverse", ko: "용기 내서 해 보다(너는)", en: "you dare", pron: "아뜨**레**베스"}
  "baila": {lemma: "bailar", ko: "춤추다(그·그녀는)", en: "dances", pron: "**바일**라"}
  "bailan": {lemma: "bailar", ko: "춤추다(se bailan 춰요)", en: "they dance (are danced)", pron: "**바일**란"}
  "bailaores": {lemma: "bailaor", ko: "플라멩코 무용수들", en: "flamenco dancers", pron: "바일라**오**레스"}
  "bebida": {lemma: "bebida", ko: "음료", en: "drink", pron: "베**비**다"}
  "bien": {lemma: "bien", ko: "잘, 제대로", en: "well, properly", pron: "**비엔**"}
  "bonita": {lemma: "bonito", ko: "예쁜", en: "pretty", pron: "보**니**따"}
  "buenas": {lemma: "bueno", ko: "안녕하세요(buenas 인사)", en: "hi (short greeting)", pron: "**부에**나스"}
  "bueno": {lemma: "bueno", ko: "좋은(남성)", en: "good", pron: "**부에**노"}
  "canciones": {lemma: "canción", ko: "노래들", en: "songs", pron: "깐**시오**네스"}
  "canta": {lemma: "cantar", ko: "노래하다(그는)", en: "sings", pron: "**깐**따"}
  "cantaor": {lemma: "cantaor", ko: "플라멩코 남자 가수", en: "flamenco singer", pron: "깐따**오르**"}
  "cantar": {lemma: "cantar", ko: "노래하다", en: "to sing", pron: "깐**따르**"}
  "cerca": {lemma: "cerca", ko: "가까이", en: "near", pron: "**세르**까"}
  "clase": {lemma: "clase", ko: "수업", en: "class", pron: "**끌라**세"}
