  "dos": {lemma: "dos", ko: "둘", en: "two", pron: "**도스**"}
  "durante": {lemma: "durante", ko: "~ 동안", en: "during", pron: "두**란**떼"}
  "emociona": {lemma: "emocionar", ko: "가슴을 뛰게 하다(그것은)", en: "moves (emotionally)", pron: "에모시**오**나"}
  "empieza": {lemma: "empezar", ko: "시작하다(그것은)", en: "starts", pron: "엠**삐에**사"}
