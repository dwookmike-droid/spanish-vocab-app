schema_version: 1
chapter: 14
dialogues:
  - id: d1
    title_es: Mi maleta no ha salido
    title_ko: 제 가방이 안 나왔어요
    setting_ko: 팔마 공항 수하물 찾는 곳. 다른 짐은 다 나왔는데 내 가방만 안 보여요.
    roles:
      A: {es: Empleado, ko: 공항 직원}
      B: {es: Pasajero, ko: 승객}
    lines:
      - who: B
        textbook:
          es: Perdone, mi maleta no ha salido.
          ko: 실례합니다, 제 가방이 안 나왔어요.
        native:
          es: Perdone, mi maleta no ha salido y en la cinta ya no queda nada.
          ko: 저기요, 제 가방이 안 나왔는데 벨트에 이제 아무것도 없어요.
          note_ko: la cinta는 수하물 벨트예요. no queda nada는 ‘남은 게 하나도 없다’예요.
      - who: A
        textbook:
          es: ¿Puedo ver su tarjeta de embarque, por favor?
          ko: 탑승권 좀 볼 수 있을까요?
        native:
          es: A ver, ¿me enseña la tarjeta de embarque y la etiqueta de la maleta?
          ko: 어디 보자, 탑승권이랑 가방 태그 좀 보여 주시겠어요?
          note_ko: la etiqueta는 짐을 부칠 때 받는 수하물 태그예요.
      - who: B
        textbook:
          es: Sí, aquí tiene. Es una maleta roja y grande.
          ko: 네, 여기 있어요. 크고 빨간 가방이에요.
        native:
          es: Tenga. Es una roja, grandota, con ruedas.
          ko: 여기요. 빨간색에 큼직하고 바퀴 달린 거예요.
          note_ko: grandote, grandota는 ‘큼직한’이에요. 말할 때 흔히 써요.
      - who: A
        textbook:
          es: Un momento, por favor… Su maleta viene en el próximo vuelo.
          ko: 잠시만요… 가방은 다음 항공편으로 와요.
        native:
          es: Un segundito… Vale, la tengo localizada. Viene en el próximo vuelo.
          ko: 잠깐만요… 네, 찾았어요. 다음 항공편으로 와요.
          note_ko: la tengo localizada는 ‘(그 가방) 위치를 확인했어요’예요. un segundito는 ‘잠깐만요’예요.
      - who: B
        textbook:
          es: ¿Cuándo llega el próximo vuelo?
          ko: 다음 항공편은 언제 도착해요?
        native:
          es: Vaya… ¿Y eso para cuándo?
          ko: 이런… 그럼 언제쯤 와요?
          note_ko: vaya는 ‘이런, 아이고’ 하고 아쉬움을 나타내요.
      - who: A
        textbook:
          es: Llega esta noche. Le llevamos la maleta al hotel.
          ko: 오늘 밤에 도착해요. 가방은 호텔로 갖다드릴게요.
        native:
          es: Llega esta noche, y se la llevamos al hotel. No se preocupe.
          ko: 오늘 밤에 도착해요. 호텔로 갖다드릴게요. 걱정 마세요.
          note_ko: se la llevamos는 ‘당신에게 그것(가방)을 갖다드려요’예요. no se preocupe는 ‘걱정 마세요’예요.
      - who: B
        textbook:
          es: Muy bien. ¿Qué tengo que hacer?
          ko: 알겠어요. 제가 뭘 해야 해요?
        native:
          es: Vale. ¿Y tengo que rellenar algo?
          ko: 네. 뭐 작성해야 하는 거 있어요?
          note_ko: rellenar는 서류를 ‘채우다, 작성하다’예요.
      - who: A
        textbook:
          es: Sí. Escriba aquí la dirección del hotel y su teléfono.
          ko: 네. 여기에 호텔 주소랑 전화번호를 적어 주세요.
        native:
          es: Sí, este papel. Póngame aquí la dirección del hotel y un teléfono.
          ko: 네, 이 종이요. 여기 호텔 주소랑 연락처 하나 적어 주세요.
          note_ko: poner는 서류에 ‘적다’라는 뜻으로도 써요.
      - who: B
        textbook:
          es: Aquí está. Muchas gracias.
          ko: 여기 있어요. 정말 고맙습니다.
        native:
          es: Ya está. Muchas gracias por todo.
          ko: 다 썼어요. 여러 가지로 고마워요.
          note_ko: ya está는 ‘다 됐어요’예요. gracias por todo는 ‘여러 가지로 고마워요’예요.
      - who: A
        textbook:
          es: De nada. Disfrute de Palma.
          ko: 천만에요. 팔마에서 즐거운 시간 보내세요.
        native:
          es: A usted. Y perdone las molestias.
          ko: 제가 고맙죠. 불편을 드려 죄송해요.
          note_ko: perdone las molestias는 ‘불편을 드려 죄송해요’라는 정해진 사과 말이에요.
  - id: d2
    title_es: Facturar la maleta para Sevilla
    title_ko: 세비야행 짐 부치기
    setting_ko: 이틀 뒤 팔마 공항 체크인 카운터. 세비야행 비행기를 타요.
    roles:
      A: {es: Empleada, ko: 항공사 직원}
      B: {es: Pasajero, ko: 승객}
    lines:
      - who: A
        textbook:
          es: Buenos días. ¿Viaja a Sevilla?
          ko: 안녕하세요. 세비야 가세요?
        native:
          es: Hola, buenos días. ¿Para Sevilla?
          ko: 안녕하세요. 세비야 가세요?
          note_ko: para Sevilla만으로 ‘세비야 가세요?’라는 뜻이 돼요. 동사를 빼고 짧게 물어요.
      - who: B
        textbook:
          es: Sí. Aquí tiene mi pasaporte y mi billete.
          ko: 네. 여권이랑 표 여기 있어요.
        native:
          es: Sí. Tenga, el pasaporte, y el billete lo tengo en el móvil.
          ko: 네. 여기요, 여권이요. 표는 휴대폰에 있어요.
          note_ko: 휴대폰은 스페인에서 el móvil이에요. el billete를 먼저 꺼내고 lo로 다시 받았어요.
      - who: A
        textbook:
          es: Gracias. ¿Factura equipaje?
          ko: 고맙습니다. 짐 부치세요?
        native:
          es: Gracias. ¿Factura la maleta o la lleva en cabina?
          ko: 고마워요. 가방 부치세요, 아니면 기내에 들고 타세요?
          note_ko: facturar는 공항에서 ‘짐을 부치다’예요. en cabina는 ‘기내에’예요.
      - who: B
        textbook:
          es: Sí, esta maleta. ¿Puedo tener un asiento de ventanilla?
          ko: 네, 이 가방이요. 창가 자리로 할 수 있어요?
        native:
          es: La facturo, sí. ¿Y me puede dar ventanilla?
          ko: 네, 부칠게요. 그리고 창가 자리로 주실 수 있어요?
          note_ko: asiento de를 빼고 ventanilla, pasillo라고만 해도 돼요.
      - who: A
        textbook:
          es: Sí. Tiene el asiento catorce A, de ventanilla.
          ko: 네. 14A, 창가 자리예요.
        native:
          es: Sí, me queda una. El catorce A, ¿le va bien?
          ko: 네, 하나 남았어요. 14A 괜찮으세요?
          note_ko: me queda una는 ‘(창가 자리가) 하나 남았어요’예요. ¿le va bien?은 ‘괜찮으세요?’예요.
      - who: B
        textbook:
          es: Perfecto, gracias. ¿El vuelo sale a su hora?
          ko: 좋아요, 고마워요. 비행기는 제시간에 떠나요?
        native:
          es: Perfecto. ¿Y el vuelo va con retraso?
          ko: 좋아요. 그런데 비행기 늦어요?
          note_ko: ir con retraso는 ‘지연되다, 늦어지다’예요.
      - who: A
        textbook:
          es: No, de momento no hay retraso. El embarque es a las diez y media, en la puerta B7.
          ko: 아니요, 지금은 지연이 없어요. 탑승은 10시 반, B7 탑승구예요.
        native:
          es: De momento, todo en hora. Embarque a las diez y media por la puerta B7.
          ko: 지금은 다 제시간이에요. 탑승은 10시 반, B7 탑승구예요.
          note_ko: de momento는 ‘지금으로선’, en hora는 ‘제시간에’예요.
      - who: B
        textbook:
          es: ¿Dónde está el control de seguridad?
          ko: 보안 검색대는 어디 있어요?
        native:
          es: Genial. ¿Y el control, por dónde queda?
          ko: 좋네요. 보안 검색대는 어느 쪽이에요?
          note_ko: 공항에서는 control이라고만 해도 보안 검색대를 뜻해요.
      - who: A
        textbook:
          es: Siga las señales, por favor. Aquí tiene su tarjeta de embarque. ¡Buen viaje!
          ko: 표지판을 따라가세요. 탑승권 여기 있어요. 즐거운 여행 되세요!
        native:
          es: Siga los carteles, no tiene pérdida. Tenga la tarjeta, ¡y buen vuelo!
          ko: 안내판 따라가시면 바로 찾아요. 탑승권 받으세요. 좋은 비행 되세요!
          note_ko: buen vuelo는 비행기 타는 사람에게 하는 ‘좋은 여행 되세요’예요.
      - who: B
        textbook:
          es: Muchas gracias. Adiós.
          ko: 정말 고맙습니다. 안녕히 계세요.
        native:
          es: ¡Gracias! ¡Hasta luego!
          ko: 고마워요! 안녕히 계세요!
          note_ko: hasta luego는 다시 안 볼 사람에게도 쓰는 작별 인사예요.
readings:
  - id: r1
    title_es: Llegada a Palma
    title_ko: 팔마에 도착하다
    level: A1
    paragraphs:
      - es: Hoy es 21 de mayo y llego a Palma en avión. El vuelo es corto, pero sale con una hora de retraso. Desde la ventanilla veo el mar, muy azul.
        ko: 오늘은 5월 21일, 비행기를 타고 팔마에 도착해요. 비행은 짧지만 한 시간 늦게 출발해요. 창가 자리에서 아주 파란 바다가 보여요.
      - es: En el aeropuerto sigo las señales de «Llegadas» y voy a recoger el equipaje. Cojo un carrito y espero mucho tiempo, pero mi maleta no sale.
        ko: 공항에서 «Llegadas»(도착) 표지판을 따라 짐을 찾으러 가요. 카트를 하나 가져와서 한참 기다리지만 제 가방은 안 나와요.
      - es: Un empleado me ayuda. Mi maleta viene en el próximo vuelo y me la llevan al hotel por la noche. No paso por la aduana, porque vengo de otra ciudad de España. Al final, salgo con la mochila y nada más.
        ko: 공항 직원이 도와줘요. 제 가방은 다음 항공편으로 오고, 밤에 호텔로 갖다줘요. 스페인의 다른 도시에서 와서 세관은 지나지 않아요. 결국 배낭 하나만 메고 나가요.
    questions:
      - q_ko: 비행기는 어땠나요?
        choices_ko: [제시간에 도착했다, 한 시간 늦게 출발했다, 취소됐다]
        answer: 1
      - q_ko: 글쓴이는 왜 세관을 지나지 않았나요?
        choices_ko: [짐이 없어서, 스페인 국내선을 타고 와서, 세관이 닫혀서]
        answer: 1
      - q_ko: 가방은 어떻게 받게 되나요?
        choices_ko: [다음 날 공항에서 찾는다, 밤에 호텔로 갖다준다, 세비야로 보낸다]
        answer: 1
  - id: r2
    title_es: Antes de volar a Sevilla
    title_ko: 세비야로 날아가기 전에
    level: A2
    paragraphs:
      - es: El 23 de mayo vuelo de Palma a Sevilla. Llego al aeropuerto dos horas antes. Primero miro la pantalla de salidas. Allí veo la hora del vuelo y el número del mostrador.
        ko: 5월 23일에는 팔마에서 세비야로 가는 비행기를 타요. 공항에는 두 시간 일찍 도착해요. 먼저 출발 안내 화면을 봐요. 거기서 비행기 시간과 카운터 번호를 확인해요.
      - es: En el mostrador facturo la maleta y me dan la tarjeta de embarque. Tengo un asiento de ventanilla. Después paso el control de seguridad. Pongo la mochila en una bandeja y paso sin problemas.
        ko: 카운터에서 가방을 부치고 탑승권을 받아요. 자리는 창가예요. 그다음 보안 검색대를 지나요. 배낭을 바구니에 올리고 문제없이 통과해요.
      - es: Luego espero en la puerta de embarque. Cuando abren la puerta, enseño la tarjeta de embarque y el pasaporte, y subo al avión. ¡Adiós, Palma!
        ko: 그다음 탑승구에서 기다려요. 탑승구가 열리면 탑승권과 여권을 보여 주고 비행기에 올라요. 안녕, 팔마!
    questions:
      - q_ko: 글쓴이는 공항에 언제 도착했나요?
        choices_ko: [한 시간 전, 두 시간 전, 30분 전]
        answer: 1
      - q_ko: 글쓴이는 가방을 어떻게 했나요?
        choices_ko: [기내에 들고 탔다, 카운터에서 부쳤다, 호텔에 두고 왔다]
        answer: 1
