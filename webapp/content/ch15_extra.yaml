schema_version: 1
chapter: 15
dialogues:
  - id: d1
    title_es: Alquilar una hamaca en La Caleta
    title_ko: 라 칼레타에서 선베드 빌리기
    setting_ko: 카디스 라 칼레타 해변. 5월 26일 오전, 선베드와 파라솔을 빌리려고 해요.
    roles:
      A: {es: Encargado, ko: 대여 직원}
      B: {es: Turista, ko: 여행자}
    lines:
      - who: B
        textbook:
          es: Buenos días. ¿Cuánto cuesta alquilar una hamaca?
          ko: 안녕하세요. 선베드 빌리는 데 얼마예요?
        native:
          es: Buenas. ¿Cuánto es la hamaca?
          ko: 안녕하세요. 선베드 얼마예요?
          note_ko: buenas는 buenos días를 줄인 인사로, 하루 종일 써요. alquilar는 빼고 짧게 물어요.
      - who: A
        textbook:
          es: Una hamaca cuesta seis euros. Con sombrilla, son diez euros.
          ko: 선베드 하나에 6유로예요. 파라솔까지 하면 10유로예요.
        native:
          es: Seis la hamaca. Si quieres sombrilla también, te lo dejo en diez.
          ko: 선베드는 6유로요. 파라솔도 하면 10유로에 해 줄게요.
          note_ko: dejar en은 값을 ‘~에 해 주다’라는 말이에요. 해변에서는 직원도 손님에게 tú를 많이 써요.
      - who: B
        textbook:
          es: Quiero una hamaca y una sombrilla, por favor. ¿Hasta qué hora es?
          ko: 선베드 하나랑 파라솔 하나 주세요. 몇 시까지 쓸 수 있어요?
        native:
          es: Venga, las dos cosas. ¿Y hasta qué hora?
          ko: 좋아요, 둘 다 할게요. 몇 시까지예요?
          note_ko: venga는 마음을 정했을 때 하는 ‘좋아요, 그걸로 해요’예요.
      - who: A
        textbook:
          es: Hasta las ocho de la tarde. ¿Tiene crema solar? Aquí el sol es muy fuerte.
          ko: 저녁 8시까지예요. 선크림 있으세요? 여기는 햇볕이 아주 강해요.
        native:
          es: Hasta las ocho. Y ponte crema, ¿eh?, que aquí el sol pega fuerte.
          ko: 8시까지요. 그리고 선크림 꼭 발라요. 여기 햇볕이 세거든요.
          note_ko: el sol pega fuerte는 ‘햇볕이 세게 내리쬔다’는 말이에요. que는 이유를 붙이는 ‘~거든요’예요.
      - who: B
        textbook:
          es: Sí, tengo crema. ¿El agua está fría?
          ko: 네, 선크림 있어요. 물은 차가워요?
        native:
          es: Sí, sí, la llevo en la bolsa. ¿Y el agua qué tal, fría?
          ko: 네, 가방에 있어요. 물은 어때요, 차가워요?
          note_ko: ¿qué tal?은 ‘어때요?’예요. 뒤에 fría를 붙여 짐작한 걸 확인해요.
      - who: A
        textbook:
          es: Sí, en mayo el agua todavía está fría. Pero hoy hay olas pequeñas.
          ko: 네, 5월에는 물이 아직 차가워요. 그래도 오늘은 파도가 작아요.
        native:
          es: Fresquita, que todavía estamos en mayo. Pero hoy el mar está tranquilo.
          ko: 아직 좀 차요. 5월이잖아요. 그래도 오늘은 바다가 잔잔해요.
          note_ko: fresquita는 fresca(시원한)에 -ita를 붙인 말로, ‘좀 찬 편’이라고 부드럽게 말해요.
      - who: B
        textbook:
          es: ¿Hay socorrista en esta playa?
          ko: 이 해변에 안전 요원이 있어요?
        native:
          es: ¿Y hay socorrista por aquí?
          ko: 이 근처에 안전 요원 있어요?
          note_ko: por aquí는 ‘이 근처에’예요.
      - who: A
        textbook:
          es: Sí, el socorrista está allí, al lado de la bandera verde.
          ko: 네, 안전 요원은 저기 초록 깃발 옆에 있어요.
        native:
          es: Sí, ahí lo tienes, al lado de la bandera. Hoy está verde.
          ko: 네, 저기 있어요, 깃발 옆에요. 오늘은 초록 깃발이에요.
          note_ko: 초록 깃발은 들어가도 된다는 표시예요. 노랑은 조심, 빨강은 들어가지 말라는 뜻이에요.
      - who: B
        textbook:
          es: Muy bien. Aquí tiene diez euros.
          ko: 좋아요. 여기 10유로요.
        native:
          es: Genial. Toma, diez.
          ko: 좋네요. 여기요, 10유로.
          note_ko: toma는 tú로 말하는 사이에서 물건을 건넬 때 하는 ‘여기요’예요.
  - id: d2
    title_es: Una tarde de playa con una amiga
    title_ko: 친구와 보내는 해변의 오후
    setting_ko: 라 칼레타 해변. 카디스에 사는 친구 카르멘과 오후를 보내요.
    roles:
      A: {es: Carmen, ko: 카르멘}
      B: {es: Min, ko: 민}
    lines:
      - who: A
        textbook:
          es: ¿Quieres bañarte? El agua está muy buena.
          ko: 수영할래? 물 아주 좋아.
        native:
          es: ¿Te bañas o qué? ¡Que el agua está buenísima!
          ko: 들어갈 거야, 말 거야? 물 진짜 좋다니까!
          note_ko: ¿…o qué?는 대답을 재촉하는 말투예요. 문장 앞 que는 ‘~라니까’처럼 힘을 줘요.
      - who: B
        textbook:
          es: Ahora no. Primero me pongo crema solar.
          ko: 지금은 말고. 먼저 선크림 바를게.
        native:
          es: Espera, que me estoy poniendo crema.
          ko: 잠깐, 선크림 바르는 중이야.
          note_ko: me estoy poniendo는 ‘지금 바르는 중’이에요. 이 장에서 배우는 진행형이에요.
      - who: A
        textbook:
          es: Vale. Hoy las olas son muy pequeñas.
          ko: 알았어. 오늘은 파도가 아주 작아.
        native:
          es: Vale. Mira qué tranquilo está el mar hoy, ni una ola.
          ko: 알았어. 봐, 오늘 바다 진짜 잔잔하다. 파도 하나 없어.
          note_ko: ni una ola는 ‘파도 하나 없다’예요. ni는 ‘~조차 없다’고 힘주어 말할 때 써요.
      - who: B
        textbook:
          es: ¿Me guardas la bolsa? Voy a bañarme.
          ko: 가방 좀 봐 줄래? 수영하러 갈게.
        native:
          es: ¿Me vigilas la bolsa un momento? Me voy al agua.
          ko: 가방 잠깐 봐 줄래? 물에 들어갈게.
          note_ko: vigilar는 ‘지켜보다’예요. me voy al agua는 ‘물에 들어간다’는 가벼운 말이에요.
      - who: A
        textbook:
          es: Claro. Yo me quedo aquí, en la hamaca.
          ko: 그럼. 나는 여기 선베드에 있을게.
        native:
          es: Tranqui, yo me quedo aquí tomando el sol.
          ko: 걱정 마. 난 여기서 햇볕 쬐고 있을게.
          note_ko: tranqui는 ‘걱정 마’라는 구어예요. tomando el sol은 ‘햇볕을 쬐는 중’이에요.
      - who: B
        textbook:
          es: ¡Uf, el agua está muy fría!
          ko: 으, 물이 너무 차가워!
        native:
          es: ¡Madre mía, qué fría está!
          ko: 세상에, 엄청 차가워!
          note_ko: madre mía는 놀랐을 때 하는 ‘세상에’예요. 말하는 사람의 성별과 상관없이 써요.
      - who: A
        textbook:
          es: Es el Atlántico. ¿Quieres un helado? El chiringuito está cerca.
          ko: 대서양이잖아. 아이스크림 먹을래? 해변 바가 가까워.
        native:
          es: Ya, es que esto es el Atlántico. ¿Nos pillamos un helado en el chiringuito?
          ko: 그치, 여긴 대서양이거든. 해변 바에서 아이스크림 하나 사 먹을까?
          note_ko: pillar는 ‘사다, 집다’라는 뜻의 아주 가벼운 구어예요. 친구끼리 써요.
      - who: B
        textbook:
          es: Sí. Yo quiero un helado de limón.
          ko: 좋아. 나는 레몬 아이스크림 먹을래.
        native:
          es: ¡Venga! Para mí, uno de limón.
          ko: 좋아! 난 레몬 맛으로.
          note_ko: uno de limón은 un helado de limón을 줄인 말이에요.
      - who: A
        textbook:
          es: Después vamos al puerto. Los barcos son muy bonitos.
          ko: 그다음에 항구에 가자. 배들이 아주 예뻐.
        native:
          es: Y luego damos un paseo hasta el puerto, que hay unos barcos preciosos.
          ko: 그리고 이따 항구까지 걸어가자. 예쁜 배들이 있거든.
          note_ko: dar un paseo는 ‘산책하다’예요. 여기서 que는 이유를 붙이는 ‘~거든’이에요.
readings:
  - id: r1
    title_es: Un día en La Caleta
    title_ko: 라 칼레타에서 보낸 하루
    level: A1
    paragraphs:
      - es: Hoy es 26 de mayo y estoy en Cádiz. Por la mañana voy a la playa de La Caleta. Es pequeña y está entre dos castillos.
        ko: 오늘은 5월 26일, 저는 카디스에 있어요. 오전에 라 칼레타 해변에 가요. 작은 해변인데, 성 두 개 사이에 있어요.
      - es: Alquilo una hamaca y una sombrilla. Hace mucho sol, y me pongo crema solar y gafas de sol. Luego me baño en el mar. ¡El agua está fría!
        ko: 선베드와 파라솔을 빌려요. 햇볕이 아주 강해서 선크림을 바르고 선글라스를 껴요. 그다음 바다에 들어가요. 물이 차가워요!
      - es: En la arena hay niños con cubos y palas. Yo busco conchas cerca de las rocas. Por la tarde como un helado en un chiringuito y miro los barcos.
        ko: 모래밭에는 양동이와 삽을 든 아이들이 있어요. 저는 바위 근처에서 조개껍데기를 찾아요. 오후에는 해변 바에서 아이스크림을 먹으며 배들을 구경해요.
    questions:
      - q_ko: 라 칼레타 해변은 어디에 있나요?
        choices_ko: [성 두 개 사이, 항구 안, 산 위]
        answer: 0
      - q_ko: 글쓴이는 바위 근처에서 무엇을 했나요?
        choices_ko: [조개껍데기를 찾았다, 낚시를 했다, 사진을 찍었다]
        answer: 0
  - id: r2
    title_es: Las banderas de la playa
    title_ko: 해변의 깃발
    level: A2
    paragraphs:
      - es: En verano, muchas playas de España tienen socorristas. Cerca del socorrista suele haber una bandera. El color de la bandera dice cómo está el mar.
        ko: 여름에는 스페인의 많은 해변에 안전 요원이 있어요. 안전 요원 근처에는 보통 깃발이 하나 서 있어요. 깃발 색이 바다 상태를 알려 줘요.
      - es: Con la bandera verde, puedes bañarte sin problema. La amarilla significa «cuidado»; hay olas o viento, y es mejor no ir lejos. Con la bandera roja, no puedes bañarte.
        ko: 초록 깃발이면 마음 놓고 들어가도 돼요. 노란 깃발은 ‘조심하세요’라는 뜻이에요. 파도나 바람이 있으니 멀리 나가지 않는 게 좋아요. 빨간 깃발이면 물에 들어가면 안 돼요.
      - es: Antes de entrar en el agua, mira la bandera. Y no olvides la crema solar, porque en Cádiz el sol pega fuerte incluso en mayo.
        ko: 물에 들어가기 전에 깃발을 보세요. 선크림도 잊지 마세요. 카디스는 5월에도 햇볕이 세거든요.
    questions:
      - q_ko: 노란 깃발은 무슨 뜻인가요?
        choices_ko: [수영 금지, 조심하세요, 안전 요원 없음]
        answer: 1
      - q_ko: 빨간 깃발이 서 있으면 어떻게 해야 하나요?
        choices_ko: [물에 들어가면 안 된다, 멀리 나가도 된다, 아이만 들어간다]
        answer: 0
