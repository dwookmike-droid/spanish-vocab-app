  "abierta": {lemma: "abierto", ko: "열린(여성)", en: "open", pron: "아**비에르**따"}
  "abren": {lemma: "abrir", ko: "열다 (그들은)", en: "they open", pron: "**아**브렌"}
  "adiós": {lemma: "adiós", ko: "안녕히 계세요", en: "goodbye", pron: "아**디오스**"}
  "agur": {lemma: "agur", ko: "잘 가요(바스크어 인사)", en: "bye (Basque)", pron: "아**구르**"}
  "ah": {lemma: "ah", ko: "아(감탄)", en: "ah", pron: "**아**"}
  "ahora": {lemma: "ahora", ko: "지금", en: "now", pron: "아**오**라"}
  "al": {lemma: "a + el", ko: "~에게, ~(으)로(a+el)", en: "to the", pron: "알"}
