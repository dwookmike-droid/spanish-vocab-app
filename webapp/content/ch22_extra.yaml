schema_version: 1
chapter: 22
dialogues:
  - id: d1
    title_es: En la farmacia, con dolor de cabeza
    title_ko: 머리가 아파서 약국에 갔을 때
    setting_ko: 빌바오의 약국. 아침부터 머리가 아프고, 발에는 물집까지 생겼어요.
    roles:
      A: {es: Farmacéutica, ko: 약사}
      B: {es: Cliente, ko: 손님}
    lines:
      - who: A
        textbook:
          es: Buenos días. ¿Qué desea?
          ko: 안녕하세요. 뭘 드릴까요?
        native:
          es: Hola, buenos días. Dígame.
          ko: 안녕하세요. 말씀하세요.
          note_ko: dígame는 ‘말씀하세요’라는 뜻이에요. 가게나 전화에서 자주 써요.
      - who: B
        textbook:
          es: Buenos días. Me duele la cabeza. ¿Tiene algo para el dolor de cabeza?
          ko: 안녕하세요. 머리가 아파요. 두통에 먹는 약 있어요?
        native:
          es: Hola. Pues mire, llevo toda la mañana con dolor de cabeza.
          ko: 안녕하세요. 저, 아침 내내 머리가 아파요.
          note_ko: llevar + 시간 + con…은 ‘…째 …한 상태예요’라는 말이에요.
      - who: A
        textbook:
          es: ¿Tiene fiebre?
          ko: 열이 있어요?
        native:
          es: ¿Y fiebre tiene? ¿Se ha puesto el termómetro?
          ko: 열은 있어요? 체온계로 재 보셨어요?
          note_ko: ponerse el termómetro는 ‘체온계로 열을 재다’예요.
      - who: B
        textbook:
          es: No, no tengo fiebre. Solo me duele la cabeza.
          ko: 아니요, 열은 없어요. 머리만 아파요.
        native:
          es: No, no. Me lo he puesto esta mañana. Treinta y seis y medio.
          ko: 아니요. 오늘 아침에 재 봤는데 36.5도였어요.
          note_ko: 36,5도는 treinta y seis y medio라고 해요. me lo he puesto는 ‘재 봤어요’예요.
      - who: A
        textbook:
          es: Le doy estas pastillas. No necesita receta. Tome una cada ocho horas.
          ko: 이 알약을 드릴게요. 처방전은 필요 없어요. 여덟 시간마다 한 알 드세요.
        native:
          es: Le pongo estas, que no necesitan receta. Una cada ocho horas, y lea el prospecto.
          ko: 이걸로 드릴게요. 처방전 없이 살 수 있어요. 여덟 시간마다 한 알이고, 설명서를 꼭 읽어 보세요.
          note_ko: le pongo는 ‘드릴게요’예요. el prospecto는 약 상자에 든 설명서예요.
      - who: B
        textbook:
          es: Muy bien. ¿Cuánto cuestan?
          ko: 알겠어요. 얼마예요?
        native:
          es: Vale. ¿Qué le debo?
          ko: 네. 얼마 드리면 돼요?
          note_ko: ¿qué le debo?는 ‘제가 얼마를 드려야 하죠?’라는 말로, 계산할 때 흔히 써요.
      - who: A
        textbook:
          es: Cuestan cuatro euros. ¿Algo más?
          ko: 4유로예요. 더 필요한 거 있으세요?
        native:
          es: Son cuatro euros. ¿Alguna cosita más?
          ko: 4유로예요. 다른 건 필요 없으세요?
          note_ko: cosita는 cosa(것)를 작게 부르는 말이에요. 말이 부드러워져요.
      - who: B
        textbook:
          es: Sí. ¿Me da unas tiritas, por favor? Tengo una ampolla en el pie.
          ko: 네. 반창고 좀 주시겠어요? 발에 물집이 생겼어요.
        native:
          es: Ah, sí, unas tiritas. Es que con tanto caminar me ha salido una ampolla en el pie.
          ko: 아, 네, 반창고도요. 너무 많이 걸었더니 발에 물집이 생겼거든요.
          note_ko: es que는 이유를 덧붙일 때 ‘~거든요’처럼 써요.
      - who: A
        textbook:
          es: Aquí tiene. Son seis euros en total.
          ko: 여기 있어요. 모두 6유로예요.
        native:
          es: Tome. Pues seis en total. Y si mañana sigue el dolor de cabeza, vaya al médico, ¿eh?
          ko: 여기요. 그럼 다 해서 6유로예요. 내일도 머리가 계속 아프면 병원에 가 보세요.
          note_ko: ir al médico는 ‘병원에 가다, 진료를 받다’예요.
      - who: B
        textbook:
          es: Muchas gracias. Adiós.
          ko: 고맙습니다. 안녕히 계세요.
        native:
          es: Gracias, muy amable. ¡Agur!
          ko: 고마워요, 친절하시네요. 안녕히 계세요!
          note_ko: agur는 바스크어 작별 인사예요. 빌바오에서는 스페인어로 말하다가도 자주 써요.
  - id: d2
    title_es: Por la noche, una farmacia de guardia
    title_ko: 밤에 당번 약국 찾기
    setting_ko: 빌바오의 호텔 방, 밤 열한 시. 저녁을 먹고 나서 배가 아파요.
    roles:
      A: {es: Amiga, ko: 친구}
      B: {es: Turista, ko: 여행자}
    lines:
      - who: A
        textbook:
          es: ¿Qué te pasa? Tienes mala cara.
          ko: 무슨 일 있어? 얼굴이 안 좋아.
        native:
          es: Oye, ¿estás bien? Tienes mala cara.
          ko: 야, 괜찮아? 얼굴이 안 좋아 보여.
          note_ko: tener mala cara는 ‘안색이 안 좋다’예요.
      - who: B
        textbook:
          es: Me duele el estómago desde la cena.
          ko: 저녁 먹고 나서부터 배가 아파.
        native:
          es: Uf, no mucho. Me duele la tripa desde la cena.
          ko: 휴, 별로야. 저녁 먹고 나서부터 배가 아파.
          note_ko: la tripa는 배를 편하게 부르는 말이에요. 격식 있게는 el estómago예요.
      - who: A
        textbook:
          es: ¿Vamos a la farmacia? Hay una farmacia de guardia cerca.
          ko: 약국에 갈까? 근처에 당번 약국이 있어.
        native:
          es: ¿Bajamos a la farmacia? Hay una de guardia aquí cerca.
          ko: 약국에 내려가 볼까? 이 근처에 당번 약국이 있어.
          note_ko: farmacia de guardia는 밤이나 휴일에도 문을 여는 당번 약국이에요.
      - who: B
        textbook:
          es: Sí. ¿Está abierta ahora? Son las once de la noche.
          ko: 응. 지금 열었을까? 밤 열한 시인데.
        native:
          es: Vale. ¿Pero a estas horas está abierta?
          ko: 그래. 근데 이 시간에 열었어?
          note_ko: a estas horas는 ‘이렇게 늦은 시간에’라는 느낌이에요.
      - who: A
        textbook:
          es: Sí, las farmacias de guardia abren por la noche.
          ko: 응, 당번 약국은 밤에도 열어.
        native:
          es: Claro, para eso es de guardia. Mira, la cruz verde está encendida.
          ko: 그럼, 그러니까 당번 약국이지. 봐, 녹색 십자 간판에 불이 켜져 있잖아.
          note_ko: 스페인 약국은 녹색 십자 간판으로 알아봐요.
      - who: B
        textbook:
          es: ¿Qué le digo a la farmacéutica?
          ko: 약사한테 뭐라고 말해?
        native:
          es: ¿Y qué le digo? No sé cómo se dice.
          ko: 근데 뭐라고 해? 어떻게 말하는지 모르겠어.
          note_ko: ¿cómo se dice?는 ‘어떻게 말해요?’예요. 여행 중에 아주 쓸모 있어요.
      - who: A
        textbook:
          es: 'Dile: «Me duele el estómago. ¿Tiene algo para esto?»'
          ko: “배가 아파요. 이럴 때 먹는 약 있어요?”라고 말해.
        native:
          es: 'Fácil: «Me duele el estómago, ¿me da algo?». Y ya está.'
          ko: 쉬워. “배가 아파요, 약 좀 주시겠어요?” 그러면 돼.
          note_ko: y ya está는 ‘그거면 끝이야’라는 말이에요.
      - who: B
        textbook:
          es: ¿Y si necesito una receta?
          ko: 처방전이 필요하면?
        native:
          es: ¿Y si me pide receta?
          ko: 처방전 달라고 하면 어떡해?
          note_ko: ¿y si…?는 ‘…하면 어쩌지?’ 하고 걱정을 꺼낼 때 써요.
      - who: A
        textbook:
          es: Seguramente no. Y si mañana te duele, vamos al médico.
          ko: 아마 필요 없을 거야. 내일도 아프면 병원에 가자.
        native:
          es: Tranqui, seguramente no. Y si mañana sigues igual, al médico.
          ko: 걱정 마, 아마 아닐 거야. 내일도 그대로면 병원 가자.
          note_ko: tranqui는 tranquilo를 줄인 말로 ‘걱정 마’예요.
      - who: B
        textbook:
          es: Vale, gracias. Vamos.
          ko: 그래, 고마워. 가자.
        native:
          es: Vale, venga, vamos.
          ko: 알았어, 자, 가자.
          note_ko: venga, vamos는 ‘자, 가자’ 하고 일어설 때 써요.
readings:
  - id: r1
    title_es: Un día largo en Bilbao
    title_ko: 빌바오에서 보낸 긴 하루
    level: A1
    paragraphs:
      - es: Hoy es 18 de mayo y estoy en Bilbao. Camino mucho por la ría y por el Casco Viejo. Por la tarde me duelen los pies y las piernas.
        ko: 오늘은 5월 18일, 저는 빌바오에 있어요. 강가와 구시가지를 많이 걸어요. 오후가 되니 발과 다리가 아파요.
      - es: En un pie tengo una ampolla. Busco una farmacia y veo una cruz verde. Entro y pido unas tiritas.
        ko: 한쪽 발에 물집이 생겼어요. 약국을 찾다가 녹색 십자 간판을 봐요. 들어가서 반창고를 달라고 해요.
      - es: La farmacéutica es muy amable. Me da las tiritas y una crema para los pies. Vuelvo al hotel despacio. Mañana voy a Pamplona, ¡pero con zapatos cómodos!
        ko: 약사는 아주 친절해요. 반창고와 발에 바르는 크림을 줘요. 천천히 호텔로 돌아와요. 내일은 팜플로나에 가요. 편한 신발을 신고요!
    questions:
      - q_ko: 글쓴이의 발에 무엇이 생겼나요?
        choices_ko: [상처, 물집, 멍]
        answer: 1
      - q_ko: 글쓴이는 약국을 어떻게 찾았나요?
        choices_ko: [지도를 보고, 사람에게 물어서, 녹색 십자 간판을 보고]
        answer: 2
      - q_ko: 글쓴이는 내일 어디에 가나요?
        choices_ko: [팜플로나, 마드리드, 발렌시아]
        answer: 0
  - id: r2
    title_es: La farmacia de guardia
    title_ko: 당번 약국
    level: A2
    paragraphs:
      - es: En España, las farmacias tienen una cruz verde en la calle. Por la noche y en los días de fiesta muchas cierran, pero en cada ciudad hay farmacias de guardia.
        ko: 스페인 약국은 길에 녹색 십자 간판을 걸어 둬요. 밤이나 휴일에는 문을 닫는 곳이 많지만, 도시마다 당번 약국이 있어요.
      - es: Muchas farmacias ponen en la puerta un cartel con las farmacias de guardia de la zona. Así es fácil encontrar una abierta.
        ko: 많은 약국이 문에 그 동네 당번 약국 목록을 붙여 둬요. 그래서 문을 연 곳을 쉽게 찾을 수 있어요.
      - es: Esta noche me duele el estómago. Mi amiga y yo vamos a una farmacia de guardia cerca del hotel. La farmacéutica me ha hecho unas preguntas y me ha dado un jarabe. No he necesitado receta. Si mañana sigo igual, voy al médico.
        ko: 오늘 밤 배가 아파요. 친구와 함께 호텔 근처 당번 약국에 가요. 약사가 몇 가지를 묻더니 시럽을 줬어요. 처방전은 필요 없었어요. 내일도 그대로면 병원에 갈 거예요.
    questions:
      - q_ko: 당번 약국은 어떤 약국인가요?
        choices_ko: [밤이나 휴일에도 여는 약국, 아침에만 여는 약국, 여름에만 여는 약국]
        answer: 0
      - q_ko: 문을 연 당번 약국은 어떻게 찾을 수 있나요?
        choices_ko: [호텔에 전화해서, 약국 문에 붙은 목록을 보고, 경찰에게 물어서]
        answer: 1
      - q_ko: 약사는 글쓴이에게 무엇을 줬나요?
        choices_ko: [알약, 체온계, 시럽]
        answer: 2
glossary:
