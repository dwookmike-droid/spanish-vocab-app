schema_version: 1
chapter: 12
dialogues:
  - id: d1
    title_es: Perdido en los callejones
    title_ko: 골목에서 길을 잃었을 때
    setting_ko: 톨레도 옛 시가지의 좁은 골목. 대성당을 찾다가 길을 잃었어요.
    roles:
      A: {es: Señora, ko: 아주머니}
      B: {es: Turista, ko: 여행자}
    lines:
      - who: B
        textbook:
          es: Perdone, señora. ¿Cómo se va a la catedral?
          ko: 실례합니다. 대성당에 어떻게 가요?
        native:
          es: Perdone, ¿la catedral, por dónde queda?
          ko: 저기요, 대성당이 어느 쪽이에요?
          note_ko: ¿por dónde queda?는 ‘어느 쪽에 있어요?’ 하고 방향을 묻는 말이에요.
      - who: A
        textbook:
          es: Está cerca. Siga todo recto por esta calle.
          ko: 가까워요. 이 길로 쭉 가세요.
        native:
          es: Ay, está aquí al lado. Mire, siga todo recto por esta calle.
          ko: 아, 바로 근처예요. 보세요, 이 길로 쭉 가세요.
          note_ko: aquí al lado는 ‘바로 옆’이지만 ‘아주 가까워요’라는 뜻으로 넓게 써요.
      - who: B
        textbook:
          es: Todo recto. ¿Y después?
          ko: 쭉 가고요. 그다음은요?
        native:
          es: Vale, todo recto… ¿y luego?
          ko: 네, 쭉 가서… 그다음은요?
          note_ko: 들은 말을 되풀이하며 확인하는 건 길을 물을 때 아주 흔해요.
      - who: A
        textbook:
          es: En el cruce, gire a la izquierda. Después suba la cuesta.
          ko: 교차로에서 왼쪽으로 도세요. 그다음 비탈길을 올라가세요.
        native:
          es: Al llegar al cruce, a la izquierda, y suba la cuesta.
          ko: 교차로에 가면 왼쪽으로 가서 비탈길을 올라가세요.
          note_ko: al llegar는 ‘도착하면’이에요. 길을 알려 줄 때는 gire를 빼고 a la izquierda만 말하기도 해요.
      - who: B
        textbook:
          es: ¿Está lejos de aquí?
          ko: 여기서 멀어요?
        native:
          es: ¿Y se tarda mucho andando?
          ko: 걸어서 오래 걸려요?
          note_ko: andando는 ‘걸어서’예요. se tarda는 ‘(시간이) 걸리다’예요.
      - who: A
        textbook:
          es: No, está a cinco minutos a pie. Al final de la cuesta, la catedral está enfrente.
          ko: 아니요, 걸어서 5분이에요. 비탈길 끝에 가면 대성당이 맞은편에 있어요.
        native:
          es: Qué va, cinco minutos. Arriba del todo la tiene enfrente. No tiene pérdida.
          ko: 아니요, 5분이요. 꼭대기까지 가면 바로 맞은편이에요. 못 찾을 수가 없어요.
          note_ko: no tiene pérdida는 ‘헷갈릴 일 없어요, 바로 찾아요’라는 말이에요.
      - who: B
        textbook:
          es: ¿Me lo puede enseñar en el mapa, por favor?
          ko: 지도에서 좀 보여 주실 수 있어요?
        native:
          es: Perdone, ¿me lo enseña en el mapa? Es que me pierdo con tanto callejón.
          ko: 죄송한데 지도에서 좀 보여 주실래요? 골목이 너무 많아서 자꾸 길을 잃어요.
          note_ko: es que는 ‘그게, ~거든요’ 하고 사정을 말할 때 써요. me lo는 ‘나에게 그것을’이에요.
      - who: A
        textbook:
          es: Sí. Mire, nosotros estamos aquí. La catedral está aquí, un poco más al sur.
          ko: 네. 보세요, 우리는 여기 있어요. 대성당은 여기, 조금 더 남쪽이에요.
        native:
          es: A ver… Estamos aquí, ¿ve? Y la catedral, aquí, un poquito más al sur.
          ko: 어디 보자… 우리가 여기 있죠, 보이죠? 대성당은 여기, 조금 더 남쪽이에요.
          note_ko: ¿ve?는 ‘보이죠?’ 하고 확인하는 말이에요. poquito는 poco보다 더 ‘조금’이에요.
      - who: B
        textbook:
          es: Ahora lo entiendo. Muchas gracias, señora.
          ko: 이제 알겠어요. 정말 고맙습니다.
        native:
          es: Ah, vale, ya lo veo. ¡Muchas gracias!
          ko: 아, 네, 이제 알겠어요. 정말 고마워요!
          note_ko: ya lo veo는 ‘이제 보여요’, 곧 ‘이제 알겠어요’라는 뜻이에요.
      - who: A
        textbook:
          es: De nada. Adiós.
          ko: 천만에요. 잘 가요.
        native:
          es: A usted. Y no se pierda otra vez, ¿eh?
          ko: 제가 고맙죠. 또 길 잃지 마세요!
          note_ko: a usted는 고맙다는 말에 ‘제가 더 고맙죠’ 하고 돌려주는 말이에요.
  - id: d2
    title_es: Buscar el hotel con la maleta
    title_ko: 가방을 끌고 호텔 찾기
    setting_ko: 소코도베르 광장 근처. 호텔이 있는 길을 몰라 젊은 사람에게 물어요.
    roles:
      A: {es: Chico, ko: 젊은이}
      B: {es: Turista, ko: 여행자}
    lines:
      - who: B
        textbook:
          es: Perdone, busco esta calle. ¿Sabe dónde está?
          ko: 실례합니다, 이 길을 찾고 있어요. 어디 있는지 아세요?
        native:
          es: Perdona, ¿sabes dónde está esta calle? Llevo un rato dando vueltas.
          ko: 저기요, 이 길이 어디 있는지 알아요? 한참 헤매고 있어서요.
          note_ko: dar vueltas는 ‘빙빙 돌다, 헤매다’예요. llevar 뒤에 시간을 붙이면 ‘~째’가 돼요.
      - who: A
        textbook:
          es: A ver… Sí. Está detrás de la plaza de Zocodover.
          ko: 어디 보자… 네. 소코도베르 광장 뒤에 있어요.
        native:
          es: A ver, déjame ver… Ah, sí, esta está detrás de Zocodover.
          ko: 어디, 좀 볼게요… 아, 네, 이 길은 소코도베르 뒤예요.
          note_ko: déjame ver는 ‘좀 볼게요’예요. 잘 알려진 광장은 plaza를 빼고 이름만 말하기도 해요.
      - who: B
        textbook:
          es: ¿Y cómo voy?
          ko: 그럼 어떻게 가요?
        native:
          es: ¿Y por dónde tiro?
          ko: 어느 쪽으로 가면 돼요?
          note_ko: tirar por는 구어로 ‘~ 쪽으로 가다’라는 뜻이에요.
      - who: A
        textbook:
          es: Cruce la plaza y tome la primera calle a la derecha.
          ko: 광장을 건너서 오른쪽 첫 번째 길로 가세요.
        native:
          es: Cruzas la plaza y coges la primera a la derecha, la de la cuesta.
          ko: 광장을 건너서 오른쪽 첫 번째 길로 가요. 비탈진 길이요.
          note_ko: 길을 알려 줄 때 현재형(cruzas, coges)도 많이 써요. la primera는 la primera calle예요.
      - who: B
        textbook:
          es: ¿La calle de la señal azul?
          ko: 파란 표지판 있는 길이요?
        native:
          es: ¿La que tiene una señal azul en la esquina?
          ko: 모퉁이에 파란 표지판 있는 길이요?
          note_ko: la que는 ‘~하는 그것’이에요. 앞에서 말한 calle를 받아요.
      - who: A
        textbook:
          es: Sí, esa. El hotel está a la izquierda, enfrente de una iglesia pequeña.
          ko: 네, 거기요. 호텔은 왼쪽에 있어요. 작은 성당 맞은편이에요.
        native:
          es: Esa misma. Subes un poco y el hotel lo tienes a mano izquierda, enfrente de una iglesia.
          ko: 바로 거기요. 조금 올라가면 호텔이 왼쪽에 있어요. 성당 맞은편이에요.
          note_ko: a mano izquierda는 ‘왼편에’예요. a la izquierda와 같은 뜻이에요.
      - who: B
        textbook:
          es: ¿Está lejos? Tengo una maleta grande.
          ko: 멀어요? 가방이 커서요.
        native:
          es: ¿Y está muy lejos? Lo digo por la maleta…
          ko: 많이 멀어요? 가방 때문에 물어보는 거예요…
          note_ko: lo digo por…는 ‘… 때문에 하는 말이에요’예요.
      - who: A
        textbook:
          es: No, está muy cerca. Unos tres minutos.
          ko: 아니요, 아주 가까워요. 3분쯤이요.
        native:
          es: Nada, está a tres minutos. Eso sí, todo cuesta arriba.
          ko: 금방이에요, 3분 거리예요. 대신 계속 오르막이에요.
          note_ko: cuesta arriba는 ‘오르막으로’예요. eso sí는 ‘다만, 대신’이에요.
      - who: B
        textbook:
          es: Muchas gracias.
          ko: 고맙습니다.
        native:
          es: Vale, pues allá voy. ¡Gracias!
          ko: 네, 그럼 가 볼게요. 고마워요!
          note_ko: allá voy는 ‘그럼 가 볼게요’ 하고 움직이기 시작할 때 써요.
      - who: A
        textbook:
          es: De nada.
          ko: 천만에요.
        native:
          es: ¡De nada! ¡Ánimo con la cuesta!
          ko: 천만에요! 오르막 힘내요!
          note_ko: ánimo는 ‘힘내요’예요. 힘든 일을 앞둔 사람에게 건네요.
readings:
  - id: r1
    title_es: Toledo, una ciudad de cuestas
    title_ko: 비탈길의 도시 톨레도
    level: A1
    paragraphs:
      - es: Hoy es 14 de mayo. Llego a Toledo en tren desde Madrid. La estación está abajo, cerca del río, y la ciudad antigua está arriba, en una colina.
        ko: 오늘은 5월 14일이에요. 마드리드에서 기차를 타고 톨레도에 도착해요. 역은 아래쪽 강 가까이에 있고, 옛 시가지는 위쪽 언덕 위에 있어요.
      - es: Para subir hay muchas cuestas. Las calles son estrechas y hay callejones por todas partes. Miro el mapa, giro a la derecha, después a la izquierda… y no sé dónde estoy.
        ko: 올라가려면 비탈길이 많아요. 길은 좁고 골목이 사방에 있어요. 지도를 보고 오른쪽으로 돌고, 그다음 왼쪽으로… 그리고 여기가 어딘지 모르겠어요.
      - es: Una señora me ayuda. «Siga todo recto y, en el cruce, a la izquierda», me dice. Por fin llego a la plaza de Zocodover. Allí me siento y descanso un poco.
        ko: 한 아주머니가 도와줘요. «쭉 가다가 교차로에서 왼쪽으로 가세요»라고 말해 줘요. 드디어 소코도베르 광장에 도착해요. 거기 앉아서 잠깐 쉬어요.
    questions:
      - q_ko: 톨레도 역은 어디에 있나요?
        choices_ko: [언덕 위, 아래쪽 강 가까이, 소코도베르 광장 옆]
        answer: 1
      - q_ko: 길을 잃은 글쓴이를 누가 도와줬나요?
        choices_ko: [역무원, 한 아주머니, 호텔 직원]
        answer: 1
  - id: r2
    title_es: Norte, sur, este y oeste
    title_ko: 동서남북으로 길 찾기
    level: A2
    paragraphs:
      - es: En Toledo, el río Tajo rodea la ciudad por tres lados, el este, el sur y el oeste. Solo el lado norte no tiene río. Por eso, desde muchos sitios, para entrar en la ciudad hay que cruzar un puente.
        ko: 톨레도는 타호강이 동쪽, 남쪽, 서쪽 세 방향으로 도시를 감싸고 있어요. 북쪽만 강이 없어요. 그래서 많은 곳에서는 다리를 건너야 도시에 들어갈 수 있어요.
      - es: En un mapa, el norte está arriba y el sur, abajo. Pero en la calle, la gente no suele hablar del norte o del sur. Dice «a la derecha», «a la izquierda» o «todo recto».
        ko: 지도에서는 북쪽이 위, 남쪽이 아래예요. 하지만 길에서 사람들은 북쪽이나 남쪽을 잘 말하지 않아요. «오른쪽으로», «왼쪽으로», «쭉 가세요»라고 해요.
      - es: También usa palabras como «delante de», «detrás de», «enfrente de» o «al lado de». Por ejemplo, «La farmacia está enfrente de la iglesia, al lado del banco». Con estas palabras y un mapa, es difícil perderse… ¡o no tanto!
        ko: «앞에», «뒤에», «맞은편에», «옆에» 같은 말도 써요. 예를 들면 «약국은 성당 맞은편, 은행 옆에 있어요»처럼요. 이런 말과 지도만 있으면 길을 잃기 어려워요… 아니, 꼭 그렇지도 않아요!
    questions:
      - q_ko: 타호강은 톨레도를 어떻게 감싸고 있나요?
        choices_ko: [북쪽만, 동쪽·남쪽·서쪽 세 방향, 사방 전부]
        answer: 1
      - q_ko: 길에서 사람들은 보통 어떻게 길을 알려 주나요?
        choices_ko: [동서남북으로, 오른쪽·왼쪽·직진으로, 거리 번호로]
        answer: 1
glossary:
