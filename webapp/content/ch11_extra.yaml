schema_version: 1
chapter: 11
dialogues:
  - id: d1
    title_es: Un billete de tren para Toledo
    title_ko: 톨레도행 기차표 사기
    setting_ko: 마드리드 아토차역 매표 창구. 5월 14일 아침 기차표를 사려고 해요.
    roles:
      A: {es: Empleada, ko: 역무원}
      B: {es: Cliente, ko: 손님}
    lines:
      - who: B
        textbook:
          es: Buenos días. Quiero un billete para Toledo, por favor.
          ko: 안녕하세요. 톨레도행 표 한 장 사고 싶어요.
        native:
          es: Hola, buenas. Un billete para Toledo, por favor.
          ko: 안녕하세요. 톨레도 가는 표 한 장 주세요.
          note_ko: 인사하고 바로 필요한 걸 말해도 무례하지 않아요. quiero는 빼도 돼요.
      - who: A
        textbook:
          es: ¿Para qué día?
          ko: 며칠 표로 드릴까요?
        native:
          es: ¿Para cuándo?
          ko: 언제 가세요?
          note_ko: 날짜와 시간을 cuándo 하나로 짧게 물어요.
      - who: B
        textbook:
          es: Para el catorce de mayo, por la mañana.
          ko: 5월 14일 오전이요.
        native:
          es: Para el catorce, por la mañana.
          ko: 14일 오전이요.
          note_ko: 이번 달 날짜면 달 이름은 보통 빼고 말해요.
      - who: A
        textbook:
          es: Hay un tren a las nueve y veinte. ¿Quiere un billete de ida o de ida y vuelta?
          ko: 9시 20분 기차가 있어요. 편도로 드릴까요, 왕복으로 드릴까요?
        native:
          es: Tienes uno a las nueve y veinte. ¿Ida y vuelta?
          ko: 9시 20분 게 있어요. 왕복이에요?
          note_ko: billete de를 빼고 ida, ida y vuelta만 물어요. 창구 직원도 tú를 쓰기도 해요.
      - who: B
        textbook:
          es: Solo de ida, por favor. Después voy a Salamanca.
          ko: 편도만요. 그다음에 살라망카로 가거든요.
        native:
          es: Solo ida, que luego me voy a Salamanca.
          ko: 편도요. 그다음엔 살라망카로 가거든요.
          note_ko: 여기서 que는 ‘~거든요’처럼 이유를 덧붙여요. 말할 때 아주 흔해요.
      - who: A
        textbook:
          es: ¿Prefiere un asiento de ventanilla o de pasillo?
          ko: 창가 자리가 좋으세요, 통로 자리가 좋으세요?
        native:
          es: ¿Ventanilla o pasillo?
          ko: 창가요, 통로요?
          note_ko: 질문을 다 하지 않고 고를 것만 말해요.
      - who: B
        textbook:
          es: Ventanilla, por favor. ¿De qué andén sale el tren?
          ko: 창가로 주세요. 기차는 몇 번 승강장에서 출발해요?
        native:
          es: Ventanilla, porfa. ¿Y de qué andén sale?
          ko: 창가요. 근데 어느 승강장에서 떠나요?
          note_ko: porfa는 por favor를 줄인 말이에요. 가벼운 자리에서 써요.
      - who: A
        textbook:
          es: Todavía no lo sabemos. Mire la pantalla de la estación unos minutos antes.
          ko: 아직 몰라요. 몇 분 전에 역 안내 화면을 보세요.
        native:
          es: Eso sale en la pantalla un ratito antes. Llega con tiempo, ¿vale?
          ko: 그건 출발 조금 전에 화면에 떠요. 여유 있게 오세요, 알겠죠?
          note_ko: un ratito는 ‘잠깐’이에요. llega con tiempo는 ‘여유 있게 와요’라는 뜻이에요.
      - who: B
        textbook:
          es: Muy bien. Muchas gracias.
          ko: 알겠어요. 고맙습니다.
        native:
          es: Vale, genial. ¡Gracias!
          ko: 네, 좋아요. 고마워요!
          note_ko: vale와 genial은 스페인에서 아주 자주 쓰는 맞장구예요.
  - id: d2
    title_es: En la máquina del metro
    title_ko: 지하철 발매기 앞에서
    setting_ko: 마드리드 지하철역 발매기 앞. 표 사는 법을 몰라 옆 사람에게 물어요.
    roles:
      A: {es: Señora, ko: 아주머니}
      B: {es: Turista, ko: 여행자}
    lines:
      - who: B
        textbook:
          es: Perdone, ¿me puede ayudar? No sé cómo comprar un billete de metro.
          ko: 실례합니다, 좀 도와주실 수 있어요? 지하철 표를 어떻게 사는지 몰라서요.
        native:
          es: Perdone, ¿me echa una mano? No sé cómo va esto del billete.
          ko: 저기요, 좀 도와주실래요? 이 표 사는 걸 잘 모르겠어요.
          note_ko: echar una mano는 ‘도와주다’예요. esto del billete는 ‘이 표 얘기’ 정도의 말투예요.
      - who: A
        textbook:
          es: Sí, claro. Primero necesita una tarjeta de transporte.
          ko: 네, 그럼요. 먼저 교통카드가 있어야 해요.
        native:
          es: Claro. Mira, primero necesitas la tarjeta.
          ko: 그럼요. 봐요, 먼저 카드가 있어야 해요.
          note_ko: 처음 보는 사람에게도 tú(mira, necesitas)로 말하는 일이 많아요.
      - who: B
        textbook:
          es: ¿Dónde compro la tarjeta?
          ko: 카드는 어디서 사요?
        native:
          es: ¿Y la tarjeta dónde la saco?
          ko: 카드는 어디서 뽑아요?
          note_ko: sacar는 표나 카드를 ‘뽑다, 끊다’라는 뜻으로 많이 써요.
      - who: A
        textbook:
          es: En esta máquina. Después cargue los viajes en la tarjeta.
          ko: 이 기계에서요. 그다음에 카드에 이용 횟수를 충전하면 돼요.
        native:
          es: Aquí mismo, en la máquina. Luego le metes los viajes y listo.
          ko: 바로 여기 기계에서요. 그다음 카드에 횟수 넣으면 끝이에요.
          note_ko: meter는 ‘넣다’로, 여기서는 충전한다는 뜻이에요. listo는 ‘끝, 다 됐어’예요.
      - who: B
        textbook:
          es: Gracias. ¿Y qué línea tomo para ir a Sol?
          ko: 고마워요. 솔에 가려면 몇 호선을 타요?
        native:
          es: Genial. ¿Y qué línea cojo para ir a Sol?
          ko: 좋아요. 솔 가려면 몇 호선 타요?
          note_ko: coger는 스페인에서 교통수단을 ‘타다’라는 뜻으로 흔히 써요.
      - who: A
        textbook:
          es: Desde este andén. El próximo metro llega en dos minutos.
          ko: 이 승강장에서 타요. 다음 지하철은 2분 뒤에 와요.
        native:
          es: Este mismo andén. Mira, viene en dos minutos.
          ko: 바로 이 승강장이에요. 봐요, 2분 뒤에 와요.
          note_ko: mismo를 붙이면 ‘바로 이’라는 강조가 돼요.
      - who: B
        textbook:
          es: ¿Puedo ir con la maleta?
          ko: 여행 가방을 갖고 타도 돼요?
        native:
          es: ¿Y con la maleta no hay problema?
          ko: 가방 들고 타도 괜찮죠?
          note_ko: ‘해도 돼요?’를 ‘문제없죠?’로 바꿔 묻는 말이에요.
      - who: A
        textbook:
          es: Sí, no hay problema. Pero a esta hora hay mucha gente.
          ko: 네, 괜찮아요. 그런데 이 시간에는 사람이 많아요.
        native:
          es: Qué va, ningún problema. Eso sí, a esta hora va lleno.
          ko: 괜찮고말고요. 다만 이 시간엔 꽉 차요.
          note_ko: qué va는 ‘전혀요’, eso sí는 ‘다만’이에요. 둘 다 아주 흔한 구어예요.
      - who: B
        textbook:
          es: Muchas gracias por su ayuda.
          ko: 도와주셔서 정말 고마워요.
        native:
          es: ¡Mil gracias!
          ko: 정말 고마워요!
          note_ko: mil gracias는 ‘천 번 고마워요’라는 말로, 아주 고맙다는 뜻이에요.
      - who: A
        textbook:
          es: De nada. ¡Buen viaje!
          ko: 천만에요. 좋은 여행 하세요!
        native:
          es: ¡Nada! ¡Que vaya bien!
          ko: 별말씀을요! 잘 가요!
          note_ko: que vaya bien은 헤어질 때 ‘잘 다녀와요’ 하고 건네는 인사예요.
readings:
  - id: r1
    title_es: Un día en Madrid sin coche
    title_ko: 차 없이 마드리드 다니기
    level: A1
    paragraphs:
      - es: Hoy es 12 de mayo y estoy en Madrid. Dejo la maleta en el hotel y salgo con mi mochila.
        ko: 오늘은 5월 12일, 저는 마드리드에 있어요. 여행 가방은 호텔에 두고 배낭만 메고 나가요.
      - es: Por la mañana voy en metro. El metro es rápido y hay muchas estaciones. Después cojo un autobús. Desde la ventana veo la ciudad.
        ko: 오전에는 지하철을 타요. 지하철은 빠르고 역도 많아요. 그다음 버스를 타요. 창밖으로 도시가 보여요.
      - es: Por la tarde camino mucho. En la calle hay coches, motos, taxis y bicicletas. Espero en el semáforo y cruzo. Por la noche vuelvo al hotel en taxi. ¡Qué día tan largo!
        ko: 오후에는 많이 걸어요. 길에는 자동차, 오토바이, 택시, 자전거가 다녀요. 신호등에서 기다렸다가 건너요. 밤에는 택시를 타고 호텔로 돌아와요. 정말 긴 하루예요!
    questions:
      - q_ko: 글쓴이는 여행 가방을 어디에 두었나요?
        choices_ko: [호텔, 역, 택시]
        answer: 0
      - q_ko: 밤에 호텔로 무엇을 타고 돌아왔나요?
        choices_ko: [버스, 지하철, 택시]
        answer: 2
  - id: r2
    title_es: Un billete para Toledo
    title_ko: 톨레도행 기차표
    level: A2
    paragraphs:
      - es: Hoy voy a la estación de Atocha para comprar un billete de tren. Pasado mañana, el 14 de mayo, voy a Toledo.
        ko: 오늘은 기차표를 사러 아토차역에 가요. 모레, 5월 14일에 톨레도에 가거든요.
      - es: En la taquilla pido un billete de ida para el tren de las nueve y veinte. Elijo un asiento de ventanilla. No compro la vuelta, porque después de Toledo voy a Salamanca.
        ko: 창구에서 9시 20분 기차 편도표를 달라고 해요. 자리는 창가로 골라요. 톨레도 다음에는 살라망카로 가니까 돌아오는 표는 사지 않아요.
      - es: La empleada dice que el número del andén sale en la pantalla poco antes de salir. Por eso, el día 14 voy a llegar pronto a la estación, con la maleta y la mochila.
        ko: 역무원은 승강장 번호가 출발 조금 전에 화면에 뜬다고 해요. 그래서 14일에는 여행 가방과 배낭을 챙겨 역에 일찍 갈 거예요.
    questions:
      - q_ko: 기차는 몇 시에 출발하나요?
        choices_ko: [9시 2분, 9시 20분, 10시 20분]
        answer: 1
      - q_ko: 글쓴이는 왜 왕복표를 사지 않았나요?
        choices_ko: [톨레도에 오래 머물러서, 톨레도 다음에 살라망카로 가서, 돌아올 때는 버스를 타서]
        answer: 1
      - q_ko: 승강장 번호는 어떻게 알 수 있나요?
        choices_ko: [표에 적혀 있다, 출발 조금 전에 화면에 뜬다, 역무원에게 전화한다]
        answer: 1
