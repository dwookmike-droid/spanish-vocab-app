schema_version: 1
chapter: 16
dialogues:
  - id: d1
    title_es: ¿Qué tiempo va a hacer hoy?
    title_ko: 오늘 날씨 어때요?
    setting_ko: 도노스티아의 호텔 프런트. 5월 11일 아침, 나가기 전에 날씨를 물어요.
    roles:
      A: {es: Recepcionista, ko: 프런트 직원}
      B: {es: Huésped, ko: 손님}
    lines:
      - who: B
        textbook:
          es: Buenos días. ¿Qué tiempo va a hacer hoy?
          ko: 안녕하세요. 오늘 날씨 어떨까요?
        native:
          es: Buenos días. Oye, ¿qué tal el tiempo hoy?
          ko: 안녕하세요. 저기, 오늘 날씨 어때요?
          note_ko: 날씨를 물을 때 ¿qué tal el tiempo?처럼 동사 없이 짧게 묻기도 해요.
      - who: A
        textbook:
          es: Según la previsión, por la mañana va a hacer sol. Por la tarde va a llover.
          ko: 예보를 보면 오전에는 맑대요. 오후에는 비가 온대요.
        native:
          es: Pues mira, la previsión dice sol por la mañana, pero esta tarde llueve seguro.
          ko: 음, 예보로는 오전엔 맑은데, 오늘 오후엔 틀림없이 비 와요.
          note_ko: 곧 일어날 일도 현재형(llueve)으로 말할 때가 많아요. seguro는 ‘틀림없이’예요.
      - who: B
        textbook:
          es: ¿Necesito un paraguas?
          ko: 우산이 필요할까요?
        native:
          es: ¿Me llevo el paraguas, entonces?
          ko: 그럼 우산 챙겨 갈까요?
          note_ko: llevarse는 ‘챙겨 가다’예요.
      - who: A
        textbook:
          es: Sí, lleve el paraguas, por si acaso. Aquí el tiempo cambia mucho.
          ko: 네, 혹시 모르니 우산을 챙기세요. 여기는 날씨가 자주 바뀌어요.
        native:
          es: Sí, sí, llévatelo, por si acaso. Aquí el tiempo cambia en cinco minutos.
          ko: 네, 챙겨 가세요. 혹시 모르니까요. 여긴 5분 만에 날씨가 바뀌어요.
          note_ko: por si acaso는 ‘혹시 모르니까’예요. ‘5분 만에’는 농담 섞인 과장이에요.
      - who: B
        textbook:
          es: ¿Qué temperatura hace ahora?
          ko: 지금 기온이 몇 도예요?
        native:
          es: ¿Y a cuántos grados estamos?
          ko: 지금 몇 도예요?
          note_ko: 기온은 estar a ~ grados로 말해요. ‘우리가 몇 도에 있어요?’라는 틀이에요.
      - who: A
        textbook:
          es: Ahora hace dieciséis grados. No hace mucho frío, pero hace viento.
          ko: 지금 16도예요. 많이 춥진 않은데 바람이 불어요.
        native:
          es: Estamos a dieciséis, más o menos. Frío no hace, pero sopla bastante viento.
          ko: 지금 16도쯤이에요. 춥진 않은데 바람이 꽤 불어요.
          note_ko: frío를 앞에 두면 ‘춥지는 않다’는 느낌이 돼요. soplar는 바람이 ‘불다’예요.
      - who: B
        textbook:
          es: ¿Puedo ir a la playa de La Concha por la tarde?
          ko: 오후에 라 콘차 해변에 가도 될까요?
        native:
          es: ¿Y para ir a La Concha por la tarde?
          ko: 오후에 라 콘차 가는 건요?
          note_ko: 문장을 끝맺지 않고 para ir a…? 하고 ‘~가는 건요?’처럼 물어요.
      - who: A
        textbook:
          es: Es mejor ir por la mañana. Por la tarde puede haber tormenta.
          ko: 오전에 가는 게 나아요. 오후에는 폭풍우가 칠 수도 있어요.
        native:
          es: Yo iría ahora, que hace sol. Por la tarde igual hay tormenta.
          ko: 저라면 지금 가겠어요. 해가 났거든요. 오후엔 폭풍우가 칠지도 몰라요.
          note_ko: yo iría는 ‘저라면 가겠어요’예요. igual은 ‘어쩌면’이라는 뜻으로 스페인에서 흔해요.
      - who: B
        textbook:
          es: Muchas gracias. Voy ahora.
          ko: 고맙습니다. 지금 갈게요.
        native:
          es: ¡Pues me voy ya! Gracias.
          ko: 그럼 지금 바로 갈게요! 고마워요.
          note_ko: 여기서 ya는 ‘지금 바로’예요.
  - id: d2
    title_es: Un chaparrón en La Concha
    title_ko: 라 콘차에서 만난 소나기
    setting_ko: 라 콘차 해변 산책로. 갑자기 비가 쏟아져 발코니 아래로 피했어요.
    roles:
      A: {es: Señora, ko: 아주머니}
      B: {es: Turista, ko: 여행자}
    lines:
      - who: A
        textbook:
          es: ¡Qué lluvia! ¿No tiene paraguas?
          ko: 비가 엄청 오네요! 우산 없어요?
        native:
          es: ¡Vaya chaparrón! ¿Te has dejado el paraguas?
          ko: 소나기가 쏟아지네요! 우산 두고 왔어요?
          note_ko: chaparrón은 갑자기 쏟아지는 소나기예요. dejarse는 ‘깜빡 두고 오다’예요.
      - who: B
        textbook:
          es: No, el paraguas está en el hotel. Por la mañana hacía sol.
          ko: 네, 우산은 호텔에 있어요. 아침에는 맑았거든요.
        native:
          es: Pues sí, en el hotel. ¡Con el sol que hacía esta mañana!
          ko: 네, 호텔에요. 아침엔 그렇게 해가 쨍쨍했는데!
          note_ko: con el sol que hacía는 ‘그렇게 해가 났는데’ 하고 아쉬움을 담는 말이에요.
      - who: A
        textbook:
          es: Aquí llueve mucho. Yo siempre llevo un chubasquero en el bolso.
          ko: 여기는 비가 자주 와요. 저는 늘 가방에 비옷을 넣고 다녀요.
        native:
          es: Aquí es lo normal. Yo siempre llevo el chubasquero en el bolso.
          ko: 여긴 늘 그래요. 저는 비옷을 항상 가방에 넣고 다녀요.
          note_ko: es lo normal은 ‘흔한 일이에요, 늘 그래요’라는 말이에요.
      - who: B
        textbook:
          es: ¿Llueve mucho en primavera?
          ko: 봄에도 비가 많이 와요?
        native:
          es: ¿Y en primavera también llueve tanto?
          ko: 봄에도 이렇게 많이 와요?
          note_ko: tanto는 ‘그렇게 많이’예요.
      - who: A
        textbook:
          es: Sí, llueve en todas las estaciones. Pero después de la lluvia, el cielo está muy bonito.
          ko: 네, 계절마다 비가 와요. 그래도 비 온 뒤에는 하늘이 아주 예뻐요.
        native:
          es: Aquí llueve en todas las estaciones. Pero luego sale el sol y se queda un cielo precioso.
          ko: 여긴 사계절 내내 비가 와요. 그래도 그다음엔 해가 나고 하늘이 정말 예뻐져요.
          note_ko: sale el sol은 ‘해가 나다’예요. se queda는 ‘~한 상태가 되다’예요.
      - who: B
        textbook:
          es: ¿Es un trueno? ¡Hay tormenta!
          ko: 천둥인가요? 폭풍우가 치네요!
        native:
          es: ¡Uy! ¿Eso ha sido un trueno?
          ko: 아이고! 방금 그거 천둥이에요?
          note_ko: uy는 깜짝 놀랐을 때 내는 소리예요. ha sido는 ‘방금 ~였다’예요.
      - who: A
        textbook:
          es: Sí, pero no pasa nada. Estas tormentas son cortas.
          ko: 네, 그래도 괜찮아요. 이런 폭풍우는 금방 끝나요.
        native:
          es: Sí, pero esto pasa enseguida. En diez minutos, ni una nube.
          ko: 네, 근데 금방 지나가요. 10분이면 구름 한 점 없을걸요.
          note_ko: enseguida는 ‘금방’이에요. ni una nube는 ‘구름 한 점 없이’라는 말이에요.
      - who: B
        textbook:
          es: ¡Mire! Hay un arcoíris sobre el mar.
          ko: 보세요! 바다 위에 무지개가 떴어요.
        native:
          es: ¡Anda, mire! ¡Un arcoíris!
          ko: 와, 저기 보세요! 무지개예요!
          note_ko: anda는 뭔가를 보고 놀랄 때 하는 ‘와, 어’ 같은 말이에요.
      - who: A
        textbook:
          es: ¡Qué bonito! ¿Ves? Ahora hace sol otra vez.
          ko: 정말 예쁘네요! 봐요, 이제 또 해가 나잖아요.
        native:
          es: ¿Ves? Lo que te decía, aquí el tiempo es así.
          ko: 봐요, 내 말 맞죠? 여기 날씨는 원래 이래요.
          note_ko: lo que te decía는 ‘내가 말했잖아요’예요.
readings:
  - id: r1
    title_es: Sol, lluvia y arcoíris
    title_ko: 해, 비, 그리고 무지개
    level: A1
    paragraphs:
      - es: Hoy es 11 de mayo y estoy en Donostia. Por la mañana hace sol y el cielo está azul. Voy a la playa de La Concha sin paraguas.
        ko: 오늘은 5월 11일, 저는 도노스티아에 있어요. 오전에는 해가 나고 하늘이 파래요. 우산 없이 라 콘차 해변에 가요.
      - es: A las doce llegan las nubes. Hace viento y empieza la lluvia. Luego hay una tormenta corta, con truenos y rayos.
        ko: 열두 시에 구름이 몰려와요. 바람이 불고 비가 내리기 시작해요. 그다음 천둥 번개가 치는 짧은 폭풍우가 지나가요.
      - es: Espero debajo de un balcón con una señora. Ella tiene chubasquero, ¡y yo no! Después sale el sol y vemos un arcoíris sobre el mar. La próxima vez, llevo el paraguas.
        ko: 어떤 아주머니와 함께 발코니 아래에서 비를 피해요. 아주머니는 비옷이 있는데 저는 없어요! 그러다 해가 나고, 바다 위로 뜬 무지개를 함께 봐요. 다음번엔 우산을 챙길 거예요.
    questions:
      - q_ko: 오전 날씨는 어땠나요?
        choices_ko: [맑았다, 비가 왔다, 눈이 왔다]
        answer: 0
      - q_ko: 글쓴이는 어디에서 비를 피했나요?
        choices_ko: [발코니 아래, 호텔 로비, 버스 안]
        answer: 0
      - q_ko: 비가 그친 뒤 무엇을 봤나요?
        choices_ko: [안개, 무지개, 눈]
        answer: 1
  - id: r2
    title_es: La previsión para mañana
    title_ko: 내일 일기 예보
    level: A2
    paragraphs:
      - es: Esta es la previsión del tiempo para mañana en el norte de España. Por la mañana, niebla en la costa y cielo con nubes. La temperatura máxima va a ser de dieciocho grados, y la mínima, de once.
        ko: 스페인 북부의 내일 일기 예보예요. 오전에는 해안에 안개가 끼고 구름이 많아요. 최고 기온은 18도, 최저 기온은 11도예요.
      - es: Por la tarde, lluvia y viento fuerte del noroeste. En las montañas puede haber tormenta, con truenos y rayos.
        ko: 오후에는 비가 오고 북서쪽에서 센 바람이 불어요. 산간에서는 천둥 번개를 동반한 폭풍우가 칠 수도 있어요.
      - es: En el País Vasco, a la lluvia fina la llaman «sirimiri». Parece poca agua, pero moja mucho. Por eso, mucha gente sale de casa con paraguas o chubasquero, por si acaso.
        ko: 바스크 지방에서는 가는 비를 «sirimiri»라고 불러요. 빗줄기는 약해 보여도 옷이 꽤 젖어요. 그래서 혹시 몰라 우산이나 비옷을 챙겨 나가는 사람이 많아요.
    questions:
      - q_ko: 내일 최고 기온은 몇 도인가요?
        choices_ko: [11도, 16도, 18도]
        answer: 2
      - q_ko: sirimiri는 무엇인가요?
        choices_ko: [가는 비, 센 바람, 짙은 안개]
        answer: 0
