schema_version: 1
chapter: 3
dialogues:
  - id: d1
    title_es: En el salón de una amiga
    title_ko: 친구네 거실에 놀러 갔을 때
    setting_ko: 세비야 친구 카르멘의 집. 거실로 들어서요.
    roles:
      A: {es: Carmen, ko: 카르멘(친구)}
      B: {es: Viajero, ko: 여행자}
    lines:
      - who: A
        textbook:
          es: ¡Hola! Pasa, por favor. Este es el salón.
          ko: 안녕! 들어와. 여기가 거실이야.
        native:
          es: ¡Hola! Pasa, pasa, estás en tu casa.
          ko: 안녕! 들어와, 편하게 있어.
          note_ko: estás en tu casa는 '네 집처럼 편히 있어'예요. 손님을 맞을 때 흔히 해요.
      - who: B
        textbook:
          es: Gracias. Tu salón es muy bonito.
          ko: 고마워. 거실이 정말 예쁘다.
        native:
          es: ¡Qué salón más bonito! Y qué luz.
          ko: 거실 진짜 예쁘다! 빛도 잘 들고.
          note_ko: ¡Qué + 명사 + más + 형용사!는 감탄할 때 쓰는 틀이에요.
      - who: A
        textbook:
          es: Gracias. Siéntate en el sofá, por favor.
          ko: 고마워. 소파에 앉아.
        native:
          es: Anda, siéntate donde quieras.
          ko: 자, 아무 데나 앉아.
          note_ko: anda는 '자, 어서'처럼 권할 때 앞에 붙이는 말이에요.
      - who: B
        textbook:
          es: ¿Puedo sentarme en el sillón? Me gustan los cojines.
          ko: 안락의자에 앉아도 돼? 쿠션이 마음에 들어.
        native:
          es: Pues me quedo con el sillón, que parece comodísimo.
          ko: 그럼 난 안락의자. 엄청 편해 보여.
          note_ko: me quedo con은 '…로 할게'예요. -ísimo는 '아주'의 뜻을 더한 강조형이에요.
      - who: A
        textbook:
          es: Claro. ¿Tienes calor? Puedo cerrar la cortina.
          ko: 그럼. 더워? 커튼 칠까?
        native:
          es: Claro. ¿Tienes calor? Si quieres, bajo la persiana.
          ko: 그럼. 더워? 원하면 블라인드 내릴게.
          note_ko: 스페인 집 창에는 persiana(덧창 블라인드)가 흔해서, 더우면 그걸 내려요.
      - who: B
        textbook:
          es: Sí, un poco. ¿De quién es ese cuadro?
          ko: 응, 조금. 저 그림은 누구 거야?
        native:
          es: Un poquito, sí. Oye, ¿y ese cuadro? Me encanta.
          ko: 응, 좀. 저기, 저 그림은 뭐야? 너무 좋다.
          note_ko: me encanta는 me gusta보다 센 '정말 좋아'예요.
      - who: A
        textbook:
          es: Es de mi abuela. Ella pintaba mucho.
          ko: 우리 할머니 그림이야. 할머니가 그림을 많이 그리셨거든.
        native:
          es: Lo pintó mi abuela. Tenía muy buena mano.
          ko: 우리 할머니가 그리셨어. 솜씨가 정말 좋으셨거든.
          note_ko: tener buena mano는 '손재주가 좋다'라는 관용 표현이에요.
      - who: B
        textbook:
          es: Es muy bonito. ¡Qué colores!
          ko: 정말 예쁘다. 색이 참 좋아!
        native:
          es: Es una pasada, de verdad.
          ko: 진짜 끝내준다.
          note_ko: es una pasada는 '끝내준다, 대단하다'라는 뜻의 구어예요.
  - id: d2
    title_es: No encuentro el mando
    title_ko: 숙소에서 리모컨을 못 찾을 때
    setting_ko: 세비야의 단기 숙소. 집주인에게 전화해요.
    roles:
      A: {es: Anfitrión, ko: 집주인}
      B: {es: Huésped, ko: 손님}
    lines:
      - who: B
        textbook:
          es: Buenas tardes. Le llamo desde el apartamento.
          ko: 안녕하세요. 숙소에서 전화드려요.
        native:
          es: Hola, ¿qué tal? Te llamo desde el piso.
          ko: 안녕하세요, 잘 지내세요? 숙소에서 전화했어요.
          note_ko: 스페인에서는 집주인에게도 tú로 말하는 일이 많아요. piso는 아파트예요.
      - who: A
        textbook:
          es: Hola. ¿Hay algún problema?
          ko: 안녕하세요. 무슨 문제 있으세요?
        native:
          es: ¡Hola! Dime, ¿todo bien?
          ko: 안녕하세요! 네, 다 괜찮아요?
          note_ko: dime는 전화를 받고 '네, 말씀하세요' 하는 느낌으로 써요.
      - who: B
        textbook:
          es: No encuentro el mando de la televisión.
          ko: 텔레비전 리모컨을 못 찾겠어요.
        native:
          es: Más o menos. Es que no encuentro el mando de la tele.
          ko: 그럭저럭요. 그게, 텔레비전 리모컨을 못 찾겠어요.
          note_ko: tele는 televisión을 줄인 말이에요. es que…는 사정을 말할 때 앞에 붙여요.
      - who: A
        textbook:
          es: El mando está en el cajón de la mesa.
          ko: 리모컨은 탁자 서랍에 있어요.
        native:
          es: Ah, mira en el cajón de la mesita, al lado del sofá.
          ko: 아, 소파 옆 작은 탁자 서랍을 봐 보세요.
          note_ko: mesita는 mesa에 '작은'의 뜻을 붙인 말이에요. 소파 옆 협탁을 흔히 이렇게 불러요.
      - who: B
        textbook:
          es: Sí, aquí está. Gracias. Y la lámpara del salón no funciona.
          ko: 네, 여기 있네요. 고마워요. 그리고 거실 램프가 안 켜져요.
        native:
          es: "¡Sí, aquí está! Y otra cosa: la lámpara del salón no se enciende."
          ko: 네, 있네요! 그리고 하나 더요. 거실 램프가 안 켜져요.
          note_ko: 불이 켜지는 건 encenderse라서 no se enciende라고 해요.
      - who: A
        textbook:
          es: La lámpara funciona con el interruptor de la pared, al lado de la puerta.
          ko: 그 램프는 문 옆 벽에 있는 스위치로 켜요.
        native:
          es: Ya, es que va con el interruptor de la pared, junto a la puerta.
          ko: 아, 그건 문 옆 벽 스위치로 켜요.
          note_ko: ya는 '아, 그거요' 하고 알아듣는 맞장구예요. junto a는 '…옆에'예요.
      - who: B
        textbook:
          es: ¡Ahora funciona! Muchas gracias.
          ko: 이제 켜졌어요! 정말 고마워요.
        native:
          es: ¡Anda, ahora sí! Mil gracias.
          ko: 어, 이제 되네요! 정말 고마워요.
          note_ko: anda는 놀랐을 때도 써요. mil gracias는 '정말 고마워요'예요.
      - who: A
        textbook:
          es: De nada. Disfrute de Sevilla.
          ko: 천만에요. 세비야에서 좋은 시간 보내세요.
        native:
          es: ¡Nada! Disfruta mucho de Sevilla.
          ko: 별말씀을요! 세비야 재밌게 다니세요.
          note_ko: 전화를 끊을 때 disfruta(즐겨요)로 인사를 대신하기도 해요.
readings:
  - id: r1
    title_es: Un salón en Sevilla
    title_ko: 세비야의 거실
    level: A1
    paragraphs:
      - es: Hoy es 23 de mayo y estoy en Sevilla, en un piso pequeño del centro. El salón tiene un sofá azul, un sillón y una mesa baja. En la pared hay un cuadro de flores y un reloj antiguo.
        ko: 오늘은 5월 23일이고, 저는 세비야 시내의 작은 아파트에 있어요. 거실에는 파란 소파와 안락의자, 낮은 탁자가 있어요. 벽에는 꽃 그림과 오래된 시계가 걸려 있어요.
      - es: Hace calor, pero el salón está fresco. Las ventanas son altas y tienen cortinas blancas. En el suelo hay una alfombra y, al lado de la puerta, una planta grande.
        ko: 날은 덥지만 거실은 시원해요. 창문이 높고 하얀 커튼이 달려 있어요. 바닥에는 양탄자가 깔려 있고, 문 옆에는 큰 화분이 있어요.
      - es: Por la noche leo un libro en el sillón. No veo la televisión. Hoy he andado mucho por la ciudad.
        ko: 밤에는 안락의자에 앉아 책을 읽어요. 텔레비전은 안 봐요. 오늘 시내를 많이 걸었거든요.
    questions:
      - q_ko: 거실 소파는 무슨 색이에요?
        choices_ko: [파란색, 빨간색, 흰색]
        answer: 0
      - q_ko: 밤에 글쓴이는 무엇을 해요?
        choices_ko: [텔레비전을 봐요, 책을 읽어요, 산책해요]
        answer: 1
  - id: r2
    title_es: Un palacio y un piso
    title_ko: 궁전과 아파트
    level: A2
    paragraphs:
      - es: Por la mañana visito la Casa de Pilatos, un palacio antiguo de Sevilla. Tiene un patio grande con una fuente en el centro. Las paredes están cubiertas de azulejos de muchos colores.
        ko: 오전에 세비야의 오래된 궁전, 필라토스의 집에 가요. 넓은 안뜰 한가운데에 분수가 있어요. 벽은 색색의 아술레호 타일로 덮여 있어요.
      - es: Los salones del palacio no son como un salón de hoy. No hay sofá ni televisión. Hay cuadros antiguos y techos de madera.
        ko: 궁전의 방들은 요즘 거실과 달라요. 소파도 텔레비전도 없어요. 오래된 그림과 나무 천장이 있어요.
      - es: Por la tarde vuelvo al piso y miro mi salón. Un sofá, una televisión, un mando… ¡Qué diferente! El palacio es precioso, pero para descansar prefiero mi sofá.
        ko: 오후에 숙소로 돌아와 거실을 둘러봐요. 소파, 텔레비전, 리모컨… 정말 다르죠! 궁전은 아름답지만, 쉴 때는 제 소파가 더 좋아요.
    questions:
      - q_ko: 필라토스의 집 안뜰 한가운데에는 무엇이 있나요?
        choices_ko: [분수, 소파, 텔레비전]
        answer: 0
      - q_ko: 궁전 벽은 무엇으로 덮여 있나요?
        choices_ko: [커튼, 색색의 타일, 책장]
        answer: 1
      - q_ko: 쉴 때 글쓴이는 무엇이 더 좋다고 했나요?
        choices_ko: [궁전 의자, 나무 천장, 자기 소파]
        answer: 2
