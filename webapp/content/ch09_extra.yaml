schema_version: 1
chapter: 9
dialogues:
  - id: d1
    title_es: Desayunar en una terraza
    title_ko: 테라스에서 아침 먹기
    setting_ko: 살라망카 마요르 광장의 카페. 테라스에 앉기 전에 카운터에서 주문해요.
    roles:
      A: {es: Camarero, ko: 종업원}
      B: {es: Cliente, ko: 손님}
    lines:
      - who: A
        textbook:
          es: Buenos días. ¿Qué desea tomar?
          ko: 안녕하세요. 뭐 드시겠어요?
        native:
          es: ¡Buenos días! ¿Qué va a ser?
          ko: 안녕하세요! 뭘로 하시겠어요?
          note_ko: ¿qué va a ser?는 ‘뭘로 하시겠어요?’라는 말로, 바와 카페에서 자주 들어요.
      - who: B
        textbook:
          es: Un café con leche y una tostada, por favor.
          ko: 밀크커피 한 잔이랑 토스트 하나 주세요.
        native:
          es: Ponme un café con leche y una tostada.
          ko: 밀크커피 한 잔이랑 토스트 하나요.
          note_ko: 카페에서는 ponme(나한테 줘요)로 주문을 시작하는 일이 많아요.
      - who: A
        textbook:
          es: ¿Quiere la tostada con tomate o con mantequilla?
          ko: 토스트는 토마토로 드릴까요, 버터로 드릴까요?
        native:
          es: ¿Y la tostada? ¿Con tomate, con mantequilla…?
          ko: 토스트는요? 토마토요, 버터요?
          note_ko: 스페인 아침에는 토마토와 올리브유를 올린 토스트가 흔해요.
      - who: B
        textbook:
          es: Con tomate y aceite de oliva, por favor. ¿Tiene zumo de naranja?
          ko: 토마토랑 올리브유로 주세요. 오렌지 주스 있어요?
        native:
          es: Con tomate y aceite. Ah, ¿y tenéis zumo de naranja natural?
          ko: 토마토랑 올리브유요. 아, 생오렌지 주스도 있어요?
          note_ko: tenéis는 가게 사람들 전체에게 묻는 말이에요. natural이면 바로 짠 주스예요.
      - who: A
        textbook:
          es: Sí, es natural. ¿Lo quiere grande o pequeño?
          ko: 네, 직접 짠 거예요. 큰 걸로 드릴까요, 작은 걸로 드릴까요?
        native:
          es: Sí, te lo exprimo ahora. ¿Grande o pequeño?
          ko: 네, 지금 짜 드릴게요. 큰 거요, 작은 거요?
          note_ko: exprimir는 ‘짜다’예요. lo는 앞에서 말한 zumo를 받아요.
      - who: B
        textbook:
          es: Pequeño, por favor. ¿Puedo sentarme en la terraza?
          ko: 작은 걸로 주세요. 테라스에 앉아도 돼요?
        native:
          es: Pequeño. Me siento fuera, en la terraza, ¿vale?
          ko: 작은 거요. 밖에 테라스에 앉을게요, 괜찮죠?
          note_ko: 허락을 묻는 대신 ‘앉을게요’ 하고 ¿vale?를 붙여 동의를 구해요.
      - who: A
        textbook:
          es: Sí, claro. Le llevo el café a la mesa.
          ko: 네, 그럼요. 커피는 자리로 갖다드릴게요.
        native:
          es: Sí, sí, siéntate donde quieras. Ahora te lo llevo.
          ko: 네, 편한 데 앉으세요. 금방 갖다드릴게요.
          note_ko: 여기서 ahora는 ‘지금’보다 ‘금방, 곧’에 가까워요. te lo는 ‘너에게 그것을’이에요.
      - who: B
        textbook:
          es: Perdone, ¿me trae más azúcar y otra cucharilla, por favor?
          ko: 저기요, 설탕 좀 더 주시고 찻숟가락도 하나 더 갖다주시겠어요?
        native:
          es: Perdona, ¿me traes otro sobre de azúcar? Y una cucharilla, que se me ha caído.
          ko: 저기요, 설탕 한 봉지 더 주실래요? 찻숟가락도요. 떨어뜨렸거든요.
          note_ko: sobre는 ‘봉지’예요. se me ha caído는 ‘(실수로) 떨어뜨렸어요’라는 말이에요.
      - who: A
        textbook:
          es: Claro. Aquí tiene.
          ko: 물론이죠. 여기 있어요.
        native:
          es: Aquí tienes. ¿Te traigo algo más?
          ko: 여기요. 더 갖다드릴 거 있어요?
          note_ko: 물건을 건넬 때 tú에게는 aquí tienes, usted에게는 aquí tiene라고 해요.
      - who: B
        textbook:
          es: No, gracias. Todo está muy bueno.
          ko: 아니요, 괜찮아요. 전부 정말 맛있어요.
        native:
          es: No, nada más, gracias. ¡Qué rica la tostada!
          ko: 아니요, 그거면 돼요, 고마워요. 토스트 진짜 맛있네요!
          note_ko: rico는 음식이 ‘맛있다’라는 뜻으로 스페인에서 아주 흔히 써요.
  - id: d2
    title_es: En la panadería
    title_ko: 빵집에서
    setting_ko: 살라망카 골목의 작은 빵집. 빵과 간식을 사려고 해요.
    roles:
      A: {es: Panadera, ko: 빵집 주인}
      B: {es: Cliente, ko: 손님}
    lines:
      - who: A
        textbook:
          es: Buenas tardes. ¿Qué quiere?
          ko: 안녕하세요. 뭘 드릴까요?
        native:
          es: Hola, buenas. Dime.
          ko: 안녕하세요. 말씀하세요.
          note_ko: dime(나한테 말해)는 가게에서 ‘뭘 드릴까요?’ 대신 흔히 써요.
      - who: B
        textbook:
          es: Buenas tardes. Una barra de pan, por favor.
          ko: 안녕하세요. 바게트 하나 주세요.
        native:
          es: Buenas. ¿Me pone una barra, por favor?
          ko: 안녕하세요. 바게트 하나 주시겠어요?
          note_ko: 빵집에서는 de pan을 빼고 una barra라고만 해도 통해요. ¿me pone…?는 usted에게 하는 주문이에요.
      - who: A
        textbook:
          es: Aquí tiene. ¿Algo más?
          ko: 여기 있어요. 더 필요한 거 있으세요?
        native:
          es: Toma. ¿Qué más?
          ko: 여기요. 또 뭐 드릴까요?
          note_ko: ¿qué más?는 ‘또 뭐 드릴까요?’예요. 가게에서 거의 매번 들어요.
      - who: B
        textbook:
          es: ¿Qué es esa tarta?
          ko: 저 케이크는 뭐예요?
        native:
          es: Pues… ¿y esa tarta de ahí, qué es?
          ko: 음… 저기 저 케이크는 뭐예요?
          note_ko: 궁금한 물건을 먼저 말하고 qué es를 뒤에 붙였어요. 말할 때 흔한 순서예요.
      - who: A
        textbook:
          es: Es una tarta de almendra. La hacemos aquí.
          ko: 아몬드 케이크예요. 저희가 여기서 만들어요.
        native:
          es: De almendra. Está buenísima, ¿eh? La hacemos nosotros.
          ko: 아몬드 케이크예요. 진짜 맛있어요. 저희가 직접 만들어요.
          note_ko: -ísima를 붙이면 ‘아주’라는 뜻이 더해져요. buenísima는 ‘정말 맛있는’이에요.
      - who: B
        textbook:
          es: Entonces, quiero un trozo, por favor.
          ko: 그럼 한 조각 주세요.
        native:
          es: Pues póngame un trozo, que tiene muy buena pinta.
          ko: 그럼 한 조각 주세요. 정말 맛있어 보여요.
          note_ko: tener buena pinta는 ‘맛있어 보이다, 좋아 보이다’라는 말이에요.
      - who: A
        textbook:
          es: Muy bien. Las magdalenas también son de hoy.
          ko: 알겠어요. 마들렌도 오늘 만든 거예요.
        native:
          es: Vale. Y las magdalenas están recién hechas, ¿eh?
          ko: 네. 그리고 마들렌은 방금 구운 거예요.
          note_ko: recién hecho는 ‘갓 만든’이에요. 손님에게 슬쩍 권할 때 써요.
      - who: B
        textbook:
          es: Entonces, cuatro magdalenas también. ¿Cuánto es?
          ko: 그럼 마들렌도 네 개 주세요. 얼마예요?
        native:
          es: Venga, cuatro magdalenas. ¿Qué le debo?
          ko: 좋아요, 마들렌 네 개요. 얼마 드리면 돼요?
          note_ko: ¿qué le debo?는 ‘얼마 드리면 돼요?’예요. 계산할 때 자주 써요.
      - who: A
        textbook:
          es: Son seis euros con veinte.
          ko: 6유로 20센트예요.
        native:
          es: Seis veinte. ¿Te lo pongo todo en una bolsa?
          ko: 6유로 20이요. 전부 봉투 하나에 넣어 드릴까요?
          note_ko: 값은 숫자만 짧게 말하기도 해요. 여기서 lo는 산 물건 전부를 받아요.
      - who: B
        textbook:
          es: Sí, por favor. Aquí tiene. Muchas gracias.
          ko: 네, 그렇게 해 주세요. 여기 있어요. 고맙습니다.
        native:
          es: Sí, gracias. Tenga. ¡Hasta luego!
          ko: 네, 고마워요. 여기요. 안녕히 계세요!
          note_ko: usted에게 돈을 건넬 때는 tenga라고 해요. hasta luego는 헤어질 때 두루 써요.
readings:
  - id: r1
    title_es: Desayuno en la Plaza Mayor
    title_ko: 마요르 광장에서 아침을
    level: A1
    paragraphs:
      - es: Hoy es 16 de mayo y estoy en Salamanca. Por la mañana voy a la Plaza Mayor. Es grande y muy bonita. Hay muchas terrazas con mesas al sol.
        ko: 오늘은 5월 16일, 저는 살라망카에 있어요. 아침에 마요르 광장에 가요. 넓고 정말 예뻐요. 햇살 아래 탁자를 내놓은 테라스가 많아요.
      - es: Me siento en una terraza y pido un café con leche y una tostada con tomate. El café llega en una taza grande. Le pongo un poco de azúcar y lo remuevo con la cucharilla.
        ko: 테라스에 앉아 밀크커피와 토마토 토스트를 시켜요. 커피는 큰 잔에 나와요. 설탕을 조금 넣고 찻숟가락으로 저어요.
      - es: En la mesa de al lado, una familia come churros con chocolate. ¡Qué buena pinta! Mañana los pruebo yo también. Al final pido la cuenta. Son tres euros con ochenta.
        ko: 옆 탁자에서는 한 가족이 추로스를 초콜릿에 찍어 먹어요. 정말 맛있어 보여요! 내일은 저도 먹어 볼래요. 마지막으로 계산서를 달라고 해요. 3유로 80센트예요.
    questions:
      - q_ko: 글쓴이는 무엇을 시켰나요?
        choices_ko: [추로스와 초콜릿, 밀크커피와 토마토 토스트, 오렌지 주스와 크루아상]
        answer: 1
      - q_ko: 커피에 무엇을 넣었나요?
        choices_ko: [아무것도 안 넣었다, 설탕 조금, 우유 조금]
        answer: 1
      - q_ko: 모두 얼마였나요?
        choices_ko: [4유로, 3유로 80센트, 2유로 50센트]
        answer: 1
  - id: r2
    title_es: ¿Solo, cortado o con leche?
    title_ko: 솔로, 코르타도, 콘 레체는 어떻게 달라요?
    level: A2
    paragraphs:
      - es: En España, si pides «un café», normalmente te ponen un café solo. Es un café pequeño y fuerte, sin leche.
        ko: 스페인에서 «un café»를 시키면 보통 카페 솔로가 나와요. 우유를 넣지 않은 작고 진한 커피예요.
      - es: El cortado es un café solo con un poco de leche. El café con leche lleva más leche y se sirve en una taza más grande. Mucha gente lo toma por la mañana, con una tostada o un cruasán.
        ko: 코르타도는 카페 솔로에 우유를 조금 넣은 커피예요. 카페 콘 레체는 우유가 더 많이 들어가고 더 큰 잔에 나와요. 많은 사람이 아침에 토스트나 크루아상과 함께 마셔요.
      - es: Los churros se toman con chocolate caliente. Este chocolate es muy espeso. Se puede beber, pero sobre todo es para mojar los churros. Para la merienda, también hay magdalenas, tartas y bocadillos en muchas cafeterías.
        ko: 추로스는 따뜻한 초콜릿과 함께 먹어요. 이 초콜릿은 아주 걸쭉해요. 마실 수도 있지만 주로 추로스를 찍어 먹어요. 많은 카페에는 오후 간식으로 먹을 마들렌, 케이크, 보카디요도 있어요.
    questions:
      - q_ko: 우유를 넣지 않은 작고 진한 커피는 무엇인가요?
        choices_ko: [café solo, cortado, café con leche]
        answer: 0
      - q_ko: 스페인식 따뜻한 초콜릿은 주로 어떻게 먹나요?
        choices_ko: [차갑게 식혀 마신다, 추로스를 찍어 먹는다, 케이크에 바른다]
        answer: 1
