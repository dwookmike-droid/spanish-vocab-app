schema_version: 1
chapter: 23
dialogues:
  - id: d1
    title_es: Probarse una chaqueta
    title_ko: 재킷 입어 보기
    setting_ko: 바르셀로나 그라시아 거리의 옷 가게. 쇼윈도에서 본 재킷을 입어 보려고 해요.
    roles:
      A: {es: Dependiente, ko: 점원}
      B: {es: Cliente, ko: 손님}
    lines:
      - who: A
        textbook:
          es: Hola, buenas tardes. ¿Le puedo ayudar?
          ko: 안녕하세요. 도와드릴까요?
        native:
          es: ¡Hola! ¿Te ayudo con algo o solo estás mirando?
          ko: 안녕하세요! 도와드릴까요, 아니면 그냥 구경하세요?
          note_ko: 옷 가게 점원은 처음 보는 손님에게도 tú로 말하는 일이 많아요.
      - who: B
        textbook:
          es: Sí. Quiero probarme esta chaqueta.
          ko: 네. 이 재킷을 입어 보고 싶어요.
        native:
          es: Sí, ¿me puedo probar esta chaqueta?
          ko: 네, 이 재킷 입어 봐도 돼요?
          note_ko: probarse는 ‘입어 보다’예요. me는 앞에 둬도, probarme처럼 붙여도 돼요.
      - who: A
        textbook:
          es: Claro. ¿Qué talla tiene?
          ko: 그럼요. 사이즈가 어떻게 되세요?
        native:
          es: Claro. ¿Qué talla gastas? ¿Una M?
          ko: 그럼요. 사이즈 뭐 입으세요? M이요?
          note_ko: gastar는 원래 ‘쓰다’인데, 스페인에서는 사이즈를 물을 때도 써요.
      - who: B
        textbook:
          es: Una M. ¿Dónde está el probador?
          ko: M이요. 탈의실은 어디 있어요?
        native:
          es: Una M, creo. ¿Y los probadores?
          ko: 아마 M일 거예요. 탈의실은요?
          note_ko: 묻고 싶은 것만 말끝을 올려 짧게 물어요.
      - who: A
        textbook:
          es: Está al fondo, a la derecha.
          ko: 안쪽 끝, 오른쪽에 있어요.
        native:
          es: Al fondo a la derecha. Cualquier cosa, me dices.
          ko: 안쪽 끝 오른쪽이에요. 필요한 거 있으면 말씀하세요.
          note_ko: cualquier cosa, me dices는 ‘필요하면 불러요’라는 인사말이에요.
      - who: B
        textbook:
          es: Me queda pequeña. ¿La tiene en una talla más grande?
          ko: 저한테 작아요. 더 큰 사이즈 있어요?
        native:
          es: Oye, me queda un poco justa. ¿La tienes en una L?
          ko: 저기요, 좀 끼네요. L 사이즈 있어요?
          note_ko: me queda는 ‘나한테 (어떻게) 맞다’예요. justo는 옷이 ‘꼭 끼다’라는 뜻이에요.
      - who: A
        textbook:
          es: Sí, aquí tiene una L. También la tenemos en azul.
          ko: 네, L 여기 있어요. 파란색도 있어요.
        native:
          es: Sí, toma. Y mira, también la tengo en azul, por si acaso.
          ko: 네, 여기요. 그리고 혹시 몰라서요, 파란색도 있어요.
          note_ko: por si acaso는 ‘혹시 모르니까’예요.
      - who: B
        textbook:
          es: Esta talla me queda bien. Me la llevo en negro.
          ko: 이 사이즈는 잘 맞아요. 검은색으로 살게요.
        native:
          es: Esta sí. Me la llevo, pero en negro.
          ko: 이건 맞네요. 이걸로 할게요. 근데 검은색으로요.
          note_ko: me la llevo는 ‘(그걸) 살게요’예요. la는 la chaqueta를 가리켜요.
      - who: A
        textbook:
          es: Perfecto. Puede pagar en la caja.
          ko: 좋아요. 계산대에서 계산하시면 돼요.
        native:
          es: Genial. Pues te la llevo a la caja.
          ko: 좋아요. 그럼 계산대로 갖다드릴게요.
          note_ko: te la llevo는 ‘그걸 갖다줄게’예요. 대명사 두 개가 동사 앞에 와요.
  - id: d2
    title_es: ¿Qué me pongo mañana?
    title_ko: 내일 뭐 입지?
    setting_ko: 바르셀로나의 숙소. 내일 도노스티아로 떠나기 전에 친구와 짐을 싸요.
    roles:
      A: {es: Amiga, ko: 친구}
      B: {es: Turista, ko: 여행자}
    lines:
      - who: B
        textbook:
          es: Mañana vamos a Donostia. ¿Qué ropa me pongo?
          ko: 내일 도노스티아에 가잖아. 무슨 옷을 입을까?
        native:
          es: Oye, mañana a Donostia, ¿no? ¿Qué me pongo?
          ko: 있잖아, 내일 도노스티아 가지? 뭐 입지?
          note_ko: ¿qué me pongo?는 ‘뭐 입지?’예요. ropa는 빼도 뜻이 통해요.
      - who: A
        textbook:
          es: Allí llueve bastante. Ponte las botas.
          ko: 거기는 비가 꽤 와. 부츠 신어.
        native:
          es: Allí llueve un montón. Yo me pondría las botas, ¿eh?
          ko: 거긴 비가 엄청 와. 나라면 부츠 신겠어.
          note_ko: me pondría는 ‘나라면 ~하겠어’예요. 조언할 때 부드럽게 들려요.
      - who: B
        textbook:
          es: ¿Las botas? Pero estamos en mayo.
          ko: 부츠? 그래도 5월인데.
        native:
          es: ¿Las botas? ¡Pero si estamos en mayo!
          ko: 부츠? 아니, 지금 5월이잖아!
          note_ko: pero si…는 ‘아니, ~잖아’ 하고 놀라거나 반박할 때 써요.
      - who: A
        textbook:
          es: Sí, pero en el norte hace fresco. Lleva también una chaqueta.
          ko: 응, 그래도 북쪽은 쌀쌀해. 재킷도 챙겨.
        native:
          es: Ya, pero en el norte refresca. Mete una chaqueta en la maleta, por si acaso.
          ko: 알아, 근데 북쪽은 쌀쌀해. 혹시 모르니까 재킷 하나 가방에 넣어.
          note_ko: 여기서 ya는 ‘그건 알아’라는 맞장구예요. refrescar는 ‘쌀쌀해지다’예요.
      - who: B
        textbook:
          es: Vale. ¿Y los zapatos? Solo tengo estos.
          ko: 알았어. 신발은? 이것밖에 없는데.
        native:
          es: Vale, vale. ¿Y de zapatos? Solo tengo estos.
          ko: 알았어, 알았어. 신발은? 이것밖에 없어.
          note_ko: vale를 두 번 말하면 ‘알았어, 알았다고’처럼 들려요.
      - who: A
        textbook:
          es: Esos zapatos son bonitos, pero no son para la lluvia.
          ko: 그 신발 예쁘긴 한데 비 올 때 신을 건 아니야.
        native:
          es: Esos son monísimos, pero con lluvia, fatal.
          ko: 그거 진짜 예쁜데 비 오면 최악이야.
          note_ko: monísimo는 mono(귀여운)를 강조한 말이에요. fatal은 ‘엉망, 최악’이에요.
      - who: B
        textbook:
          es: Entonces voy a comprar unas botas esta tarde.
          ko: 그럼 오늘 오후에 부츠를 사러 갈게.
        native:
          es: Pues nada, esta tarde me compro unas botas.
          ko: 그럼 뭐, 오늘 오후에 부츠 하나 사야겠다.
          note_ko: pues nada는 ‘그럼 뭐 어쩔 수 없지’ 하고 마음을 정할 때 써요.
      - who: A
        textbook:
          es: Buena idea. En el Passeig de Gràcia hay muchas tiendas.
          ko: 좋은 생각이야. 그라시아 거리에 가게가 많아.
        native:
          es: ¡Eso! Te acompaño, que yo también quiero mirar bolsos.
          ko: 그거야! 같이 가 줄게. 나도 핸드백 구경하고 싶거든.
          note_ko: ¡eso!는 ‘바로 그거야’라는 맞장구예요. 여기서 que는 이유를 덧붙여요.
      - who: B
        textbook:
          es: Perfecto. Vamos después de comer.
          ko: 좋아. 점심 먹고 가자.
        native:
          es: Hecho. Después de comer, ¿vale?
          ko: 좋아. 점심 먹고 가자, 응?
          note_ko: hecho는 ‘좋아, 그렇게 하자’라는 짧은 대답이에요.
readings:
  - id: r1
    title_es: Escaparates de Gràcia
    title_ko: 그라시아 거리의 쇼윈도
    level: A1
    paragraphs:
      - es: Hoy es 9 de mayo y estoy en Barcelona. Paseo por el Passeig de Gràcia y miro los escaparates.
        ko: 오늘은 5월 9일, 저는 바르셀로나에 있어요. 그라시아 거리를 걸으며 쇼윈도를 구경해요.
      - es: En un escaparate hay un vestido rojo, una falda, camisetas de rayas y un abrigo largo. En otro hay zapatos, botas y bolsos. Todo es muy bonito, pero también caro.
        ko: 한 쇼윈도에는 빨간 원피스, 치마, 줄무늬 티셔츠, 긴 외투가 있어요. 다른 쇼윈도에는 신발, 부츠, 핸드백이 있어요. 다 예쁘지만 비싸기도 해요.
      - es: Al final entro en una tienda pequeña y me compro una gorra y unos calcetines. Mañana voy a Donostia y allí llueve mucho. ¡Necesito unas botas!
        ko: 결국 작은 가게에 들어가 야구 모자와 양말을 사요. 내일은 도노스티아에 가는데 거기는 비가 많이 와요. 부츠가 필요해요!
    questions:
      - q_ko: 글쓴이는 어디를 걸었나요?
        choices_ko: [그라시아 거리, 해변, 시장]
        answer: 0
      - q_ko: 글쓴이는 작은 가게에서 무엇을 샀나요?
        choices_ko: [원피스와 치마, 야구 모자와 양말, 부츠와 핸드백]
        answer: 1
      - q_ko: 글쓴이는 왜 부츠가 필요한가요?
        choices_ko: [부츠가 싸서, 선물하려고, 내일 갈 도노스티아에 비가 많이 와서]
        answer: 2
  - id: r2
    title_es: Un botón perdido
    title_ko: 잃어버린 단추
    level: A2
    paragraphs:
      - es: Esta mañana, al ponerme la camisa, se me ha caído un botón. Lo busco por toda la habitación, pero no lo encuentro.
        ko: 오늘 아침 셔츠를 입다가 단추가 하나 떨어졌어요. 방 안을 다 찾아보지만 보이지 않아요.
      - es: En la recepción del hotel me dan una aguja, hilo y un botón parecido. No sé coser muy bien, pero en diez minutos el botón está otra vez en su sitio.
        ko: 호텔 프런트에서 바늘과 실, 비슷한 단추 하나를 줘요. 바느질은 잘 못하지만 10분 만에 단추가 다시 제자리에 붙어요.
      - es: Por la tarde me pongo la camisa con el pantalón negro y la chaqueta, y salgo a cenar. Nadie ve el botón nuevo, pero yo sí.
        ko: 저녁에는 그 셔츠에 검은 바지와 재킷을 입고 저녁을 먹으러 나가요. 새 단추를 알아보는 사람은 없지만 저는 알아요.
    questions:
      - q_ko: 아침에 무슨 일이 있었나요?
        choices_ko: [셔츠 단추가 떨어졌다, 재킷을 잃어버렸다, 바지가 찢어졌다]
        answer: 0
      - q_ko: 호텔 프런트에서 무엇을 줬나요?
        choices_ko: [새 셔츠, 바늘과 실과 단추, 지도]
        answer: 1
      - q_ko: 단추를 다는 데 시간이 얼마나 걸렸나요?
        choices_ko: [한 시간, 30분, 10분]
        answer: 2
glossary:
