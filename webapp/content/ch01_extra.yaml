schema_version: 1
chapter: 1
dialogues:
  - id: d1
    title_es: En el hotel, el secador no funciona
    title_ko: 호텔 헤어드라이어가 안 될 때
    setting_ko: 그라나다의 작은 호텔. 머리를 말리려는데 드라이어가 안 돼요.
    roles:
      A: {es: Recepcionista, ko: 프런트 직원}
      B: {es: Huésped, ko: 손님}
    lines:
      - who: B
        textbook:
          es: Buenos días. Tengo un problema en el baño.
          ko: 안녕하세요. 욕실에 문제가 있어요.
        native:
          es: Hola, buenas. Oye, tengo un problemilla en el baño.
          ko: 안녕하세요. 저기, 욕실에 작은 문제가 하나 있어서요.
          note_ko: buenas는 인사를 줄인 말이에요. -illa를 붙이면 '별일 아닌 문제'처럼 부드러워져요.
      - who: A
        textbook:
          es: ¿Qué problema tiene?
          ko: 무슨 문제가 있으세요?
        native:
          es: Sí, dime, ¿qué pasa?
          ko: 네, 말씀하세요. 무슨 일이에요?
          note_ko: dime는 '말해 봐'지만 '네, 말씀하세요' 정도로 써요. 손님에게도 tú를 자주 써요.
      - who: B
        textbook:
          es: El secador de pelo no funciona.
          ko: 헤어드라이어가 작동하지 않아요.
        native:
          es: Pues que el secador no va.
          ko: 그게, 드라이어가 안 돼요.
          note_ko: 말할 때는 funcionar 대신 ir(va)를 많이 써요. de pelo도 흔히 빼요.
      - who: A
        textbook:
          es: ¿Está enchufado?
          ko: 플러그는 꽂혀 있나요?
        native:
          es: ¿Lo has enchufado bien? A veces se suelta.
          ko: 플러그 제대로 꽂으셨어요? 가끔 빠지거든요.
          note_ko: 스페인에서는 방금 한 일을 현재완료(has enchufado)로 자주 말해요.
      - who: B
        textbook:
          es: Sí, está enchufado. Y no hay papel higiénico.
          ko: 네, 꽂혀 있어요. 그리고 화장지가 없어요.
        native:
          es: Sí, sí, está enchufado. Ah, y se ha acabado el papel higiénico.
          ko: 네, 꽂혀 있어요. 아, 그리고 화장지도 다 떨어졌어요.
          note_ko: se ha acabado는 '다 떨어졌다'예요. 물건이 바닥났을 때 아주 자주 써요.
      - who: A
        textbook:
          es: Lo siento. Ahora subo otro secador y papel higiénico.
          ko: 죄송합니다. 지금 다른 드라이어랑 화장지를 가지고 올라갈게요.
        native:
          es: Uy, perdona. Ahora mismo te subo otro secador y un par de rollos.
          ko: 어머, 죄송해요. 지금 바로 다른 드라이어랑 휴지 두어 개 올려 드릴게요.
          note_ko: ahora mismo는 '지금 당장', un par de는 '두어 개'예요. 화장지는 rollos(롤)로 세요.
      - who: B
        textbook:
          es: Muchas gracias. Es la habitación 212.
          ko: 정말 고마워요. 212호예요.
        native:
          es: Genial, gracias. Es la 212.
          ko: 좋아요, 고마워요. 212호예요.
          note_ko: 방 번호는 habitación을 빼고 la 212라고만 말해도 돼요.
      - who: A
        textbook:
          es: De nada. Llego en cinco minutos.
          ko: 천만에요. 5분 뒤에 갈게요.
        native:
          es: Nada, nada. En cinco minutos estoy ahí.
          ko: 별말씀을요. 5분 안에 갈게요.
          note_ko: De nada를 줄여 Nada, nada라고 해요. estoy ahí는 '그리로 갈게요'예요.
  - id: d2
    title_es: En la tienda, sin cepillo de dientes
    title_ko: 칫솔을 깜빡했을 때
    setting_ko: 그라나다 시내의 작은 생활용품 가게. 칫솔을 사러 왔어요.
    roles:
      A: {es: Dependienta, ko: 점원}
      B: {es: Cliente, ko: 손님}
    lines:
      - who: A
        textbook:
          es: Buenos días. ¿Qué desea?
          ko: 안녕하세요. 무엇을 찾으세요?
        native:
          es: Hola, ¿buscas algo?
          ko: 안녕하세요, 뭐 찾으세요?
          note_ko: ¿Qué desea?는 격식 있는 말이에요. 가게에서는 tú로 짧게 묻는 일이 많아요.
      - who: B
        textbook:
          es: Necesito un cepillo de dientes y pasta de dientes.
          ko: 칫솔이랑 치약이 필요해요.
        native:
          es: Sí, se me ha olvidado el cepillo de dientes. Y la pasta también.
          ko: 네, 칫솔을 깜빡했어요. 치약도요.
          note_ko: se me ha olvidado는 '깜빡했다'예요. 아주 흔하게 쓰는 표현이에요.
      - who: A
        textbook:
          es: Los cepillos están aquí. La pasta está al lado.
          ko: 칫솔은 여기 있어요. 치약은 옆에 있어요.
        native:
          es: Mira, los cepillos están aquí, y la pasta justo al lado.
          ko: 보세요, 칫솔은 여기 있고 치약은 바로 옆이에요.
          note_ko: mira(봐요)는 물건을 가리킬 때 말머리로 자주 붙여요. justo는 '바로'예요.
      - who: B
        textbook:
          es: ¿Tiene también una maquinilla de afeitar?
          ko: 면도기도 있나요?
        native:
          es: Vale. ¿Y maquinillas de afeitar tenéis?
          ko: 알겠어요. 면도기도 있어요?
          note_ko: tenéis는 '이 가게 사람들'에게 묻는 말이에요. 물건을 앞에 두는 어순도 흔해요.
      - who: A
        textbook:
          es: Sí. Las maquinillas están en el pasillo dos.
          ko: 네. 면도기는 2번 통로에 있어요.
        native:
          es: Sí, en el pasillo dos, abajo del todo.
          ko: 네, 2번 통로 맨 아래 칸에 있어요.
          note_ko: abajo del todo는 '맨 아래'예요. 선반 위치를 말할 때 써요.
      - who: B
        textbook:
          es: Gracias. ¿Cuánto es todo?
          ko: 고마워요. 전부 얼마예요?
        native:
          es: Genial. Pues me llevo esto. ¿Qué te debo?
          ko: 좋아요. 그럼 이거 살게요. 얼마예요?
          note_ko: me llevo esto는 '이걸로 할게요'. ¿Qué te debo?는 계산할 때 흔히 묻는 말이에요.
      - who: A
        textbook:
          es: Son seis euros con cincuenta.
          ko: 6유로 50센트예요.
        native:
          es: Seis cincuenta. ¿Con tarjeta?
          ko: 6유로 50이요. 카드로 하세요?
          note_ko: 값을 말할 때 euros와 céntimos를 빼고 숫자만 말하기도 해요.
      - who: B
        textbook:
          es: Sí, con tarjeta, por favor.
          ko: 네, 카드로 할게요.
        native:
          es: Sí, con tarjeta. ¡Gracias, hasta luego!
          ko: 네, 카드로요. 고마워요, 안녕히 계세요!
          note_ko: 가게를 나올 때 hasta luego를 아주 많이 써요. 다시 볼 일이 없어도 써요.
readings:
  - id: r1
    title_es: Una mañana en Granada
    title_ko: 그라나다의 아침
    level: A1
    paragraphs:
      - es: Hoy es 3 de mayo y estoy en Granada. Mi hotel es pequeño, pero el baño es bonito. Tiene una ducha grande, un lavabo blanco y un espejo redondo.
        ko: 오늘은 5월 3일이고, 저는 그라나다에 있어요. 호텔은 작지만 욕실은 예뻐요. 샤워 공간이 넓고, 하얀 세면대와 둥근 거울이 있어요.
      - es: Me levanto a las ocho. Me ducho con agua caliente y uso el champú del hotel. Después me lavo los dientes y me peino delante del espejo.
        ko: 여덟 시에 일어나요. 따뜻한 물로 샤워하고 호텔 샴푸를 써요. 그다음 이를 닦고 거울 앞에서 머리를 빗어요.
      - es: No hay bañera, pero no importa. Por la tarde voy a la Alhambra. Allí también hay baños, pero son muy antiguos.
        ko: 욕조는 없지만 괜찮아요. 오후에는 알람브라에 가요. 거기에도 목욕탕이 있는데, 아주 오래된 거예요.
    questions:
      - q_ko: 글쓴이의 호텔 욕실에 없는 것은 무엇인가요?
        choices_ko: [욕조, 거울, 세면대]
        answer: 0
      - q_ko: 글쓴이는 몇 시에 일어나요?
        choices_ko: [일곱 시, 여덟 시, 아홉 시]
        answer: 1
      - q_ko: 오후에는 어디에 가요?
        choices_ko: [알람브라, 바닷가, 시장]
        answer: 0
  - id: r2
    title_es: Mi neceser de viaje
    title_ko: 여행용 세면도구 가방
    level: A2
    paragraphs:
      - es: Antes del viaje preparo mi neceser. Llevo un cepillo de dientes, pasta de dientes, un peine y una maquinilla de afeitar. También llevo unas chanclas para la ducha.
        ko: 여행 전에 세면도구 가방을 챙겨요. 칫솔, 치약, 빗, 면도기를 넣어요. 샤워할 때 신을 슬리퍼도 가져가요.
      - es: No llevo champú ni secador de pelo, porque en el hotel de Granada hay. El secador está en un cajón, al lado del lavabo.
        ko: 샴푸랑 헤어드라이어는 안 가져가요. 그라나다 호텔에 있거든요. 드라이어는 세면대 옆 서랍에 있어요.
      - es: Pero hoy tengo un problema. ¡No encuentro mis tijeras pequeñas! Creo que están en casa, en Corea. Mañana voy a comprar unas en una tienda del centro.
        ko: 그런데 오늘 문제가 생겼어요. 작은 가위가 안 보여요! 아마 한국 집에 두고 온 것 같아요. 내일 시내 가게에서 하나 사려고요.
    questions:
      - q_ko: 글쓴이가 샴푸를 가져가지 않은 이유는 무엇인가요?
        choices_ko: [호텔에 있어서, 너무 무거워서, 잊어버려서]
        answer: 0
      - q_ko: 글쓴이가 찾지 못한 물건은 무엇인가요?
        choices_ko: [작은 가위, 빗, 슬리퍼]
        answer: 0
