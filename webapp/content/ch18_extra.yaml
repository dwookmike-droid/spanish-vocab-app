schema_version: 1
chapter: 18
dialogues:
  - id: d1
    title_es: ¿Por dónde se baja al río?
    title_ko: 강으로 내려가는 길 묻기
    setting_ko: 론다 푸엔테 누에보 근처 전망대. 협곡 아래로 내려가는 길을 물어요.
    roles:
      A: {es: Señor, ko: 아저씨}
      B: {es: Turista, ko: 여행자}
    lines:
      - who: B
        textbook:
          es: Perdone, ¿hay un sendero para bajar al río?
          ko: 실례합니다, 강까지 내려가는 오솔길이 있어요?
        native:
          es: Perdone, ¿por dónde se baja al río?
          ko: 실례합니다, 강으로는 어디로 내려가요?
          note_ko: se baja는 ‘(사람들이) 내려간다’예요. 길을 물을 때 흔히 이렇게 말해요.
      - who: A
        textbook:
          es: Sí. El camino empieza allí, al final de esta calle.
          ko: 네. 저기, 이 길 끝에서 시작해요.
        native:
          es: Mira, al final de esta calle sale un camino que baja hasta abajo.
          ko: 봐요, 이 길 끝에서 아래까지 내려가는 길이 나와요.
          note_ko: sale un camino는 ‘길이 하나 나온다, 시작된다’는 말이에요.
      - who: B
        textbook:
          es: ¿Es difícil? ¿Cuánto tiempo se tarda?
          ko: 어려워요? 시간은 얼마나 걸려요?
        native:
          es: ¿Y es muy duro? ¿Cuánto se tarda, más o menos?
          ko: 많이 힘들어요? 대충 얼마나 걸려요?
          note_ko: duro는 ‘힘든’이에요. tardar는 시간이 ‘걸리다’예요.
      - who: A
        textbook:
          es: No es difícil. Se tarda unos veinte minutos. Pero la subida es más dura que la bajada.
          ko: 어렵지 않아요. 20분쯤 걸려요. 그런데 올라오는 길이 내려가는 길보다 힘들어요.
        native:
          es: Qué va, bajar es un paseo. Lo malo es la vuelta, que es cuesta arriba.
          ko: 아니에요, 내려가는 건 산책이죠. 문제는 돌아올 때예요. 오르막이거든요.
          note_ko: lo malo es…는 ‘안 좋은 점은 ~예요’예요. cuesta arriba는 ‘오르막’이에요.
      - who: B
        textbook:
          es: ¿Desde abajo se ve el puente?
          ko: 아래에서 다리가 보여요?
        native:
          es: ¿Y desde abajo se ve bien el puente?
          ko: 아래에서 다리가 잘 보여요?
          note_ko: se ve는 ‘보인다’예요. 주어(el puente)가 뒤에 와도 돼요.
      - who: A
        textbook:
          es: Sí, se ve muy bien. Abajo también hay una cascada pequeña.
          ko: 네, 아주 잘 보여요. 아래에는 작은 폭포도 있어요.
        native:
          es: ¡Uf, mejor que desde aquí! Y con el río y la cascadita, es una postal.
          ko: 와, 여기서 보는 것보다 나아요! 강이랑 작은 폭포까지 있어서 엽서 같아요.
          note_ko: cascadita는 cascada에 -ita를 붙인 말이에요. es una postal은 ‘엽서처럼 예쁘다’는 뜻이에요.
      - who: B
        textbook:
          es: Hace calor. ¿Hay sombra en el camino?
          ko: 더워요. 길에 그늘이 있어요?
        native:
          es: Con este calor… ¿hay algo de sombra?
          ko: 이렇게 더운데… 그늘은 좀 있어요?
          note_ko: con este calor는 ‘이렇게 더운데’예요. 말끝을 흐리며 걱정을 드러내요.
      - who: A
        textbook:
          es: Hay poca sombra. Lleve agua, por favor.
          ko: 그늘이 별로 없어요. 물을 꼭 챙기세요.
        native:
          es: Poca, la verdad. Llévate agua, ¿eh?, que aquí el sol aprieta.
          ko: 사실 별로 없어요. 물 꼭 챙겨 가요. 여기 햇볕이 세거든요.
          note_ko: la verdad는 ‘사실은’이에요. el sol aprieta는 ‘햇볕이 세다’예요.
      - who: B
        textbook:
          es: Muchas gracias por la información.
          ko: 알려 주셔서 정말 고마워요.
        native:
          es: Vale, muchísimas gracias.
          ko: 네, 정말 고맙습니다.
          note_ko: muchísimas는 muchas를 더 세게 말한 거예요.
      - who: A
        textbook:
          es: De nada. ¡Disfrute del paseo!
          ko: 천만에요. 산책 즐겁게 하세요!
        native:
          es: ¡Nada! ¡Que lo disfrutes!
          ko: 별말씀을요! 즐겁게 다녀와요!
          note_ko: que lo disfrutes는 ‘즐겁게 보내요’라는 인사예요.
  - id: d2
    title_es: Por el sendero del Tajo
    title_ko: 타호 협곡 오솔길에서
    setting_ko: 론다 협곡 아래 오솔길. 친구 하비와 강 쪽으로 걸어 내려왔어요.
    roles:
      A: {es: Javi, ko: 하비}
      B: {es: Min, ko: 민}
    lines:
      - who: A
        textbook:
          es: Mira el puente. Desde aquí es muy alto.
          ko: 다리 좀 봐. 여기서 보니까 엄청 높아.
        native:
          es: ¡Hala, mira el puente! Desde aquí abajo impresiona, ¿eh?
          ko: 우와, 저 다리 좀 봐! 여기 밑에서 보니까 대단하다, 그치?
          note_ko: hala는 놀랐을 때 하는 ‘우와’예요. impresionar는 ‘깊은 인상을 주다’예요.
      - who: B
        textbook:
          es: Sí. Y el Tajo es más profundo que en las fotos.
          ko: 응. 그리고 협곡이 사진보다 더 깊어.
        native:
          es: Ya te digo. El Tajo es mucho más profundo que en las fotos.
          ko: 그러니까. 협곡이 사진보다 훨씬 깊어.
          note_ko: ya te digo는 ‘내 말이, 그러니까’처럼 맞장구치는 말이에요.
      - who: A
        textbook:
          es: ¿Ves el río? Pasa debajo del puente.
          ko: 강 보여? 다리 밑으로 흘러.
        native:
          es: Y fíjate en el río, ahí abajo del todo.
          ko: 저 강 좀 봐, 저 맨 밑에.
          note_ko: fíjate는 ‘잘 봐’예요. abajo del todo는 ‘맨 아래’예요.
      - who: B
        textbook:
          es: ¿Qué es eso? ¿Es un pájaro grande?
          ko: 저건 뭐야? 큰 새야?
        native:
          es: Oye, ¿y ese pájaro? ¡Qué grande!
          ko: 야, 저 새 뭐야? 엄청 크다!
          note_ko: ¿y ese…?는 ‘저 ~는 뭐야?’ 하고 가리키며 묻는 말이에요.
      - who: A
        textbook:
          es: Creo que es un águila, pero no estoy seguro.
          ko: 독수리 같은데, 확실하진 않아.
        native:
          es: Igual es un águila, ¿no? No sé mucho de pájaros.
          ko: 독수리일지도? 나 새는 잘 몰라.
          note_ko: igual은 ‘어쩌면’, 끝에 붙인 ¿no?는 ‘그치?’ 하고 확인하는 말이에요.
      - who: B
        textbook:
          es: Hace calor. ¿Descansamos un poco debajo de ese árbol?
          ko: 덥다. 저 나무 밑에서 좀 쉴까?
        native:
          es: Uf, qué calor. ¿Paramos un rato a la sombra de ese olivo?
          ko: 휴, 덥다. 저 올리브나무 그늘에서 잠깐 쉴까?
          note_ko: a la sombra de…는 ‘~의 그늘에서’예요. parar는 ‘멈추다, 쉬다’예요.
      - who: A
        textbook:
          es: Sí. Después subimos al mirador por otro camino.
          ko: 그래. 그다음에 다른 길로 전망대에 올라가자.
        native:
          es: Vale. Y luego subimos por el otro sendero, que es más corto.
          ko: 좋아. 이따 다른 오솔길로 올라가자. 그게 더 짧거든.
          note_ko: 여기서 que는 이유를 덧붙이는 ‘~거든’이에요.
      - who: B
        textbook:
          es: ¿Es más difícil que este camino?
          ko: 이 길보다 더 힘들어?
        native:
          es: ¿Más corto? O sea, más empinado, ¿no?
          ko: 더 짧다고? 그러니까 더 가파르다는 거지?
          note_ko: o sea는 ‘그러니까, 즉’이에요. 말할 때 아주 자주 써요. empinado는 ‘가파른’이에요.
      - who: A
        textbook:
          es: Sí, un poco. Pero arriba la vista es muy bonita.
          ko: 응, 좀. 그래도 위에서 보는 경치가 정말 좋아.
        native:
          es: Un poquito, sí. Pero arriba tienes una vista increíble del valle.
          ko: 응, 쪼끔. 그래도 위에 올라가면 골짜기 경치가 끝내줘.
          note_ko: un poquito는 un poco에 -ito를 붙여 ‘쪼끔’처럼 말한 거예요.
readings:
  - id: r1
    title_es: Ronda y su puente
    title_ko: 론다와 다리
    level: A1
    paragraphs:
      - es: Hoy es 25 de mayo. Llego a Ronda en tren desde Sevilla. La ciudad está sobre una roca muy alta, y en el centro hay un tajo muy profundo. Abajo pasa un río.
        ko: 오늘은 5월 25일이에요. 세비야에서 기차를 타고 론다에 와요. 도시는 아주 높은 바위 위에 있고, 한가운데에는 깊은 협곡이 있어요. 그 아래로 강이 흘러요.
      - es: Sobre el tajo está el Puente Nuevo. Desde el mirador veo el puente, el río, el valle y las montañas. El cielo está azul y hace calor.
        ko: 협곡 위에는 푸엔테 누에보가 놓여 있어요. 전망대에서 다리와 강, 골짜기와 산이 보여요. 하늘은 파랗고 날이 더워요.
      - es: Por la tarde bajo por un sendero. Hay piedras, flores y algunos olivos. Desde abajo, el puente es todavía más impresionante. ¡Y veo un pájaro muy grande! Creo que es un águila.
        ko: 오후에는 오솔길로 내려가요. 돌과 꽃, 올리브나무 몇 그루가 있어요. 아래에서 보면 다리가 훨씬 더 웅장해요. 아주 큰 새도 봐요! 독수리인 것 같아요.
    questions:
      - q_ko: 글쓴이는 무엇을 타고 론다에 왔나요?
        choices_ko: [버스, 기차, 자동차]
        answer: 1
      - q_ko: 글쓴이는 오후에 무엇을 했나요?
        choices_ko: [오솔길로 내려갔다, 동굴에 들어갔다, 호수에서 수영했다]
        answer: 0
  - id: r2
    title_es: Sevilla, Ronda y Cádiz
    title_ko: 세비야, 론다, 카디스
    level: A2
    paragraphs:
      - es: Ayer estaba en Sevilla y mañana voy a Cádiz. Hoy, en Ronda, comparo los tres lugares. Sevilla es más grande que Ronda, pero Ronda es más tranquila.
        ko: 어제는 세비야에 있었고, 내일은 카디스에 가요. 오늘 론다에서 세 곳을 견줘 봐요. 세비야는 론다보다 크지만, 론다가 더 조용해요.
      - es: Aquí no hay mar ni playa, pero hay montañas, colinas con olivos y caminos para andar. El aire es más fresco que en Sevilla, sobre todo por la mañana.
        ko: 여기에는 바다도 해변도 없지만, 산과 올리브나무 언덕, 걷기 좋은 길이 있어요. 공기는 세비야보다 선선해요. 특히 아침에 그래요.
      - es: No hay ningún lago, pero el río tiene una cascada pequeña debajo del puente. Para mí, el mejor sitio es el mirador, porque desde allí se ve todo el valle.
        ko: 호수는 없지만, 다리 밑 강에는 작은 폭포가 있어요. 제가 꼽는 최고의 장소는 전망대예요. 거기서는 골짜기 전체가 내려다보이거든요.
    questions:
      - q_ko: 세비야와 론다를 비교하면 어떤가요?
        choices_ko: [세비야가 더 크다, 론다가 더 크다, 크기가 같다]
        answer: 0
      - q_ko: 론다의 공기는 어떤가요?
        choices_ko: [세비야보다 선선하다, 세비야보다 덥다, 바닷바람이 분다]
        answer: 0
      - q_ko: 글쓴이가 꼽은 최고의 장소는 어디인가요?
        choices_ko: [전망대, 호수, 동굴]
        answer: 0
