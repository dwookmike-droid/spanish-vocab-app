  "altura": {lemma: "altura", ko: "높이", en: "height", pron: "알**뚜**라"}
  "antes": {lemma: "antes", ko: "전에", en: "before", pron: "**안**떼스"}
  "antiguo": {lemma: "antiguo", ko: "오래된", en: "old", pron: "안**띠**구오"}
  "antiguos": {lemma: "antiguo", ko: "오래된(남성 복수)", en: "old, ancient", pron: "안**띠**구오스"}
