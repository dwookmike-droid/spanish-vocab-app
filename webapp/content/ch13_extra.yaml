schema_version: 1
chapter: 13
dialogues:
  - id: d1
    title_es: Llegar al hotel
    title_ko: 호텔 체크인하기
    setting_ko: 살라망카의 오래된 호텔 프런트. 예약한 방에 체크인해요.
    roles:
      A: {es: Recepcionista, ko: 프런트 직원}
      B: {es: Huésped, ko: 손님}
    lines:
      - who: B
        textbook:
          es: Buenas tardes. Tengo una reserva a nombre de Kim.
          ko: 안녕하세요. 김이라는 이름으로 예약했어요.
        native:
          es: Hola, buenas. Tenía una reserva a nombre de Kim.
          ko: 안녕하세요. 김으로 예약했는데요.
          note_ko: tenía(과거형)로 말하면 더 부드럽게 들려요. 체크인할 때 흔히 이렇게 말해요.
      - who: A
        textbook:
          es: Buenas tardes. ¿Me da su pasaporte, por favor?
          ko: 안녕하세요. 여권 좀 주시겠어요?
        native:
          es: Muy buenas. ¿Me deja el pasaporte un momento?
          ko: 안녕하세요. 여권 잠깐만 주시겠어요?
          note_ko: ¿me deja…?는 ‘잠깐 주시겠어요?’라는 말로, 여권을 달라고 할 때 자주 써요.
      - who: B
        textbook:
          es: Sí, aquí tiene.
          ko: 네, 여기 있어요.
        native:
          es: Sí, claro. Tenga.
          ko: 네, 그럼요. 여기요.
          note_ko: tenga는 usted에게 물건을 건네며 하는 ‘여기요, 받으세요’예요.
      - who: A
        textbook:
          es: Gracias. Es una habitación con cama doble para una noche, ¿verdad?
          ko: 고맙습니다. 더블 침대 방으로 하룻밤 맞으시죠?
        native:
          es: Perfecto. Una doble, una noche, ¿no?
          ko: 좋아요. 더블룸, 하룻밤 맞죠?
          note_ko: 호텔에서는 habitación을 빼고 una doble, una individual이라고 해요. ¿no?는 ‘맞죠?’예요.
      - who: B
        textbook:
          es: Sí. ¿A qué hora es el desayuno?
          ko: 네. 아침 식사는 몇 시예요?
        native:
          es: Eso es. ¿Y el desayuno, a qué hora es?
          ko: 네, 맞아요. 아침은 몇 시예요?
          note_ko: 궁금한 것(el desayuno)을 먼저 꺼내고 질문을 뒤에 붙였어요.
      - who: A
        textbook:
          es: De siete y media a diez, en la planta baja.
          ko: 7시 반부터 10시까지, 지상층에서요.
        native:
          es: De siete y media a diez, aquí mismo, al lado de la recepción.
          ko: 7시 반부터 10시까지요. 바로 여기, 프런트 옆이에요.
          note_ko: ‘…부터 …까지’는 de… a…로 말해요. aquí mismo는 ‘바로 여기’예요.
      - who: B
        textbook:
          es: Muy bien. ¿Y cuál es la contraseña del wifi?
          ko: 좋아요. 와이파이 비밀번호는 뭐예요?
        native:
          es: Genial. ¿Y la clave del wifi?
          ko: 좋네요. 와이파이 비밀번호는요?
          note_ko: 비밀번호는 contraseña라고도, 짧게 clave라고도 해요.
      - who: A
        textbook:
          es: Está en esta tarjeta. Aquí tiene la llave. Su habitación es la trece, en la tercera planta.
          ko: 이 카드에 적혀 있어요. 열쇠 여기 있어요. 방은 13호, 3층이에요.
        native:
          es: Viene en esta tarjeta. Y aquí tiene la llave, la trece, tercera planta.
          ko: 이 카드에 나와 있어요. 그리고 열쇠 여기 있어요. 13호, 3층이에요.
          note_ko: 스페인은 지상층 위부터 층을 세요. tercera planta는 한국식으로 4층이에요.
      - who: B
        textbook:
          es: Gracias. ¿Dónde está el ascensor?
          ko: 고맙습니다. 엘리베이터는 어디 있어요?
        native:
          es: Gracias. ¿El ascensor?
          ko: 고마워요. 엘리베이터는요?
          note_ko: 명사만 말끝을 올려 물어도 ‘어디 있어요?’라는 뜻이 돼요.
      - who: A
        textbook:
          es: Al fondo, a la derecha. Si quiere, le subimos la maleta.
          ko: 안쪽 오른쪽에 있어요. 원하시면 가방을 올려 드릴게요.
        native:
          es: Al fondo a la derecha. ¿Le subimos la maleta?
          ko: 안쪽으로 가서 오른쪽이에요. 가방 올려 드릴까요?
          note_ko: le subimos는 ‘(저희가) 올려 드릴까요?’예요. le가 동사 앞에 와요.
  - id: d2
    title_es: Llamar a recepción
    title_ko: 프런트에 전화하기
    setting_ko: 밤에 방에서 프런트로 전화해요. 베개가 모자라고 샤워 물이 차가워요.
    roles:
      A: {es: Recepcionista, ko: 프런트 직원}
      B: {es: Huésped, ko: 손님}
    lines:
      - who: A
        textbook:
          es: Recepción, buenas noches.
          ko: 프런트입니다. 안녕하세요.
        native:
          es: Recepción, dígame.
          ko: 프런트예요. 말씀하세요.
          note_ko: dígame는 전화를 받을 때 ‘말씀하세요’라는 뜻으로 써요.
      - who: B
        textbook:
          es: Buenas noches. Llamo de la habitación trece. Falta una almohada.
          ko: 안녕하세요. 13호인데요. 베개가 하나 모자라요.
        native:
          es: Hola, buenas noches. Le llamo de la trece. Es que en la cama solo hay una almohada.
          ko: 안녕하세요, 13호인데요. 그게, 침대에 베개가 하나밖에 없어서요.
          note_ko: es que는 ‘그게…’ 하고 사정을 꺼낼 때 써요. de la trece는 ‘13호에서’예요.
      - who: A
        textbook:
          es: Perdone. Ahora mismo le subo otra almohada.
          ko: 죄송합니다. 지금 바로 베개 하나 더 올려 드릴게요.
        native:
          es: Uy, perdone. Ahora mismo se la subo.
          ko: 아이고, 죄송해요. 지금 바로 올려 드릴게요.
          note_ko: se la subo는 ‘당신에게 그것(베개)을 올려 드려요’예요. le가 la 앞에서 se로 바뀌어요.
      - who: B
        textbook:
          es: Gracias. Y la ducha no tiene agua caliente.
          ko: 고마워요. 그리고 샤워기에서 따뜻한 물이 안 나와요.
        native:
          es: Gracias. Ah, y otra cosa. El agua de la ducha sale fría.
          ko: 고마워요. 아, 하나 더요. 샤워기 물이 차갑게 나와요.
          note_ko: otra cosa는 ‘하나 더요’ 하고 다른 얘기를 꺼낼 때 써요.
      - who: A
        textbook:
          es: Abra el grifo y espere un minuto, por favor. El agua caliente tarda un poco.
          ko: 수도꼭지를 틀고 1분만 기다려 주세요. 따뜻한 물은 조금 늦게 나와요.
        native:
          es: Déjela correr un minutito, que tarda un poco en salir caliente.
          ko: 1분만 틀어 두세요. 따뜻한 물이 나오는 데 조금 걸리거든요.
          note_ko: dejar correr el agua는 ‘물을 틀어 두다’예요. minutito는 ‘잠깐’ 같은 느낌이에요.
      - who: B
        textbook:
          es: Muy bien. ¿A qué hora es la salida mañana?
          ko: 알겠어요. 내일 체크아웃은 몇 시예요?
        native:
          es: Vale, lo pruebo. Oiga, ¿y mañana hasta qué hora hay que dejar la habitación?
          ko: 네, 해 볼게요. 그리고 내일은 몇 시까지 방을 비워야 해요?
          note_ko: oiga는 usted에게 ‘저기요’ 하고 말을 거는 말이에요. dejar la habitación은 ‘방을 비우다’예요.
      - who: A
        textbook:
          es: La salida es a las doce. Si quiere, le guardamos la maleta.
          ko: 체크아웃은 12시예요. 원하시면 가방을 맡아 드릴 수 있어요.
        native:
          es: Hasta las doce. Si quiere, le guardamos la maleta aquí.
          ko: 12시까지요. 원하시면 가방은 여기서 맡아 드릴게요.
          note_ko: guardar는 짐을 ‘맡아 두다’예요.
      - who: B
        textbook:
          es: Gracias, pero salgo para Bilbao a las nueve y cuarenta. ¿Me prepara la factura para mañana temprano?
          ko: 고마워요. 그런데 9시 40분에 빌바오로 떠나요. 내일 아침 일찍 청구서를 준비해 주시겠어요?
        native:
          es: No hace falta, que me voy a Bilbao a las nueve y cuarenta. ¿Me tiene la factura preparada a primera hora?
          ko: 괜찮아요, 9시 40분에 빌바오로 가거든요. 아침 일찍 청구서를 준비해 주실 수 있어요?
          note_ko: no hace falta는 ‘괜찮아요, 필요 없어요’예요. a primera hora는 ‘아침 일찍’이에요.
      - who: A
        textbook:
          es: Sí, claro. Buenas noches.
          ko: 네, 물론이죠. 안녕히 주무세요.
        native:
          es: Sin problema, se la dejo lista. ¡Que descanse!
          ko: 문제없어요, 준비해 둘게요. 푹 쉬세요!
          note_ko: que descanse는 usted에게 하는 ‘푹 쉬세요’예요. se la dejo lista는 ‘준비해 둘게요’예요.
      - who: B
        textbook:
          es: Gracias. Buenas noches.
          ko: 고마워요. 안녕히 주무세요.
        native:
          es: Muchas gracias. ¡Hasta mañana!
          ko: 정말 고마워요. 내일 봬요!
          note_ko: hasta mañana는 다음 날 다시 볼 사람에게 하는 인사예요.
readings:
  - id: r1
    title_es: Un hotel antiguo en Salamanca
    title_ko: 살라망카의 오래된 호텔
    level: A1
    paragraphs:
      - es: Hoy es 17 de mayo y duermo en un hotel antiguo de Salamanca. En la recepción, el recepcionista me pide el pasaporte y me da la llave de la habitación trece.
        ko: 오늘은 5월 17일, 살라망카의 오래된 호텔에서 묵어요. 프런트에서 직원이 여권을 달라고 하고 13호 방 열쇠를 줘요.
      - es: El hotel tiene ascensor, pero es muy pequeño, y mi maleta es grande. Por eso subo por la escalera hasta la tercera planta. ¡Uf, qué cansancio!
        ko: 호텔에 엘리베이터가 있지만 아주 작고, 제 가방은 커요. 그래서 계단으로 3층까지 올라가요. 휴, 힘들어요!
      - es: La habitación es bonita y tiene una cama doble. Pero en la cama solo hay una almohada. Llamo a recepción y me suben otra enseguida. Por la ventana veo las torres de la ciudad.
        ko: 방은 예쁘고 더블 침대가 있어요. 그런데 침대에 베개가 하나뿐이에요. 프런트에 전화하니 금방 하나 더 올려 줘요. 창밖으로 도시의 탑들이 보여요.
    questions:
      - q_ko: 글쓴이는 왜 계단으로 올라갔나요?
        choices_ko: [엘리베이터가 작고 가방이 커서, 엘리베이터가 고장 나서, 운동하려고]
        answer: 0
      - q_ko: 글쓴이의 방은 몇 층인가요?
        choices_ko: [지상층, 3층(한국식 4층), 13층]
        answer: 1
      - q_ko: 베개가 하나뿐이라 글쓴이는 어떻게 했나요?
        choices_ko: [그냥 잤다, 프런트에 전화했다, 다른 방으로 옮겼다]
        answer: 1
  - id: r2
    title_es: ¿En qué planta estoy?
    title_ko: 여기가 몇 층이에요?
    level: A2
    paragraphs:
      - es: En España, la planta que está a la altura de la calle se llama «planta baja». Encima está la primera planta. Por eso, la tercera planta de un hotel español es la cuarta en Corea.
        ko: 스페인에서는 길과 높이가 같은 층을 «planta baja»(지상층)라고 해요. 그 위가 1층(primera planta)이에요. 그래서 스페인 호텔의 3층은 한국에서는 4층이에요.
      - es: En algunos edificios antiguos también hay un «entresuelo» entre la planta baja y la primera. Así que, si el ascensor tiene muchos botones, ¡mira bien antes de subir!
        ko: 오래된 건물 중에는 지상층과 1층 사이에 «entresuelo»라는 층이 하나 더 있는 곳도 있어요. 그러니 엘리베이터에 버튼이 많으면 타기 전에 잘 보세요!
      - es: En la recepción te piden el pasaporte al llegar. En muchos hoteles hay que dejar la habitación antes de las doce. Si tu tren sale tarde, puedes pedir que te guarden la maleta.
        ko: 프런트에서는 도착하면 여권을 달라고 해요. 많은 호텔에서 12시 전에 방을 비워야 해요. 기차가 늦게 출발하면 가방을 맡아 달라고 부탁할 수 있어요.
    questions:
      - q_ko: 스페인 호텔의 tercera planta는 한국식으로 몇 층인가요?
        choices_ko: [3층, 4층, 2층]
        answer: 1
      - q_ko: 오래된 건물에서 지상층과 1층 사이에 있기도 한 층은 무엇인가요?
        choices_ko: [entresuelo, ático, sótano]
        answer: 0
glossary:
  "a": {lemma: "a", ko: "~에, ~로", en: "to, at", pron: "아"}
  "abra": {lemma: "abrir", ko: "여세요, 트세요(usted 명령)", en: "open (formal)", pron: "**아**브라"}
  "agua": {lemma: "agua", ko: "물", en: "water", pron: "**아**구아"}
  "ah": {lemma: "ah", ko: "아(감탄)", en: "ah", pron: "**아**"}
  "ahora": {lemma: "ahora", ko: "지금", en: "now", pron: "아**오**라"}
  "al": {lemma: "a + el", ko: "~에, ~(으)로(a+el)", en: "to the", pron: "알"}
