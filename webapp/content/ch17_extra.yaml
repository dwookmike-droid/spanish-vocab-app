schema_version: 1
chapter: 17
dialogues:
  - id: d1
    title_es: Un partido en el bar
    title_ko: 바에서 축구 보기
    setting_ko: 팜플로나 구시가의 바. 텔레비전으로 축구 경기를 하고 있어요.
    roles:
      A: {es: Aficionado, ko: 축구 팬}
      B: {es: Turista, ko: 여행자}
    lines:
      - who: B
        textbook:
          es: Perdone, ¿cómo va el partido?
          ko: 실례합니다, 경기 어떻게 돼 가요?
        native:
          es: Perdone, ¿cómo van?
          ko: 저기요, 몇 대 몇이에요?
          note_ko: ¿cómo van?은 ‘(두 팀이) 어떻게 돼 가요?’라는 뜻으로, 점수를 짧게 묻는 말이에요.
      - who: A
        textbook:
          es: Vamos uno a cero. Nuestro equipo gana.
          ko: 1 대 0이에요. 우리 팀이 이기고 있어요.
        native:
          es: Uno a cero, ganamos. ¡Y el gol ha sido una maravilla!
          ko: 1 대 0, 우리가 이기고 있어요. 그 골 정말 끝내줬어요!
          note_ko: 응원하는 팀 이야기를 할 때는 ganamos(우리가 이긴다)처럼 ‘우리’로 말해요.
      - who: B
        textbook:
          es: ¿Quién ha marcado el gol?
          ko: 누가 골을 넣었어요?
        native:
          es: ¿Y quién lo ha metido?
          ko: 누가 넣었어요?
          note_ko: meter un gol은 marcar un gol과 같은 뜻으로, 말할 때 더 흔해요.
      - who: A
        textbook:
          es: El número nueve. Es el mejor jugador del equipo.
          ko: 9번이요. 팀에서 제일 잘하는 선수예요.
        native:
          es: El nueve, de cabeza. Ese chaval es lo mejor que tenemos.
          ko: 9번이 헤딩으로요. 저 친구가 우리 팀 최고예요.
          note_ko: chaval은 ‘젊은 친구, 녀석’이라는 스페인 구어예요.
      - who: B
        textbook:
          es: ¿Qué pasa? ¿Por qué pita el árbitro?
          ko: 무슨 일이에요? 심판이 왜 휘슬을 불어요?
        native:
          es: ¡Uy! ¿Qué ha pitado el árbitro?
          ko: 앗! 심판이 뭘 분 거예요?
          note_ko: pitar는 ‘휘슬을 불다’예요. 반칙이나 페널티킥을 선언한다는 뜻으로도 써요.
      - who: A
        textbook:
          es: Es un penalti para el otro equipo. ¡No es justo!
          ko: 상대 팀 페널티킥이에요. 이건 불공평해요!
        native:
          es: ¡Penalti! ¡Pero si no le ha tocado! ¡Árbitro, que estás ciego!
          ko: 페널티킥이래요! 건드리지도 않았는데! 심판, 눈은 어디 뒀어!
          note_ko: pero si…는 ‘~했는데도’ 하고 억울함을 터뜨리는 말이에요. 경기장에서 심판에게 흔히 외쳐요.
      - who: B
        textbook:
          es: ¿Usted va al estadio a ver los partidos?
          ko: 경기장에 가서 경기를 보세요?
        native:
          es: ¿Y usted suele ir al estadio?
          ko: 경기장에는 자주 가세요?
          note_ko: soler + 동사원형은 ‘보통 ~하다, 자주 ~하다’예요.
      - who: A
        textbook:
          es: Sí, casi siempre. Nunca me pierdo un partido en casa.
          ko: 네, 거의 늘 가요. 홈경기는 절대 안 놓쳐요.
        native:
          es: Claro, no me pierdo ni uno en casa. Si quieres, te digo dónde comprar las entradas.
          ko: 그럼요, 홈경기는 하나도 안 놓쳐요. 원하면 입장권 어디서 사는지 알려 줄게요.
          note_ko: nunca를 쓰지 않고 no … ni uno(하나도 안)로도 말해요. en casa는 ‘홈경기에서’예요.
      - who: B
        textbook:
          es: Muchas gracias. Ahora vamos a ver el penalti.
          ko: 고맙습니다. 이제 페널티킥 봐요.
        native:
          es: ¡Genial, gracias! Y ojalá lo pare el portero.
          ko: 좋아요, 고마워요! 골키퍼가 막으면 좋겠네요.
          note_ko: ojalá는 ‘~하면 좋겠다’는 바람이에요. 뒤에 접속법(pare)이 와요.
  - id: d2
    title_es: En la oficina de turismo
    title_ko: 관광 안내소에서
    setting_ko: 팜플로나 관광 안내소. 7월 축제와 자전거 대여에 대해 물어봐요.
    roles:
      A: {es: Empleada, ko: 안내소 직원}
      B: {es: Turista, ko: 여행자}
    lines:
      - who: B
        textbook:
          es: Hola. ¿Cuándo es la fiesta de San Fermín?
          ko: 안녕하세요. 산 페르민 축제는 언제예요?
        native:
          es: Hola, buenas. Una pregunta, ¿los Sanfermines cuándo son?
          ko: 안녕하세요, 하나 물어볼게요. 산 페르민 축제는 언제 해요?
          note_ko: 이 축제는 흔히 los Sanfermines라고 복수로 불러요.
      - who: A
        textbook:
          es: Es en julio, del seis al catorce. Ahora, en mayo, no hay fiesta.
          ko: 7월 6일부터 14일까지예요. 지금 5월에는 축제가 없어요.
        native:
          es: Del seis al catorce de julio. Ahora está todo muy tranquilo, ya ves.
          ko: 7월 6일부터 14일까지예요. 보시다시피 지금은 아주 조용하죠.
          note_ko: ya ves는 ‘보다시피’예요.
      - who: B
        textbook:
          es: ¿Qué hay en la fiesta?
          ko: 축제 때는 뭐가 있어요?
        native:
          es: ¿Y qué se hace en las fiestas?
          ko: 축제 때는 다들 뭘 해요?
          note_ko: se hace는 ‘(사람들이) 한다’는 일반적인 말이에요.
      - who: A
        textbook:
          es: Hay desfiles, bandas de música y fuegos artificiales por la noche. La gente lleva ropa blanca y un pañuelo rojo.
          ko: 행진도 있고, 악단도 있고, 밤에는 불꽃놀이도 해요. 사람들은 흰 옷을 입고 빨간 스카프를 둘러요.
        native:
          es: De todo, desfiles, bandas por la calle, fuegos artificiales por la noche… Y todo el mundo de blanco, con su pañuelo rojo.
          ko: 다 있어요. 행진, 거리 악단, 밤 불꽃놀이… 그리고 다들 흰 옷에 빨간 스카프를 둘러요.
          note_ko: todo el mundo는 ‘온 세상’이 아니라 ‘모두, 다들’이에요. de blanco는 ‘흰 옷을 입고’예요.
      - who: B
        textbook:
          es: ¿Dónde puedo comprar un pañuelo?
          ko: 스카프는 어디서 살 수 있어요?
        native:
          es: ¡Qué bonito! ¿Y el pañuelo dónde lo compro?
          ko: 멋지네요! 스카프는 어디서 사요?
          note_ko: 목적어를 앞으로 빼면 lo를 다시 붙여요. el pañuelo… lo compro처럼요.
      - who: A
        textbook:
          es: En muchas tiendas del casco antiguo. Venden pañuelos todo el año.
          ko: 구시가의 여러 가게에서 팔아요. 스카프는 일 년 내내 팔아요.
        native:
          es: En cualquier tienda del casco antiguo. Los tienen todo el año.
          ko: 구시가 가게면 어디든 있어요. 일 년 내내 팔아요.
          note_ko: cualquier는 ‘어느 ~든’이에요.
      - who: B
        textbook:
          es: Gracias. También quiero alquilar una bicicleta. ¿Dónde puedo alquilar una?
          ko: 고마워요. 자전거도 빌리고 싶어요. 어디서 빌릴 수 있어요?
        native:
          es: Genial. Otra cosa, ¿dónde puedo alquilar una bici?
          ko: 좋네요. 하나 더요, 자전거는 어디서 빌릴 수 있어요?
          note_ko: bici는 bicicleta를 줄인 말이에요. 말할 때는 거의 이렇게 해요.
      - who: A
        textbook:
          es: Hay una tienda de alquiler cerca de aquí. Tome este mapa con los carriles bici.
          ko: 이 근처에 자전거 대여점이 있어요. 자전거 도로가 나온 이 지도를 가져가세요.
        native:
          es: Mira, aquí al lado tienes una. Y toma el mapa, que viene el carril bici.
          ko: 봐요, 바로 옆에 하나 있어요. 이 지도도 가져가요. 자전거 도로가 나와 있거든요.
          note_ko: 여기서 viene는 ‘(지도에) 나와 있다’는 뜻이에요.
      - who: B
        textbook:
          es: Muchas gracias. Esta tarde voy en bicicleta por el parque.
          ko: 정말 고마워요. 오늘 오후에 자전거 타고 공원에 갈게요.
        native:
          es: ¡Mil gracias! Pues esta tarde, bici por el parque.
          ko: 정말 고마워요! 그럼 오늘 오후엔 공원에서 자전거 타야겠어요.
          note_ko: 동사를 빼고 bici por el parque처럼 계획만 짧게 말하기도 해요.
      - who: A
        textbook:
          es: De nada. ¡Y vuelva en julio para la fiesta!
          ko: 천만에요. 7월에 축제 보러 또 오세요!
        native:
          es: ¡A disfrutar! Y en julio, ¡a vivir los Sanfermines!
          ko: 즐겁게 보내요! 7월엔 산 페르민 축제도 즐기러 오고요!
          note_ko: a + 동사원형은 ‘자, ~하자’라는 들뜬 말투예요.
readings:
  - id: r1
    title_es: Un día con deporte en Pamplona
    title_ko: 팜플로나에서 운동하는 하루
    level: A1
    paragraphs:
      - es: Hoy es 19 de mayo y estoy en Pamplona. Siempre corro por la mañana. Hoy corro por el casco antiguo. No es una carrera, y corro despacio. Las calles están tranquilas.
        ko: 오늘은 5월 19일, 저는 팜플로나에 있어요. 저는 늘 아침에 달려요. 오늘은 구시가를 달려요. 경주가 아니니까 천천히 달려요. 거리가 조용해요.
      - es: Después voy a un gimnasio cerca del hotel. Tiene piscina, y nado un poco. Por la tarde alquilo una bicicleta y voy por el parque. Allí unos niños juegan con un balón.
        ko: 그다음 호텔 근처 체육관에 가요. 수영장이 있어서 조금 헤엄쳐요. 오후에는 자전거를 빌려 공원을 달려요. 공원에서는 아이들이 축구공을 차며 놀아요.
      - es: Por la noche veo un partido de fútbol en un bar. Hay mucha gente. Cuando hay un gol, ¡todo el bar grita!
        ko: 밤에는 바에서 축구 경기를 봐요. 사람이 아주 많아요. 골이 들어가면 바 안의 모두가 소리를 질러요!
    questions:
      - q_ko: 글쓴이는 아침에 무엇을 했나요?
        choices_ko: [구시가를 달렸다, 수영했다, 축구를 했다]
        answer: 0
      - q_ko: 글쓴이는 밤에 어디에서 축구를 봤나요?
        choices_ko: [경기장, 바, 호텔 방]
        answer: 1
  - id: r2
    title_es: San Fermín, en julio
    title_ko: 산 페르민은 7월에
    level: A2
    paragraphs:
      - es: Pamplona es famosa por San Fermín. Pero la fiesta no es en mayo, es en julio, del 6 al 14. Hoy, 19 de mayo, las calles están tranquilas y no hay fiesta.
        ko: 팜플로나는 산 페르민 축제로 유명해요. 하지만 축제는 5월이 아니라 7월 6일부터 14일까지 열려요. 5월 19일인 오늘은 거리가 조용하고 축제도 없어요.
      - es: En julio, la ciudad se llena de gente. Casi todos van de blanco, con un pañuelo rojo al cuello. Por la mañana hay encierros, y los corredores corren delante de los toros por las calles. Por la noche hay fuegos artificiales.
        ko: 7월이 되면 도시가 사람들로 가득 차요. 거의 모두 흰 옷을 입고 목에 빨간 스카프를 둘러요. 아침에는 엔시에로가 열려요. 사람들이 거리에서 소 떼 앞을 달리는 행사예요. 밤에는 불꽃놀이가 있어요.
      - es: En la oficina de turismo me dicen que en julio los hoteles están muy llenos. Si quieres venir, es mejor reservar pronto.
        ko: 관광 안내소에서는 7월에는 호텔이 꽉 찬다고 해요. 그때 오고 싶다면 일찍 예약하는 게 좋아요.
    questions:
      - q_ko: 산 페르민 축제는 언제 열리나요?
        choices_ko: [5월, 7월 6일~14일, 9월]
        answer: 1
      - q_ko: 축제 때 사람들은 어떻게 입나요?
        choices_ko: [흰 옷에 빨간 스카프, 검은 옷에 흰 스카프, 빨간 옷에 모자]
        answer: 0
      - q_ko: 엔시에로는 무엇인가요?
        choices_ko: [소 떼 앞을 달리는 행사, 밤 불꽃놀이, 축구 경기]
        answer: 0
