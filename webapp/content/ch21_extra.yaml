schema_version: 1
chapter: 21
dialogues:
  - id: d1
    title_es: Regatear en el Rastro
    title_ko: 라스트로에서 값 흥정하기
    setting_ko: 마드리드 라스트로 벼룩시장. 골동품 노점에서 오래된 거울을 발견했어요.
    roles:
      A: {es: Vendedor, ko: 판매원}
      B: {es: Cliente, ko: 손님}
    lines:
      - who: A
        textbook:
          es: Buenos días. ¿Busca algo?
          ko: 안녕하세요. 찾으시는 거 있어요?
        native:
          es: ¡Buenas! Mira sin compromiso, ¿eh?
          ko: 안녕하세요! 부담 없이 구경해요.
          note_ko: sin compromiso는 ‘안 사도 괜찮아요’라는 뜻이에요. 노점에서 자주 들어요.
      - who: B
        textbook:
          es: Gracias. ¿Cuánto cuesta este espejo?
          ko: 고마워요. 이 거울은 얼마예요?
        native:
          es: Gracias. Oiga, ¿y este espejo cuánto es?
          ko: 고마워요. 저기요, 이 거울은 얼마예요?
          note_ko: ¿cuánto es?는 ¿cuánto cuesta?보다 짧고 흔해요. 나이 든 판매원이라 usted(oiga)를 써요.
      - who: A
        textbook:
          es: Cuesta treinta euros. Es una antigüedad.
          ko: 30유로예요. 골동품이에요.
        native:
          es: Ese, treinta. Es antiguo de verdad, ¿eh?
          ko: 그건 30유로요. 진짜 오래된 거예요.
          note_ko: 손님 앞에 있는 물건이라 ese(그것)라고 해요. de verdad는 ‘진짜로’예요.
      - who: B
        textbook:
          es: Es un poco caro. ¿Me hace un descuento?
          ko: 좀 비싸네요. 좀 깎아 주실 수 있어요?
        native:
          es: Uf, un poco caro... ¿Me lo deja en veinte?
          ko: 음, 좀 비싸네요… 20유로에 주실래요?
          note_ko: ¿me lo deja en…?는 ‘…에 주실래요?’ 하고 값을 깎을 때 써요.
      - who: A
        textbook:
          es: Veinte no. Se lo dejo en veinticinco euros.
          ko: 20유로는 안 돼요. 25유로에 드릴게요.
        native:
          es: Veinte, imposible. Venga, veinticinco y te lo llevas.
          ko: 20은 안 돼요. 좋아요, 25유로면 가져가요.
          note_ko: venga는 ‘좋아요, 자’ 하고 한발 물러설 때도 써요.
      - who: B
        textbook:
          es: Vale. ¿Puedo pagar con tarjeta?
          ko: 좋아요. 카드로 내도 돼요?
        native:
          es: Vale, trato hecho. ¿Le puedo pagar con tarjeta?
          ko: 좋아요, 그렇게 해요. 카드로 내도 될까요?
          note_ko: trato hecho는 ‘거래 성사’라는 말이에요. 흥정이 끝났을 때 해요.
      - who: A
        textbook:
          es: No, lo siento. Aquí solo aceptamos dinero en efectivo.
          ko: 아니요, 죄송해요. 여기서는 현금만 받아요.
        native:
          es: Uy, no, aquí solo efectivo. Si quieres, hay un cajero por aquí cerca.
          ko: 아이고, 아니요, 여기는 현금만 돼요. 필요하면 이 근처에 현금인출기가 있어요.
          note_ko: efectivo는 ‘현금’, cajero는 ‘현금인출기’예요. 노점은 현금만 받는 곳이 많아요.
      - who: B
        textbook:
          es: No pasa nada. Tengo un billete de cincuenta euros.
          ko: 괜찮아요. 50유로 지폐가 있어요.
        native:
          es: Nada, tengo un billete de cincuenta. ¿Tiene cambio?
          ko: 괜찮아요, 50유로짜리 있어요. 거스름돈 있으세요?
          note_ko: 지폐 액수만 말할 때는 euros를 흔히 빼요.
      - who: A
        textbook:
          es: Sí, claro. Aquí tiene el cambio, veinticinco euros.
          ko: 네, 그럼요. 거스름돈 25유로 여기 있어요.
        native:
          es: Sí, sí. Toma, veinticinco de vuelta. Y te lo meto en una bolsa.
          ko: 네, 있어요. 여기요, 25유로 거스름돈이요. 봉지에 넣어 드릴게요.
          note_ko: de vuelta는 ‘거스름돈으로’예요. 스페인에서는 거스름돈을 la vuelta라고도 해요.
      - who: B
        textbook:
          es: Muchas gracias. ¡Adiós!
          ko: 고맙습니다. 안녕히 계세요!
        native:
          es: ¡Gracias! ¡Que vaya bien!
          ko: 고마워요! 수고하세요!
          note_ko: que vaya bien은 헤어질 때 ‘잘 지내세요’ 정도로 건네는 인사예요.
  - id: d2
    title_es: Un regalo en una tienda del centro
    title_ko: 시내 가게에서 선물 사기
    setting_ko: 마드리드 시내의 작은 가게. 어머니께 드릴 선물을 고르고 있어요.
    roles:
      A: {es: Dependienta, ko: 점원}
      B: {es: Cliente, ko: 손님}
    lines:
      - who: B
        textbook:
          es: Hola. Busco un regalo para mi madre.
          ko: 안녕하세요. 어머니께 드릴 선물을 찾고 있어요.
        native:
          es: Hola, buenas. Estoy buscando un regalo para mi madre.
          ko: 안녕하세요. 엄마 선물을 찾는 중이에요.
          note_ko: estoy buscando는 ‘찾는 중이에요’예요. 가게에서 아주 흔하게 써요.
      - who: A
        textbook:
          es: Tenemos estos pañuelos. Están en oferta.
          ko: 이 스카프들이 있어요. 특가 상품이에요.
        native:
          es: Mira, estos pañuelos están de oferta esta semana.
          ko: 보세요, 이 스카프들은 이번 주에 특가예요.
          note_ko: en oferta와 de oferta는 둘 다 ‘특가 중’이라는 뜻이에요.
      - who: B
        textbook:
          es: ¿Cuánto cuesta este?
          ko: 이건 얼마예요?
        native:
          es: Qué bonito. ¿Y este cuánto sale?
          ko: 예쁘네요. 이건 얼마예요?
          note_ko: ¿cuánto sale?도 ‘얼마예요?’라는 뜻이에요.
      - who: A
        textbook:
          es: Este cuesta quince euros. Antes costaba veinte.
          ko: 이건 15유로예요. 원래는 20유로였어요.
        native:
          es: Quince euros. Antes estaba a veinte.
          ko: 15유로예요. 전에는 20유로였어요.
          note_ko: 값이 얼마인지 말할 때 estar a를 많이 써요.
      - who: B
        textbook:
          es: Me llevo este. ¿Me lo puede envolver para regalo?
          ko: 이걸로 살게요. 선물 포장해 주실 수 있어요?
        native:
          es: Me llevo este. ¿Me lo envuelves para regalo?
          ko: 이걸로 할게요. 선물 포장해 주실래요?
          note_ko: para regalo라고 하면 선물용으로 싸 달라는 뜻이에요.
      - who: A
        textbook:
          es: Sí, claro. ¿Paga con tarjeta o en efectivo?
          ko: 네, 그럼요. 카드로 내시겠어요, 현금으로 내시겠어요?
        native:
          es: Claro. ¿Tarjeta o efectivo?
          ko: 그럼요. 카드요, 현금이요?
          note_ko: 질문을 다 하지 않고 고를 것만 짧게 물어요.
      - who: B
        textbook:
          es: Con tarjeta, por favor. ¿Me da el recibo?
          ko: 카드로 할게요. 영수증 주시겠어요?
        native:
          es: Con tarjeta. ¿Me das el ticket, porfa?
          ko: 카드로요. 영수증 주실래요?
          note_ko: 영수증은 el ticket이라고도 해요. 가게에서는 이 말을 더 자주 들어요.
      - who: A
        textbook:
          es: Aquí tiene el recibo. Si no le gusta, puede cambiarlo en quince días.
          ko: 영수증 여기 있어요. 마음에 안 드시면 15일 안에 교환하실 수 있어요.
        native:
          es: Toma. Con el ticket lo puedes cambiar en quince días, ¿vale?
          ko: 여기요. 영수증이 있으면 15일 안에 교환할 수 있어요, 아셨죠?
          note_ko: 교환 기간은 가게마다 달라요. 영수증은 꼭 챙겨 둬요.
      - who: B
        textbook:
          es: Muy bien. Muchas gracias.
          ko: 알겠어요. 고맙습니다.
        native:
          es: Perfecto, ¡gracias!
          ko: 좋아요, 고마워요!
          note_ko: perfecto는 ‘딱 좋아요, 알겠어요’라는 맞장구로 자주 써요.
readings:
  - id: r1
    title_es: Una mañana en el Rastro
    title_ko: 라스트로에서 보낸 아침
    level: A1
    paragraphs:
      - es: Es 13 de mayo, por la mañana. Voy al Rastro, un mercadillo muy grande de Madrid. La calle principal se llama Ribera de Curtidores.
        ko: 5월 13일 아침이에요. 마드리드의 아주 큰 벼룩시장인 라스트로에 가요. 중심 거리 이름은 리베라 데 쿠르티도레스예요.
      - es: Hay puestos de ropa, de libros viejos y de antigüedades. Hay mucha gente, así que llevo la mochila delante.
        ko: 옷, 헌책, 골동품을 파는 노점이 있어요. 사람이 많아서 배낭은 앞으로 메요.
      - es: En un puesto veo un espejo antiguo. El vendedor dice treinta euros, pero me lo deja en veinticinco. Pago con un billete de cincuenta y el vendedor me da el cambio. ¡Qué bien!
        ko: 한 노점에서 오래된 거울을 봐요. 판매원은 30유로라고 하지만 25유로에 줘요. 50유로 지폐로 내고 거스름돈을 받아요. 잘됐어요!
    questions:
      - q_ko: 라스트로는 어떤 곳인가요?
        choices_ko: [미술관, 벼룩시장, 기차역]
        answer: 1
      - q_ko: 글쓴이는 왜 배낭을 앞으로 멨나요?
        choices_ko: [사람이 많아서, 비가 와서, 배낭이 무거워서]
        answer: 0
      - q_ko: 거울은 결국 얼마에 샀나요?
        choices_ko: [20유로, 30유로, 25유로]
        answer: 2
  - id: r2
    title_es: Regalos para casa
    title_ko: 집에 가져갈 선물
    level: A2
    paragraphs:
      - es: Por la tarde busco regalos para mi familia. En una tienda del centro hay ofertas, pero no hay rebajas. En España, las rebajas grandes suelen ser en enero y en julio.
        ko: 오후에는 가족에게 줄 선물을 찾아요. 시내 가게에 특가 상품은 있지만 세일은 하지 않아요. 스페인에서 큰 세일은 보통 1월과 7월에 열리거든요.
      - es: Para mi madre compro un pañuelo de quince euros. Antes costaba veinte, así que tiene un descuento de cinco euros. La dependienta lo envuelve para regalo y me da el recibo.
        ko: 어머니께 드릴 15유로짜리 스카프를 사요. 원래 20유로였으니까 5유로 할인받은 셈이에요. 점원이 선물 포장을 해 주고 영수증을 줘요.
      - es: En la caja pago con tarjeta, porque ya tengo pocas monedas. Ahora llevo muchas bolsas. Mañana voy a Toledo, y no sé si todo cabe en la maleta.
        ko: 동전이 얼마 안 남아서 계산대에서 카드로 내요. 이제 봉지가 한가득이에요. 내일은 톨레도에 가는데, 여행 가방에 다 들어갈지 모르겠어요.
    questions:
      - q_ko: 스페인에서 큰 세일은 보통 언제 열리나요?
        choices_ko: [5월, 1월과 7월, 12월]
        answer: 1
      - q_ko: 스카프는 얼마나 할인받았나요?
        choices_ko: [5유로, 10유로, 15유로]
        answer: 0
      - q_ko: 글쓴이는 왜 카드로 냈나요?
        choices_ko: [현금인출기가 없어서, 카드가 더 싸서, 동전이 얼마 안 남아서]
        answer: 2
