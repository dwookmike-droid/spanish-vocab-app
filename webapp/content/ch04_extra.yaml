schema_version: 1
chapter: 4
dialogues:
  - id: d1
    title_es: En la recepción, el enchufe no funciona
    title_ko: 호텔 방 콘센트가 안 될 때
    setting_ko: 톨레도의 작은 호텔. 밤에 휴대폰을 충전하려는데 콘센트가 안 돼요.
    roles:
      A: {es: Recepcionista, ko: 프런트 직원}
      B: {es: Huésped, ko: 손님}
    lines:
      - who: B
        textbook:
          es: Buenas noches. Soy de la habitación quince.
          ko: 안녕하세요. 15호실 손님이에요.
        native:
          es: Hola, buenas. Mira, estoy en la quince.
          ko: 안녕하세요. 저기, 15호실인데요.
          note_ko: buenas는 아침저녁 가리지 않고 쓰는 인사예요. 방 번호는 la quince처럼 짧게 말해요.
      - who: A
        textbook:
          es: Buenas noches. ¿En qué puedo ayudarle?
          ko: 안녕하세요. 무엇을 도와드릴까요?
        native:
          es: Hola, dime.
          ko: 네, 말씀하세요.
          note_ko: dime(말해 봐)는 '네, 말씀하세요' 정도로 아주 흔한 응대 말이에요.
      - who: B
        textbook:
          es: El enchufe de la mesilla no funciona.
          ko: 협탁 쪽 콘센트가 안 돼요.
        native:
          es: Es que el enchufe de la mesilla no va.
          ko: 그게요, 협탁 콘센트가 안 돼요.
          note_ko: es que는 사정을 꺼낼 때 붙여요. '작동하지 않다'를 no va로도 말해요.
      - who: A
        textbook:
          es: Lo siento. ¿Ha probado el enchufe que está al lado del armario?
          ko: 죄송해요. 옷장 옆 콘센트도 써 보셨어요?
        native:
          es: Vaya, perdona. ¿Y el de al lado del armario?
          ko: 아이고, 죄송해요. 옷장 옆에 있는 건요?
          note_ko: vaya는 '아이고, 저런'. el de ...로 enchufe를 다시 말하지 않아요.
      - who: B
        textbook:
          es: Sí, pero tampoco funciona. Necesito cargar el móvil.
          ko: 네, 그런데 그것도 안 돼요. 휴대폰을 충전해야 해요.
        native:
          es: Ya, pero tampoco va. Y me estoy quedando sin batería.
          ko: 네, 그것도 안 돼요. 배터리가 다 떨어져 가요.
          note_ko: ya는 '네, 해 봤어요'. 배터리가 떨어져 갈 땐 quedarse sin batería라고 해요.
      - who: A
        textbook:
          es: Entonces le cambio de habitación. Tome la llave de la dieciséis.
          ko: 그럼 방을 바꿔 드릴게요. 16호실 열쇠 받으세요.
        native:
          es: Pues te cambio de habitación, ¿vale? Toma, la llave de la dieciséis.
          ko: 그럼 방 바꿔 드릴게요, 괜찮죠? 여기 16호실 열쇠요.
          note_ko: 스페인에선 직원도 손님에게 tú(te, toma)를 자주 써요. ¿vale?는 '괜찮죠?'
      - who: B
        textbook:
          es: Muchas gracias. ¿Hay una manta en el armario?
          ko: 고맙습니다. 옷장에 담요가 있나요?
        native:
          es: Genial, gracias. Oye, ¿y hay alguna manta en el armario?
          ko: 잘됐네요, 고마워요. 참, 옷장에 담요도 있어요?
          note_ko: oye는 말을 이을 때 '참, 저기'. alguna는 '혹시 하나라도'라는 느낌이에요.
      - who: A
        textbook:
          es: Sí, hay una manta en el armario y otra almohada en la cómoda.
          ko: 네, 옷장에 담요가 있고 서랍장에 베개도 하나 더 있어요.
        native:
          es: Sí, en el armario tienes una, y en la cómoda hay otra almohada.
          ko: 네, 옷장에 하나 있어요. 서랍장에 베개도 하나 더 있고요.
          note_ko: 여기서 tienes는 '가지고 있다'가 아니라 '거기 있어요'라는 뜻이에요.
      - who: B
        textbook:
          es: Perfecto. Buenas noches.
          ko: 좋아요. 안녕히 주무세요.
        native:
          es: Vale, perfecto. ¡Hasta mañana!
          ko: 네, 좋아요. 내일 봬요!
          note_ko: 밤에 헤어질 때 hasta mañana(내일 봐요)를 많이 써요.
  - id: d2
    title_es: ¿De quién es este pijama?
    title_ko: 이 잠옷 누구 거야?
    setting_ko: 톨레도 숙소 방, 밤. 친구와 자기 전에 짐을 챙겨요.
    roles:
      A: {es: Amiga, ko: 친구}
      B: {es: Yo, ko: 나}
    lines:
      - who: A
        textbook:
          es: ¿De quién es este pijama azul?
          ko: 이 파란 잠옷 누구 거야?
        native:
          es: Oye, ¿y este pijama azul? ¿Es tuyo?
          ko: 야, 이 파란 잠옷 뭐야? 네 거야?
          note_ko: 말할 땐 ¿y este...?로 물건을 먼저 꺼내고 나서 물어요.
      - who: B
        textbook:
          es: Sí, es mío. ¿Dónde está mi maleta?
          ko: 응, 내 거야. 내 여행 가방 어디 있어?
        native:
          es: Sí, es mío, trae. ¿Y mi maleta? ¿Dónde la he dejado?
          ko: 응, 내 거야, 줘. 근데 내 가방은? 어디 뒀지?
          note_ko: trae는 '이리 줘'. 물건을 찾을 땐 ¿dónde la he dejado?(어디 뒀지?)라고 해요.
      - who: A
        textbook:
          es: Tu maleta está en el armario, debajo de las perchas.
          ko: 네 여행 가방은 옷장 안 옷걸이 밑에 있어.
        native:
          es: Ahí, en el armario, debajo de las perchas.
          ko: 저기 옷장 안에, 옷걸이 밑에.
          note_ko: 말할 땐 주어(tu maleta)를 빼고 ahí(저기)로 가리켜요.
      - who: B
        textbook:
          es: Gracias. ¿Puedes poner el despertador a las siete?
          ko: 고마워. 자명종 7시에 맞춰 줄래?
        native:
          es: Vale. ¿Me pones el despertador a las siete?
          ko: 알았어. 자명종 7시로 맞춰 줄래?
          note_ko: 부탁할 땐 ¿me pones...?(~해 줄래?)를 정말 많이 써요.
      - who: A
        textbook:
          es: Sí. ¿Dónde está el cargador? Mi móvil no tiene batería.
          ko: 응. 충전기 어디 있어? 내 휴대폰 배터리가 없어.
        native:
          es: Hecho. ¿Y el cargador? Que no me queda batería.
          ko: 알았어. 충전기는? 배터리가 하나도 없어서.
          note_ko: hecho는 '알았어, 그럴게'. que로 시작해 이유를 덧붙여요.
      - who: B
        textbook:
          es: Está en el cajón de la mesilla. El enchufe está detrás de la cama.
          ko: 협탁 서랍에 있어. 콘센트는 침대 뒤에 있어.
        native:
          es: En el cajón de la mesilla. El enchufe está detrás de la cama, ¿eh?
          ko: 협탁 서랍에. 콘센트는 침대 뒤에 있어, 알았지?
          note_ko: 말끝의 ¿eh?는 '알았지?' 하고 확인하는 말이에요.
      - who: A
        textbook:
          es: Perfecto. ¿Apago la luz?
          ko: 좋아. 불 끌까?
        native:
          es: Genial. Venga, ¿apago la luz?
          ko: 좋아. 자, 이제 불 끌까?
          note_ko: venga는 '자, 그럼' 하고 다음으로 넘어갈 때 써요.
      - who: B
        textbook:
          es: Sí, por favor. Buenas noches.
          ko: 응, 꺼 줘. 잘 자.
        native:
          es: Sí, apaga. ¡Buenas noches, hasta mañana!
          ko: 응, 꺼. 잘 자, 내일 봐!
          note_ko: 친구 사이엔 por favor 없이 apaga(꺼)만 해도 돼요.
readings:
  - id: r1
    title_es: Mi habitación en Toledo
    title_ko: 톨레도의 내 방
    level: A1
    paragraphs:
      - es: Estoy en Toledo, en un hotel pequeño. Mi habitación es la quince. No es grande, pero es bonita. Hay una cama, una mesilla y un armario viejo.
        ko: 지금 톨레도의 작은 호텔에 있어요. 제 방은 15호실이에요. 크지는 않지만 예뻐요. 침대 하나, 협탁 하나, 오래된 옷장 하나가 있어요.
      - es: En la cama hay dos almohadas, sábanas blancas y una manta. Al lado del armario hay un espejo de pie. Mi maleta está en el armario y mis zapatillas están debajo de la cama.
        ko: 침대에는 베개 두 개와 하얀 시트, 담요가 있어요. 옷장 옆에는 전신 거울이 있어요. 여행 가방은 옷장에, 실내화는 침대 밑에 있어요.
      - es: La habitación tiene un balcón pequeño. Desde el balcón veo una calle estrecha y muchas ventanas.
        ko: 방에는 작은 발코니가 있어요. 발코니에서 좁은 골목과 창문이 많이 보여요.
    questions:
      - q_ko: 글쓴이의 방은 몇 호실인가요?
        choices_ko: [15호실, 16호실, 5호실]
        answer: 0
      - q_ko: 실내화는 어디에 있나요?
        choices_ko: [옷장 안, 침대 밑, 발코니]
        answer: 1
  - id: r2
    title_es: Antes de dormir
    title_ko: 자기 전에
    level: A2
    paragraphs:
      - es: Hoy he caminado mucho por las calles de Toledo. Por la noche vuelvo al hotel, me ducho y me pongo el pijama.
        ko: 오늘은 톨레도 골목을 많이 걸었어요. 밤에 호텔로 돌아와서 샤워하고 잠옷을 입어요.
      - es: Pongo el móvil a cargar, pero el enchufe de la mesilla no funciona. Uso el enchufe que está al lado de la cómoda. Después pongo el despertador a las siete, porque mañana voy a Salamanca.
        ko: 휴대폰을 충전하려는데 협탁 콘센트가 안 돼요. 그래서 서랍장 옆 콘센트를 써요. 그다음 자명종을 7시에 맞춰요. 내일 살라망카에 가거든요.
      - es: Bajo la persiana, cierro el balcón y apago la luz. La almohada es blanda y la manta es suave. ¡Buenas noches, Toledo!
        ko: 블라인드를 내리고 발코니 문을 닫고 불을 꺼요. 베개는 푹신하고 담요는 부드러워요. 잘 자, 톨레도!
    questions:
      - q_ko: 자명종을 몇 시에 맞췄나요?
        choices_ko: [6시, 7시, 8시]
        answer: 1
      - q_ko: 왜 서랍장 옆 콘센트를 썼나요?
        choices_ko: [협탁 콘센트가 안 돼서, 충전기가 없어서, 불이 꺼져서]
        answer: 0
      - q_ko: 글쓴이는 내일 어디에 가나요?
        choices_ko: [마드리드, 살라망카, 세비야]
        answer: 1
