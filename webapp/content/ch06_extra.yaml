schema_version: 1
chapter: 6
dialogues:
  - id: d1
    title_es: En el puesto de fruta
    title_ko: 과일 가게 앞에서
    setting_ko: 바르셀로나의 시장. 과일 가게 앞에서 차례를 기다렸다가 주문해요.
    roles:
      A: {es: Vendedora, ko: 상인}
      B: {es: Cliente, ko: 손님}
    lines:
      - who: A
        textbook:
          es: Buenos días. ¿Qué desea?
          ko: 안녕하세요. 뭘 드릴까요?
        native:
          es: Hola, buenos días. ¿Qué te pongo?
          ko: 안녕하세요. 뭐 드릴까요?
          note_ko: 시장에선 ¿qué te pongo?(뭘 담아 줄까요?)라고 묻고, 손님에게도 tú를 써요.
      - who: B
        textbook:
          es: ¿A cuánto está el kilo de fresas?
          ko: 딸기 1킬로에 얼마예요?
        native:
          es: ¿A cómo van las fresas?
          ko: 딸기 얼마예요?
          note_ko: 값을 물을 때 ¿a cómo van?(얼마에 팔아요?)도 자주 들어요.
      - who: A
        textbook:
          es: Están a cuatro euros el kilo. Son muy buenas.
          ko: 1킬로에 4유로예요. 아주 맛있어요.
        native:
          es: A cuatro el kilo. Y mira qué pinta tienen, ¿eh?
          ko: 1킬로에 4유로요. 이것 좀 봐요, 때깔 좋죠?
          note_ko: 단위(euros)는 빼고 숫자만 말해요. pinta는 '겉모습, 때깔'.
      - who: B
        textbook:
          es: Quiero medio kilo de fresas, por favor.
          ko: 딸기 반 킬로 주세요.
        native:
          es: Vale, pues medio kilo.
          ko: 좋아요, 그럼 반 킬로요.
          note_ko: 무엇을 살지 이미 말했으니 수량만 말해도 충분해요.
      - who: A
        textbook:
          es: Muy bien. ¿Algo más?
          ko: 네. 더 필요한 거 있어요?
        native:
          es: Medio kilo. ¿Qué más?
          ko: 반 킬로요. 또 뭐 드릴까요?
          note_ko: 상인은 수량을 되풀이해 확인하고 ¿qué más?로 이어 가요.
      - who: B
        textbook:
          es: Quiero dos plátanos y un racimo de uvas.
          ko: 바나나 두 개랑 포도 한 송이 주세요.
        native:
          es: ¿Me pones también dos plátanos y un racimo de uvas?
          ko: 바나나 두 개랑 포도 한 송이도 주실래요?
          note_ko: ¿me pones…?는 가게에서 주문할 때 가장 흔한 말이에요.
      - who: A
        textbook:
          es: Aquí tiene. Son seis euros con cincuenta.
          ko: 여기 있어요. 6유로 50센트예요.
        native:
          es: Aquí tienes. Seis cincuenta, ¿vale?
          ko: 여기요. 6유로 50이에요.
          note_ko: 값은 seis cincuenta처럼 euros를 빼고 말해요.
      - who: B
        textbook:
          es: ¿Puedo pagar con tarjeta?
          ko: 카드로 계산해도 돼요?
        native:
          es: ¿Con tarjeta puede ser?
          ko: 카드 돼요?
          note_ko: ¿puede ser?는 '그렇게 돼요?' 하고 가볍게 묻는 말이에요.
      - who: A
        textbook:
          es: Sí, claro. Muchas gracias. Adiós.
          ko: 네, 그럼요. 감사합니다. 안녕히 가세요.
        native:
          es: Sí, sin problema. ¡Venga, gracias, hasta luego!
          ko: 네, 그럼요. 자, 고마워요, 또 와요!
          note_ko: venga는 대화를 마무리할 때 '자, 그럼'처럼 써요.
  - id: d2
    title_es: La lista del gazpacho
    title_ko: 가스파초 장보기
    setting_ko: 바르셀로나 시장. 친구와 숙소에서 가스파초를 만들 채소를 골라요.
    roles:
      A: {es: Amiga, ko: 친구}
      B: {es: Yo, ko: 나}
    lines:
      - who: A
        textbook:
          es: Vamos a hacer gazpacho. ¿Qué necesitamos?
          ko: 가스파초 만들자. 뭐가 필요해?
        native:
          es: Venga, ¿hacemos gazpacho esta noche? ¿Qué hace falta?
          ko: 오늘 밤에 가스파초 만들까? 뭐가 있어야 하지?
          note_ko: hace falta는 '필요하다'. 말할 땐 necesitar보다 자주 써요.
      - who: B
        textbook:
          es: Necesitamos tomates, un pepino y un pimiento verde.
          ko: 토마토랑 오이 하나, 초록 피망 하나가 필요해.
        native:
          es: Pues tomates, un pepino, un pimiento verde...
          ko: 음, 토마토, 오이 하나, 초록 피망…
          note_ko: 목록을 말할 땐 동사 없이 pues로 시작해 쭉 늘어놓아요.
      - who: A
        textbook:
          es: ¿Cuántos tomates compramos?
          ko: 토마토는 몇 개 살까?
        native:
          es: ¿Y de tomates, cuánto cogemos?
          ko: 토마토는 얼마나 살까?
          note_ko: 스페인에선 '집다, 사다'의 뜻으로 coger를 아주 많이 써요.
      - who: B
        textbook:
          es: Compramos un kilo. Hoy están baratos.
          ko: 1킬로 사자. 오늘 싸네.
        native:
          es: Un kilo, que están tirados de precio.
          ko: 1킬로. 완전 거저야.
          note_ko: tirado de precio는 '거저나 다름없이 싸다'는 구어예요.
      - who: A
        textbook:
          es: ¿Y cebolla y ajo? ¿Tenemos?
          ko: 양파랑 마늘은? 있어?
        native:
          es: ¿Cebolla y ajo hay en el piso?
          ko: 양파랑 마늘은 숙소에 있나?
          note_ko: 스페인에선 아파트를 piso라고 해요. 빌린 숙소도 piso예요.
      - who: B
        textbook:
          es: No. Necesitamos una cebolla y una cabeza de ajo.
          ko: 아니. 양파 하나랑 마늘 한 통이 필요해.
        native:
          es: Qué va. Pilla una cebolla y una cabeza de ajo.
          ko: 아니, 없어. 양파 하나랑 마늘 한 통 집어.
          note_ko: qué va는 강하게 '아니'. pillar는 coger처럼 '집다'의 구어예요.
      - who: A
        textbook:
          es: Bien. ¿Compramos fruta también?
          ko: 좋아. 과일도 살까?
        native:
          es: Hecho. ¿Y de postre? ¿Pillamos una sandía?
          ko: 알았어. 디저트는? 수박 하나 살까?
          note_ko: de postre는 '디저트로'. 앞에서 나온 pillar를 또 써요.
      - who: B
        textbook:
          es: Una sandía es muy grande. Mejor media sandía.
          ko: 수박 한 통은 너무 커. 반 통이 나아.
        native:
          es: ¿Entera? Es enorme. Mejor media, ¿no?
          ko: 한 통? 엄청 커. 반 통이 낫지 않아?
          note_ko: 끝에 ¿no?를 붙여 '그렇지?' 하고 동의를 구해요.
readings:
  - id: r1
    title_es: En el mercado
    title_ko: 시장에서
    level: A1
    paragraphs:
      - es: Hoy es 7 de mayo y estoy en Barcelona. Por la mañana voy a un mercado muy grande. Hay mucha gente y muchos colores.
        ko: 오늘은 5월 7일, 저는 바르셀로나에 있어요. 아침에 아주 큰 시장에 가요. 사람도 많고 색깔도 정말 다양해요.
      - es: En los puestos hay fresas rojas, naranjas, plátanos y uvas. También hay verduras, como tomates, lechugas, pimientos, berenjenas y setas.
        ko: 가게마다 빨간 딸기, 오렌지, 바나나, 포도가 있어요. 토마토, 상추, 피망, 가지, 버섯 같은 채소도 있어요.
      - es: Compro medio kilo de fresas y dos manzanas. La vendedora me da una bolsa. Las fresas están muy dulces.
        ko: 딸기 반 킬로와 사과 두 개를 사요. 가게 주인이 봉지를 하나 줘요. 딸기가 정말 달아요.
    questions:
      - q_ko: 글쓴이는 무엇을 샀나요?
        choices_ko: [딸기와 사과, 수박과 멜론, 토마토와 양파]
        answer: 0
      - q_ko: 딸기 맛은 어땠나요?
        choices_ko: [시었어요, 아주 달았어요, 싱거웠어요]
        answer: 1
  - id: r2
    title_es: Cena en el piso
    title_ko: 숙소에서 먹는 저녁
    level: A2
    paragraphs:
      - es: Por la tarde vuelvo al piso con mi amiga. Traemos dos bolsas llenas, con un kilo de tomates, un pepino, un pimiento verde, una cebolla y una cabeza de ajo.
        ko: 오후에 친구랑 숙소로 돌아와요. 봉지 두 개가 가득해요. 토마토 1킬로, 오이 하나, 초록 피망 하나, 양파 하나, 마늘 한 통이에요.
      - es: Vamos a hacer gazpacho, una sopa fría de Andalucía. Ponemos las verduras en la batidora con pan, aceite de oliva, vinagre y sal.
        ko: 안달루시아의 차가운 수프, 가스파초를 만들 거예요. 채소를 빵, 올리브유, 식초, 소금과 함께 믹서에 넣어요.
      - es: Mientras el gazpacho está en la nevera, mi amiga corta media sandía. A las nueve cenamos en el balcón. ¡Qué rico!
        ko: 가스파초가 냉장고에서 차가워지는 동안 친구가 수박 반 통을 잘라요. 아홉 시에 발코니에서 저녁을 먹어요. 정말 맛있어요!
    questions:
      - q_ko: 가스파초는 어떤 음식인가요?
        choices_ko: [뜨거운 국, 차가운 수프, 과일 샐러드]
        answer: 1
      - q_ko: 가스파초에 넣지 않은 것은 무엇인가요?
        choices_ko: [오이, 수박, 마늘]
        answer: 1
      - q_ko: 두 사람은 어디에서 저녁을 먹었나요?
        choices_ko: [시장, 식당, 발코니]
        answer: 2
