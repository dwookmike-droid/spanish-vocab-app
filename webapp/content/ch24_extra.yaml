schema_version: 1
chapter: 24
dialogues:
  - id: d1
    title_es: En el Museu Faller
    title_ko: 파야스 박물관에서
    setting_ko: 5월 28일 발렌시아 파야스 박물관. 니놋 앞에서 안내원에게 축제를 물어요.
    roles:
      A: {es: Guía, ko: 안내원}
      B: {es: Visitante, ko: 관람객}
    lines:
      - who: A
        textbook:
          es: Hola, buenos días. Esto es el Museu Faller. Aquí están los ninots indultados.
          ko: 안녕하세요. 여기는 파야스 박물관이에요. 불에서 살아남은 니놋들이 모여 있어요.
        native:
          es: ¡Hola! Pasa, pasa. Aquí tienes los ninots que se salvan del fuego.
          ko: 안녕하세요! 들어오세요. 여기 있는 건 불에 타지 않고 살아남은 니놋들이에요.
          note_ko: pasa, pasa처럼 두 번 말하면 ‘어서 들어와요’ 하고 반기는 말이 돼요.
      - who: B
        textbook:
          es: ¿Qué es un ninot?
          ko: 니놋이 뭐예요?
        native:
          es: Perdona, ¿qué es un ninot exactamente?
          ko: 저기, 니놋이 정확히 뭐예요?
          note_ko: exactamente를 붙이면 ‘정확히 말하면’ 하고 더 자세히 묻는 말이 돼요.
      - who: A
        textbook:
          es: Es una figura de la falla. En marzo, la gente quema las fallas en la calle.
          ko: 파야를 이루는 인형이에요. 3월에 사람들이 거리에서 파야를 태워요.
        native:
          es: Son los muñecos de la falla. En marzo se queman todas, el diecinueve por la noche.
          ko: 파야에 붙은 인형들이에요. 3월 19일 밤에 파야를 전부 태워요.
          note_ko: 파야를 태우는 밤을 la cremà라고 해요. 발렌시아어에서 온 말이에요.
      - who: B
        textbook:
          es: ¿Todas? ¿Y estos ninots?
          ko: 전부요? 그럼 이 니놋들은요?
        native:
          es: ¿Todas? ¡Qué pena! ¿Y estos, entonces?
          ko: 전부요? 아깝다! 그럼 이건요?
          note_ko: ¡qué pena!는 ‘아깝다, 안타깝다’예요.
      - who: A
        textbook:
          es: Cada año la gente vota y salva del fuego a su ninot favorito. Ese ninot viene al museo.
          ko: 해마다 사람들이 투표해서 가장 좋아하는 니놋을 불에서 구해요. 그 니놋이 박물관에 와요.
        native:
          es: Cada año la gente vota a su favorito. El que gana se libra del fuego y acaba aquí.
          ko: 해마다 사람들이 마음에 드는 니놋에 투표해요. 이긴 니놋은 불을 피해서 여기로 와요.
          note_ko: librarse de는 ‘~을 면하다’예요. acabar aquí는 ‘결국 여기에 오다’예요.
      - who: B
        textbook:
          es: ¿Y qué es la mascletà?
          ko: 그럼 마스클레타는 뭐예요?
        native:
          es: ¿Y la mascletà? La he visto en un cartel.
          ko: 그럼 마스클레타는요? 포스터에서 봤어요.
          note_ko: la he visto는 ‘그걸 봤어요’예요. 스페인에서는 오늘 일을 이렇게 현재완료로 말해요.
      - who: A
        textbook:
          es: Es un espectáculo de petardos. Del uno al diecinueve de marzo hay una mascletà cada día, a las dos de la tarde.
          ko: 폭죽 공연이에요. 3월 1일부터 19일까지 날마다 오후 두 시에 마스클레타가 열려요.
        native:
          es: Petardos, mucho ruido... ¡y mucho humo! Del uno al diecinueve de marzo, a las dos, en la plaza del Ayuntamiento.
          ko: 폭죽에 엄청난 소리… 연기도 엄청나요! 3월 1일부터 19일까지 두 시에 시청 광장에서 해요.
          note_ko: a las dos는 오후 두 시예요. 스페인에서는 점심 무렵이에요.
      - who: B
        textbook:
          es: Entonces tengo que volver en marzo.
          ko: 그럼 3월에 다시 와야겠네요.
        native:
          es: Pues nada, tendré que volver en marzo.
          ko: 그럼 뭐, 3월에 다시 와야겠어요.
          note_ko: tendré que는 ‘~해야겠어요’ 하고 앞으로 할 일을 말해요.
      - who: A
        textbook:
          es: Sí, venga en marzo. Pero traiga tapones para los oídos.
          ko: 네, 3월에 오세요. 그런데 귀마개는 꼭 가져오세요.
        native:
          es: ¡Claro que sí! Y tráete tapones para los oídos, que la mascletà suena muy fuerte.
          ko: 그럼요! 귀마개도 챙겨 와요. 마스클레타 소리가 정말 크거든요.
          note_ko: tráete는 ‘(네 것을) 챙겨 와’예요. que는 이유를 덧붙여요.
      - who: B
        textbook:
          es: Muchas gracias por la explicación.
          ko: 설명해 주셔서 고맙습니다.
        native:
          es: ¡Muchas gracias, de verdad! Me ha encantado.
          ko: 정말 고마워요! 너무 좋았어요.
          note_ko: me ha encantado는 ‘정말 좋았어요’예요. 방금 끝난 일이라 현재완료를 써요.
  - id: d2
    title_es: La última cena del viaje
    title_ko: 여행 마지막 저녁
    setting_ko: 발렌시아의 식당. 여행 마지막 밤, 이곳에 사는 친구와 저녁을 먹어요.
    roles:
      A: {es: Amigo, ko: 친구}
      B: {es: Turista, ko: 여행자}
    lines:
      - who: A
        textbook:
          es: Es la última noche del viaje. ¿Te gusta València?
          ko: 여행 마지막 밤이네. 발렌시아 마음에 들어?
        native:
          es: Bueno, última cena del viaje. ¿Qué tal València?
          ko: 자, 여행 마지막 저녁이네. 발렌시아 어때?
          note_ko: ¿qué tal…?는 ‘…어때?’ 하고 가볍게 묻는 말이에요.
      - who: B
        textbook:
          es: Me gusta mucho. Pero no he visto las Fallas.
          ko: 정말 좋아. 근데 파야스는 못 봤어.
        native:
          es: Me encanta. Lo único es que me he perdido las Fallas.
          ko: 너무 좋아. 딱 하나 아쉬운 건 파야스를 놓친 거야.
          note_ko: lo único es que…는 ‘딱 하나 아쉬운 건’이에요. perderse는 ‘놓치다’예요.
      - who: A
        textbook:
          es: En junio hay otra fiesta, la noche de San Juan.
          ko: 6월에는 다른 축제도 있어. 산 후안의 밤이야.
        native:
          es: Bueno, en junio tienes San Juan. La noche del veintitrés todo el mundo va a la playa.
          ko: 뭐, 6월엔 산 후안이 있잖아. 23일 밤에는 다들 해변에 가.
          note_ko: todo el mundo는 ‘온 세상’이 아니라 ‘다들, 모두’라는 뜻이에요.
      - who: B
        textbook:
          es: ¿Qué se hace en la playa?
          ko: 해변에서 뭘 해?
        native:
          es: ¿Y qué se hace allí?
          ko: 거기서 뭐 하는데?
          note_ko: ¿qué se hace?는 ‘(보통) 뭘 해?’ 하고 사람들이 하는 일을 물어요.
      - who: A
        textbook:
          es: Hay música y mucha gente. En algunas zonas hay hogueras. A las doce, la gente salta las olas.
          ko: 음악이 있고 사람이 많아. 모닥불을 피우는 곳도 있어. 열두 시가 되면 사람들이 파도를 뛰어넘어.
        native:
          es: Pues música, cena en la arena, alguna hoguera... y a las doce, a saltar olas.
          ko: 음악 듣고, 모래밭에서 저녁 먹고, 모닥불도 좀 피우고… 열두 시엔 파도 넘기를 해.
          note_ko: a + 동사원형은 ‘자, ~하자’ 같은 느낌을 줘요.
      - who: B
        textbook:
          es: ¡Qué bonito! ¿Y en verano hay más fiestas?
          ko: 멋있다! 여름에는 축제가 더 있어?
        native:
          es: ¡Qué guay! ¿Y en verano qué más hay?
          ko: 멋지다! 여름엔 또 뭐 있어?
          note_ko: guay는 스페인에서 ‘멋지다, 좋다’라는 뜻으로 많이 써요.
      - who: A
        textbook:
          es: Sí. En verano muchos barrios hacen verbenas por la noche, con farolillos y una banda de música.
          ko: 응. 여름에는 동네마다 밤 축제를 많이 해. 종이 등을 달고 악단도 불러.
        native:
          es: Uf, un montón. Muchos barrios tienen su verbena, con farolillos, una banda y baile hasta las tantas.
          ko: 와, 엄청 많아. 동네마다 밤 축제가 있어. 종이 등에 악단에, 늦게까지 춤도 추고.
          note_ko: hasta las tantas는 ‘아주 늦게까지’라는 구어예요.
      - who: B
        textbook:
          es: Entonces tengo que volver en marzo o en verano.
          ko: 그럼 3월이나 여름에 다시 와야겠다.
        native:
          es: Vale, me lo apunto. Vuelvo en marzo... ¡o en junio!
          ko: 좋아, 기억해 둘게. 3월에 다시 올게… 아니면 6월에!
          note_ko: me lo apunto는 ‘적어 둘게, 기억해 둘게’예요.
      - who: A
        textbook:
          es: Muy bien. Brindamos por el viaje.
          ko: 좋아. 여행을 위해 건배하자.
        native:
          es: ¡Eso! Venga, un brindis. ¡Por el viaje!
          ko: 그거야! 자, 건배하자. 여행을 위하여!
          note_ko: 건배할 때 ¡por…!라고 하면 ‘…을 위하여!’예요.
      - who: B
        textbook:
          es: ¡Por el viaje! Y hasta pronto, València.
          ko: 여행을 위하여! 그리고 발렌시아, 또 만나.
        native:
          es: ¡Por el viaje! ¡Hasta pronto, València!
          ko: 여행을 위하여! 발렌시아, 또 만나!
          note_ko: hasta pronto는 ‘곧 다시 만나요’라는 인사예요.
readings:
  - id: r1
    title_es: El último día del viaje
    title_ko: 여행 마지막 날
    level: A1
    paragraphs:
      - es: Hoy es 28 de mayo, el último día del viaje. Estoy en València y voy al Museu Faller.
        ko: 오늘은 5월 28일, 여행 마지막 날이에요. 저는 발렌시아에 있고, 파야스 박물관에 가요.
      - es: En el museo hay muchos ninots. Son figuras grandes y pequeñas, de muchos colores. Algunas son muy divertidas. También hay carteles de las Fallas de otros años.
        ko: 박물관에는 니놋이 많아요. 크고 작은 인형들이 알록달록해요. 아주 웃긴 것도 있어요. 지난 파야스 포스터도 걸려 있어요.
      - es: Las Fallas son en marzo, del 15 al 19. Hay música, petardos, flores y fuego. Yo no las he visto, pero en el museo veo un poco de la fiesta.
        ko: 파야스는 3월 15일부터 19일까지 열려요. 음악, 폭죽, 꽃, 불이 가득해요. 저는 파야스를 직접 보지 못했지만 박물관에서 축제를 조금 맛봐요.
    questions:
      - q_ko: 파야스는 언제 열리나요?
        choices_ko: [5월, 3월, 7월]
        answer: 1
      - q_ko: 박물관에는 니놋 말고 무엇이 있나요?
        choices_ko: [지난 파야스 포스터, 폭죽, 꽃]
        answer: 0
      - q_ko: 글쓴이는 파야스를 직접 봤나요?
        choices_ko: ["네, 작년에 봤어요", "네, 오늘 봤어요", "아니요, 못 봤어요"]
        answer: 2
  - id: r2
    title_es: Cinco días de marzo
    title_ko: 3월의 닷새
    level: A2
    paragraphs:
      - es: Las Fallas duran varios días de marzo, pero los más importantes son del 15 al 19. Muchos barrios construyen su falla, con muchos ninots, y la ponen en la calle.
        ko: 파야스는 3월에 여러 날 이어지지만, 가장 중요한 날은 15일부터 19일까지예요. 여러 동네가 니놋을 잔뜩 붙인 파야를 만들어 거리에 세워요.
      - es: El 17 y el 18 hay una ofrenda de flores a la Virgen. Falleras y falleros desfilan con sus trajes y llevan flores a la plaza de la Virgen.
        ko: 17일과 18일에는 성모에게 꽃을 바치는 봉헌이 있어요. 파야 축제에 참가하는 사람들이 전통 의상을 입고 행진하며 성모 광장으로 꽃을 가져가요.
      - es: La última noche, el 19, es la cremà y se queman las fallas. Solo se salvan los ninots indultados, que van al museo. Por eso hoy, en mayo, puedo verlos aquí.
        ko: 마지막 날인 19일 밤은 크레마예요. 파야를 모두 태워요. 투표로 살아남은 니놋만 불을 피해 박물관으로 가요. 그래서 5월인 오늘도 여기서 볼 수 있어요.
    questions:
      - q_ko: 꽃 봉헌은 언제 열리나요?
        choices_ko: [3월 19일, 3월 17일과 18일, 5월 28일]
        answer: 1
      - q_ko: 크레마는 무엇인가요?
        choices_ko: [파야를 태우는 밤, 꽃을 바치는 행사, 낮에 하는 폭죽 공연]
        answer: 0
      - q_ko: 글쓴이는 왜 5월에도 니놋을 볼 수 있나요?
        choices_ko: [5월에 축제가 또 열려서, 니놋을 새로 만들어서, 살아남은 니놋이 박물관에 있어서]
        answer: 2
glossary:
  "a": {lemma: "a", ko: "~에, ~(으)로, ~에게", en: "to", pron: "아"}
  "acaba": {lemma: "acabar", ko: "결국 ~하게 되다(그것은)", en: "ends up", pron: "아**까**바"}
  "al": {lemma: "a + el", ko: "~에게, ~(으)로(a+el)", en: "to the", pron: "알"}
  "alguna": {lemma: "alguno", ko: "어떤, 혹시 하나라도", en: "some, any", pron: "알**구**나"}
  "algunas": {lemma: "alguno", ko: "어떤, 몇몇(여성 복수)", en: "some", pron: "알**구**나스"}
  "allí": {lemma: "allí", ko: "거기, 저기", en: "there", pron: "아**이**"}
  "apunto": {lemma: "apuntar", ko: "적어 두다(나는), me lo apunto 기억해 둘게", en: "I note down", pron: "아**뿐**또"}
  "aquí": {lemma: "aquí", ko: "여기", en: "here", pron: "아**끼**"}
  "arena": {lemma: "arena", ko: "모래, 모래밭", en: "sand", pron: "아**레**나"}
  "ayuntamiento": {lemma: "ayuntamiento", ko: "시청(plaza del Ayuntamiento 시청 광장)", en: "town hall", pron: "아윤따**미엔**또"}
  "año": {lemma: "año", ko: "해, 년", en: "year", pron: "**아**뇨"}
  "años": {lemma: "año", ko: "해, 년(복수)", en: "years", pron: "**아**뇨스"}
  "baile": {lemma: "baile", ko: "춤", en: "dancing", pron: "**바일**레"}
  "barrios": {lemma: "barrio", ko: "동네(복수)", en: "neighbourhoods", pron: "**바**리오스"}
  "bien": {lemma: "bien", ko: "잘, 좋게", en: "well", pron: "**비엔**"}
  "bonito": {lemma: "bonito", ko: "예쁜", en: "pretty", pron: "보**니**또"}
  "brindamos": {lemma: "brindar", ko: "건배하다(우리는)", en: "we toast", pron: "브린**다**모스"}
  "brindis": {lemma: "brindis", ko: "건배", en: "toast", pron: "**브린**디스"}
  "bueno": {lemma: "bueno", ko: "자, 음(말을 꺼낼 때)", en: "well", pron: "**부에**노"}
  "buenos": {lemma: "bueno", ko: "좋은, 맛있는(남성 복수)", en: "good, tasty", pron: "**부에**노스"}
  "cada": {lemma: "cada", ko: "각각의", en: "each", pron: "**까**다"}
  "calle": {lemma: "calle", ko: "길, 거리", en: "street", pron: "**까**예"}
  "cartel": {lemma: "cartel", ko: "포스터", en: "poster", pron: "까르**뗄**"}
  "carteles": {lemma: "cartel", ko: "포스터(복수)", en: "posters", pron: "까르**뗄**레스"}
  "claro": {lemma: "claro", ko: "물론이죠", en: "of course", pron: "**끌라**로"}
  "colores": {lemma: "color", ko: "색(복수)", en: "colours", pron: "꼴**로**레스"}
  "con": {lemma: "con", ko: "~와 함께, ~을 넣은", en: "with", pron: "꼰"}
  "construyen": {lemma: "construir", ko: "만들다, 세우다(그들은)", en: "they build", pron: "꼰스**뜨루**옌"}
