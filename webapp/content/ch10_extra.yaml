schema_version: 1
chapter: 10
dialogues:
  - id: d1
    title_es: ¿Hay un cajero por aquí?
    title_ko: 이 근처에 현금인출기 있어요?
    setting_ko: 바르셀로나 에이샴플레의 거리. 지나가던 나이 든 아저씨에게 길을 물어요.
    roles:
      A: {es: Señor, ko: 아저씨}
      B: {es: Turista, ko: 여행자}
    lines:
      - who: B
        textbook:
          es: Perdone, ¿hay un cajero por aquí?
          ko: 실례합니다, 이 근처에 현금인출기 있어요?
        native:
          es: Perdone, ¿sabe si hay algún cajero por aquí cerca?
          ko: 저기요, 이 근처에 현금인출기 있는지 아세요?
          note_ko: ¿sabe si…?(…인지 아세요?)를 앞에 붙이면 더 부드럽게 들려요.
      - who: A
        textbook:
          es: Sí. Hay un cajero en la avenida, al lado del banco.
          ko: 네. 대로에 있는 은행 옆에 현금인출기가 있어요.
        native:
          es: Sí, sí. Mire, en la avenida tiene uno, justo al lado del banco.
          ko: 네, 있어요. 보세요, 대로에 하나 있어요. 은행 바로 옆이에요.
          note_ko: tiene uno는 ‘(가시면) 하나 있어요’라는 말투예요. justo는 ‘바로’예요.
      - who: B
        textbook:
          es: ¿Está lejos?
          ko: 멀어요?
        native:
          es: ¿Y eso queda muy lejos?
          ko: 거기 많이 멀어요?
          note_ko: quedar는 장소가 어디에 있는지, 얼마나 먼지 말할 때 많이 써요.
      - who: A
        textbook:
          es: No, está muy cerca. Baje por esta calle y gire a la derecha en la segunda esquina.
          ko: 아니요, 아주 가까워요. 이 길로 내려가서 두 번째 모퉁이에서 오른쪽으로 도세요.
        native:
          es: Qué va, está a dos minutos. Baje por esta calle y, en la segunda esquina, a la derecha.
          ko: 아니요, 2분 거리예요. 이 길로 내려가서 두 번째 모퉁이에서 오른쪽이요.
          note_ko: qué va는 ‘아니에요, 전혀요’예요. 길을 알려 줄 때는 gire를 빼기도 해요.
      - who: B
        textbook:
          es: ¿En la esquina del semáforo?
          ko: 신호등 있는 모퉁이요?
        native:
          es: ¿Donde está el semáforo?
          ko: 신호등 있는 데요?
          note_ko: 악센트 없는 donde는 ‘~하는 곳’이에요. ‘어디’를 묻는 dónde와 달라요.
      - who: A
        textbook:
          es: Sí. Cruce por el paso de cebra. El banco está enfrente.
          ko: 네. 횡단보도로 건너세요. 은행은 맞은편에 있어요.
        native:
          es: Eso. Cruce en el paso de cebra y lo tiene enfrente.
          ko: 맞아요. 횡단보도에서 건너면 바로 맞은편에 있어요.
          note_ko: eso는 ‘맞아요, 바로 그거예요’라는 맞장구예요. lo tiene enfrente는 ‘맞은편에 있어요’예요.
      - who: B
        textbook:
          es: Muchas gracias. ¿Y hay una farmacia cerca?
          ko: 고맙습니다. 그리고 근처에 약국도 있어요?
        native:
          es: Genial, gracias. Ah, ¿y una farmacia?
          ko: 좋아요, 고마워요. 아, 약국은요?
          note_ko: 앞 질문에 이어서 묻는 거라 명사만 말해도 뜻이 통해요.
      - who: A
        textbook:
          es: Sí, hay una en la plaza, enfrente de la iglesia.
          ko: 네, 광장에 하나 있어요. 성당 맞은편이에요.
        native:
          es: En la plaza hay una, enfrente de la iglesia. La verá por la cruz verde.
          ko: 광장에 하나 있어요. 성당 맞은편이에요. 초록 십자가 보면 알 거예요.
          note_ko: 스페인 약국은 대개 초록 십자 간판을 달고 있어요. verá는 ‘보실 거예요’예요.
      - who: B
        textbook:
          es: Muchas gracias. Adiós.
          ko: 정말 고맙습니다. 안녕히 계세요.
        native:
          es: ¡Muchísimas gracias!
          ko: 정말 정말 고마워요!
          note_ko: muchísimas는 muchas에 ‘아주’를 더한 말이에요.
      - who: A
        textbook:
          es: De nada.
          ko: 천만에요.
        native:
          es: De nada. ¡Que disfrute de Barcelona!
          ko: 별말씀을요. 바르셀로나에서 즐겁게 지내세요!
          note_ko: que 뒤에 접속법(disfrute)을 쓰면 ‘~하시길’ 하고 바라는 말이 돼요.
  - id: d2
    title_es: Quedar con una amiga
    title_ko: 친구와 만나기로 했는데
    setting_ko: 바르셀로나에 사는 친구 마르타와 통화해요. 시장 앞에서 만나기로 했는데 길을 헤매요.
    roles:
      A: {es: Marta, ko: 마르타}
      B: {es: Turista, ko: 여행자}
    lines:
      - who: A
        textbook:
          es: Hola. ¿Dónde estás?
          ko: 안녕. 너 어디야?
        native:
          es: ¡Oye! ¿Dónde andas?
          ko: 야! 어디쯤이야?
          note_ko: ¿dónde andas?는 친구끼리 ‘어디쯤이야?’ 하고 묻는 말이에요.
      - who: B
        textbook:
          es: Estoy en una plaza pequeña. Hay una iglesia y muchos balcones.
          ko: 작은 광장에 있어. 성당이 하나 있고 발코니가 많아.
        native:
          es: Pues no sé… En una plaza pequeñita, con una iglesia y balcones por todos lados.
          ko: 글쎄, 잘 모르겠어… 조그만 광장인데, 성당이 있고 사방에 발코니야.
          note_ko: -ito, -ita를 붙이면 ‘조그만’ 느낌이 나요. por todos lados는 ‘사방에’예요.
      - who: A
        textbook:
          es: ¿Cómo se llama la plaza?
          ko: 그 광장 이름이 뭐야?
        native:
          es: Vale, ¿y cómo se llama? Mira el nombre en la esquina.
          ko: 알았어, 이름이 뭔데? 모퉁이에 있는 이름 좀 봐.
          note_ko: 길과 광장 이름 표지판은 보통 건물 모퉁이 벽에 붙어 있어요.
      - who: B
        textbook:
          es: No veo el nombre. Pero delante hay una farmacia y un banco.
          ko: 이름은 안 보여. 그런데 앞에 약국이랑 은행이 있어.
        native:
          es: No lo veo, la verdad. Pero tengo una farmacia delante y un cajero al lado.
          ko: 솔직히 안 보여. 근데 앞에 약국이 있고 옆에 현금인출기가 있어.
          note_ko: la verdad를 문장 끝에 붙이면 ‘솔직히’라는 뜻이 돼요.
      - who: A
        textbook:
          es: Bien. ¿Ves el mercado? Está al final de la calle.
          ko: 좋아. 시장 보여? 길 끝에 있어.
        native:
          es: Vale. ¿Y ves un mercado grande al fondo de la calle?
          ko: 알았어. 그럼 길 끝 쪽에 큰 시장 보여?
          note_ko: al fondo de는 ‘~ 끝 쪽에, 안쪽에’예요.
      - who: B
        textbook:
          es: Sí, lo veo. Hay mucha gente en la puerta.
          ko: 응, 보여. 입구에 사람이 많아.
        native:
          es: ¡Sí! Uf, hay un montón de gente en la puerta.
          ko: 응! 와, 입구에 사람 엄청 많다.
          note_ko: un montón de는 ‘엄청 많은’이에요. 말할 때 아주 흔해요.
      - who: A
        textbook:
          es: Bien. Camina hacia el mercado. Yo estoy en la esquina, delante de la tienda de flores.
          ko: 좋아. 시장 쪽으로 걸어와. 나는 꽃집 앞 모퉁이에 있어.
        native:
          es: Pues ven hacia allí. Estoy en la esquina, delante de la floristería.
          ko: 그럼 그쪽으로 와. 나 모퉁이에 있어, 꽃집 앞에.
          note_ko: ven은 venir(오다)의 tú 명령이에요. floristería는 ‘꽃집’이에요.
      - who: B
        textbook:
          es: Vale. Cruzo la calle y llego en cinco minutos.
          ko: 알았어. 길 건너서 5분 안에 갈게.
        native:
          es: Vale, cruzo por el paso de cebra y voy. ¡Dame cinco minutos!
          ko: 알았어, 횡단보도로 건너서 갈게. 5분만 줘!
          note_ko: dame cinco minutos는 ‘5분만 줘’예요. 조금 늦을 때 자주 해요.
      - who: A
        textbook:
          es: Muy bien. Hasta ahora.
          ko: 좋아. 이따 봐.
        native:
          es: Venga, te espero. ¡Hasta ahora!
          ko: 그래, 기다릴게. 좀 있다 봐!
          note_ko: hasta ahora는 곧 다시 만날 사람에게 하는 인사예요.
readings:
  - id: r1
    title_es: Un paseo por el Eixample
    title_ko: 에이샴플레 산책
    level: A1
    paragraphs:
      - es: Hoy es 8 de mayo y estoy en Barcelona. Por la mañana camino por el Eixample. Las calles son largas y rectas, y los edificios tienen balcones muy bonitos.
        ko: 오늘은 5월 8일, 저는 바르셀로나에 있어요. 오전에 에이샴플레를 걸어요. 길은 길고 곧게 뻗어 있고, 건물에는 아주 예쁜 발코니가 있어요.
      - es: Aquí las esquinas están cortadas, y por eso los cruces parecen pequeñas plazas. En cada esquina hay semáforos y pasos de cebra. Espero en la acera y cruzo con el semáforo en verde.
        ko: 여기는 모퉁이가 비스듬히 잘려 있어서 교차로가 작은 광장처럼 보여요. 모퉁이마다 신호등과 횡단보도가 있어요. 인도에서 기다렸다가 초록불에 건너요.
      - es: Al mediodía entro en un mercado del barrio. Compro fruta y agua. Después voy a un parque y como en un banco, a la sombra.
        ko: 점심때 동네 시장에 들어가요. 과일과 물을 사요. 그다음 공원에 가서 그늘에 있는 벤치에서 먹어요.
    questions:
      - q_ko: 에이샴플레의 모퉁이는 어떻게 생겼나요?
        choices_ko: [비스듬히 잘려 있다, 아주 좁다, 계단이 있다]
        answer: 0
      - q_ko: 글쓴이는 어디에서 점심을 먹었나요?
        choices_ko: [시장 안 식당, 공원 벤치, 호텔 발코니]
        answer: 1
      - q_ko: 이 글에서 banco는 무슨 뜻인가요?
        choices_ko: [은행, 벤치, 다리]
        answer: 1
  - id: r2
    title_es: Una tarde en el barrio Gótico
    title_ko: 고딕 지구에서 보낸 오후
    level: A2
    paragraphs:
      - es: Por la tarde voy al barrio Gótico. Las calles son estrechas y hay muchas tiendas pequeñas. En una calle veo un puente de piedra entre dos edificios. Todo el mundo le hace fotos.
        ko: 오후에는 고딕 지구에 가요. 길이 좁고 작은 가게가 많아요. 어느 길에서 두 건물 사이에 걸린 돌다리를 봐요. 다들 그 다리 사진을 찍어요.
      - es: Necesito dinero, así que busco un cajero. Encuentro uno en una esquina, al lado de un banco. Después llego a una plaza grande. A un lado está el ayuntamiento de la ciudad.
        ko: 돈이 필요해서 현금인출기를 찾아요. 어느 모퉁이에서 은행 옆에 있는 걸 찾아요. 그다음 넓은 광장에 도착해요. 광장 한쪽에 시청이 있어요.
      - es: Al volver, me duele un poco la cabeza. Entro en una farmacia con una cruz verde. La farmacéutica me da unas pastillas y me lo explica todo despacio. ¡Qué amable!
        ko: 돌아오는 길에 머리가 조금 아파요. 초록 십자가가 있는 약국에 들어가요. 약사가 알약을 주고 모든 걸 천천히 설명해 줘요. 정말 친절해요!
    questions:
      - q_ko: 시청은 어디에 있나요?
        choices_ko: [시장 안, 넓은 광장 한쪽, 공원 옆]
        answer: 1
      - q_ko: 글쓴이는 왜 약국에 갔나요?
        choices_ko: [머리가 조금 아파서, 물을 사려고, 길을 물으려고]
        answer: 0
