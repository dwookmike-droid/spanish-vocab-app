word_order:
  tema: Me gusta, me gustan
  tema_sub_ko: 좋아하다 — 좋아하는 것이 주어
  point_ko: gustar · 좋아하는 것이 주어, 동사 뒤에 와요
  lead_ko: gustar는 ‘…이 내 마음에 든다’는 짜임이에요. 좋아하는 것이 주어라서 동사 모양도 그쪽에 맞춰요.
  sentences:
  - es: Me gustan las croquetas.
    en: I like croquettes.
    ko: 나는 크로케타를 좋아해요.
    note_ko: 주어 croquetas가 복수라서 gustan
    tokens:
    - es: Me
      gloss_ko: 나에게
    - es: gustan
      gloss_ko: 마음에 든다
    - es: las
      gloss_ko: 그
    - es: croquetas
      gloss_ko: 크로케타들
    highlight: [1, 3]
  - es: Me gusta el queso.
    en: I like cheese.
    ko: 나는 치즈를 좋아해요.
    note_ko: 주어 queso가 단수라서 gusta
    tokens:
    - es: Me
      gloss_ko: 나에게
    - es: gusta
      gloss_ko: 마음에 든다
    - es: el queso
      gloss_ko: 그 치즈
    highlight: [1, 2]
  - es: No me gustan las gambas.
    en: I don't like prawns.
    ko: 나는 새우를 안 좋아해요.
    note_ko: no는 me 앞에 놓아요
    tokens:
    - es: 'No'
      gloss_ko: 안
    - es: me
      gloss_ko: 나에게
    - es: gustan
      gloss_ko: 마음에 든다
    - es: las gambas
      gloss_ko: 그 새우들
    highlight: [0, 2, 3]
  - es: ¿Te gusta el jamón?
    en: Do you like cured ham?
    ko: 하몬 좋아해요?
    note_ko: te는 ‘너에게’ · 물을 때도 순서가 같아요
    tokens:
    - es: ¿Te
      gloss_ko: 너에게
    - es: gusta
      gloss_ko: 마음에 든다
    - es: el jamón?
      gloss_ko: 그 하몬
    highlight: [1, 2]
  - es: A mí me gusta el pulpo.
    en: I, for one, like octopus.
    ko: 저는 문어가 좋아요.
    note_ko: a mí를 앞에 두면 ‘나는’을 내세우는 말이 돼요
    tokens:
    - es: A mí
      gloss_ko: 나에게는
    - es: me
      gloss_ko: 나에게
    - es: gusta
      gloss_ko: 마음에 든다
    - es: el pulpo
      gloss_ko: 그 문어
    highlight: [0, 2, 3]
  patterns:
  - title_ko: gusta + 단수
    items:
    - es: Me gusta el vino.
      en: I like wine.
      ko: 와인을 좋아해요.
    - es: Me gusta la tortilla.
      en: I like Spanish omelette.
      ko: 오믈렛을 좋아해요.
    - es: Me gusta el pan.
      en: I like bread.
      ko: 빵을 좋아해요.
  - title_ko: gustan + 복수
    items:
    - es: Me gustan las aceitunas.
      en: I like olives.
      ko: 올리브를 좋아해요.
    - es: Me gustan los calamares.
      en: I like squid.
      ko: 오징어를 좋아해요.
    - es: Me gustan las gambas.
      en: I like prawns.
      ko: 새우를 좋아해요.
  - title_ko: 누가 좋아하나요
    items:
    - es: me gusta
      en: I like
      ko: 나는 좋아해요
    - es: te gusta
      en: you like
      ko: 너는 좋아해
    - es: le gusta
      en: he, she, you (formal) like
      ko: 그·그녀는 좋아해요
    - es: nos gusta
      en: we like
      ko: 우리는 좋아해요
  contrast:
    title_ko: 같은 말, 다른 강조
    items:
    - es: Me gustan las tapas.
      label_ko: 가장 흔한 순서
      ko: 나는 타파를 좋아해요.
    - es: Las tapas me gustan.
      label_ko: 타파를 앞세운 말
      ko: 타파는 좋아해요.
    - es: A mí me gustan las tapas.
      label_ko: ‘나는’을 내세운 말
      ko: 저는 타파를 좋아해요.
  subject:
    title_ko: 짧게 주고받기
    items:
    - es: ¿Te gusta?
      ko: 마음에 들어요?
    - es: Sí, me gusta mucho.
      ko: 네, 정말 좋아요.
    - es: A mí también.
      ko: 저도요.
    - es: A mí no.
      ko: 저는 별로예요.
  extra_notes_ko:
  - me는 주어가 아니라 ‘나에게’예요. 좋아하는 대상이 주어라서 하나면 gusta, 여럿이면 gustan을 쓰고, 그 대상은 보통 동사 뒤에 와요.
  - 주어에는 정관사를 붙여요. Me gusta el queso처럼요. 영어 I like cheese를 그대로 옮기면 관사를 빠뜨리기 쉬워요.
practice:
