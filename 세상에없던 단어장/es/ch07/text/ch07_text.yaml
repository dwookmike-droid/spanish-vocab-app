- tiles: ['jamón?', ¿Te, el, gusta]
  answer: ¿Te gusta el jamón?
  ko: 하몬 좋아해요?
- tiles: [ración, 'pulpo,', favor, Una, de, por]
  answer: Una ración de pulpo, por favor.
  ko: 문어 한 접시 주세요.
