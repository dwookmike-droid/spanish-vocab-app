scenes:
- es: ¿Qué me recomienda?
  en: What do you recommend?
  ko: 뭘 추천하세요?
- es: Una caña, por favor.
  en: A small beer, please.
  ko: 작은 생맥주 한 잔 주세요.
- es: ¿Cuánto cuesta este pincho?
  en: How much is this pintxo?
  ko: 이 핀초 얼마예요?
- es: ¿Puedo coger uno de la barra?
  en: Can I take one from the bar?
  ko: 카운터에서 하나 집어도 돼요?
- es: Me gusta mucho este bar.
  en: I really like this bar.
  ko: 이 바 정말 마음에 들어요.
- es: La cuenta, por favor.
  en: The bill, please.
  ko: 계산서 주세요.
extras:
  grammar_ko:
  - la tapa는 작은 안주, la ración은 여럿이 나눠 먹는 한 접시예요. 양이 다르니 주문할 때 구별해요.
  - 스페인 바에서 la caña는 작은 잔에 담은 생맥주예요. 주문할 때 자주 듣는 말이에요.
  - las aceitunas, las gambas, los calamares는 여럿을 함께 먹는 음식이라 복수로 자주 써요.
  - 바스크어 철자 tx는 ch와 소리가 같아요. 그래서 간판의 pintxo도 pincho처럼 읽어요.
  cognates:
  - es: la croqueta
    en: croquette
    note_ko: 둘 다 프랑스어 croquette에서 왔어요.
  - es: el vino
    en: wine
    note_ko: 둘 다 라틴어 vinum에서 왔어요.
  - es: el vermut
    en: vermouth
    note_ko: 둘 다 ‘쑥’을 뜻하는 독일어 Wermut에서 왔어요.
  - es: la servilleta
    en: serviette
    note_ko: 둘 다 프랑스어 serviette에서 왔어요.
  false_friend:
    es: la tapa
    en: tap
    note_ko: la tapa는 작은 안주이자 뚜껑이에요. 영어 tap(수도꼭지)은 el grifo라고 해요.
  fun_fact_ko: pincho는 pinchar(찌르다)에서 나온 말로, 꼬챙이도 pincho라고 해요.
