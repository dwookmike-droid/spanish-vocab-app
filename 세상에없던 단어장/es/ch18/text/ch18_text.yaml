extras:
  grammar_ko:
  - el águila는 여성 명사예요. 첫 a에 강세가 있어 단수에서만 el을 쓰고, 복수는 las águilas, 형용사도 여성형이에요.
  - la flor는 -r로 끝나도 여성, el árbol은 -l로 끝나고 남성이에요. 끝 글자로 알 수 없으니 관사까지 함께 외워요.
  - mejor와 peor 앞에는 más를 쓰지 않아요. más bueno보다 mejor가 흔하고, más mejor는 틀린 말이에요.
  - el olivo는 올리브나무이고, 그 열매는 la aceituna라고 해요.
  cognates:
  - es: la montaña
    en: mountain
    note_ko: 철자와 소리가 비슷해요.
  - es: la cascada
    en: cascade
    note_ko: 철자가 거의 같아요. 둘 다 이탈리아어 cascata에서 왔어요.
  - es: el valle
    en: valley
    note_ko: 철자가 비슷해요. ll은 ‘야’ 소리가 나요.
  false_friend:
    es: el campo
    en: camp
    note_ko: el campo는 들판이나 시골이에요. 캠핑장은 el camping이라고 해요.
  fun_fact_ko: 푸엔테 누에보는 ‘새 다리’라는 뜻이에요. 론다의 협곡 El Tajo 위에 놓여 있어요.
