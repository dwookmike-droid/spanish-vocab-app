word_order:
  tema: Más alto que
  tema_sub_ko: 비교 — más + 형용사 + que
  point_ko: '비교: más + 형용사 + que'
  lead_ko: ‘A가 B보다 더 ~하다’는 A + es + más + 형용사 + que + B 순서예요. 형용사는 A의 성·수에 맞춰요.
  sentences:
  - es: Esta montaña es más alta que esa.
    en: This mountain is higher than that one.
    ko: 이 산이 그 산보다 높아요.
    note_ko: más + 형용사 + que · montaña에 맞춰 alta
    tokens:
    - es: Esta montaña
      gloss_ko: 이 산
    - es: es
      gloss_ko: 이다
    - es: más alta
      gloss_ko: 더 높은
    - es: que
      gloss_ko: ~보다
    - es: esa
      gloss_ko: 그것
    highlight: [2, 3]
  - es: Este puente es más alto que aquel.
    en: This bridge is higher than that one.
    ko: 이 다리가 저 다리보다 높아요.
    note_ko: 남성 주어라 alto · aquel은 멀리 있는 저것
    tokens:
    - es: Este puente
      gloss_ko: 이 다리
    - es: es
      gloss_ko: 이다
    - es: más alto
      gloss_ko: 더 높은
    - es: que
      gloss_ko: ~보다
    - es: aquel
      gloss_ko: 저것
    highlight: [2, 3]
  - es: Estas rocas son más altas que esas.
    en: These rocks are higher than those.
    ko: 이 바위가 그 바위보다 높아요.
    note_ko: 복수 주어라 동사는 son, 형용사는 altas
    tokens:
    - es: Estas rocas
      gloss_ko: 이 바위들
    - es: son
