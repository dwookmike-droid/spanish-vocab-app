  - title_ko: 더 · 덜 · 똑같이
    items:
    - es: más alto que
      en: higher than
      ko: ~보다 더 높은
    - es: menos alto que
      en: less high than
      ko: ~보다 덜 높은
    - es: tan alto como
      en: as high as
      ko: ~만큼 높은
  - title_ko: más 없이 쓰는 말
    items:
    - es: bueno → mejor
      en: good → better
      ko: 좋은 → 더 좋은
    - es: malo → peor
      en: bad → worse
      ko: 나쁜 → 더 나쁜
  contrast:
    title_ko: 이것 · 그것 · 저것
    items:
    - es: Esta montaña es alta.
      label_ko: '내 가까이: esta'
      ko: 이 산은 높아요.
    - es: Esa montaña es alta.
      label_ko: '상대 가까이: esa'
      ko: 그 산은 높아요.
    - es: Aquella montaña es alta.
      label_ko: '멀리: aquella'
      ko: 저 산은 높아요.
  extra_notes_ko:
  - que 뒤의 명사를 다시 말하지 않을 때는 esa, aquel처럼 지시사만 남겨요. Esta montaña es más alta que esa montaña를 줄인 형태예요.
  - '‘가장 ~한’은 정관사 + 명사 + más + 형용사예요: la montaña más alta(가장 높은 산). 이때도 형용사는 명사 뒤에 와요.'
