scenes:
- es: Dos entradas, por favor.
  en: Two tickets, please.
  ko: 입장권 두 장 주세요.
- es: ¿Se pueden hacer fotos aquí?
  en: Can you take photos here?
  ko: 여기서 사진 찍어도 돼요?
- es: ¿Dónde se alquilan las audioguías?
  en: Where can I rent an audio guide?
  ko: 오디오 가이드는 어디서 빌려요?
- es: ¿Hay un plano del museo?
  en: Is there a museum floor plan?
  ko: 박물관 안내도 있어요?
- es: ¿Cuál es el horario del museo?
  en: What are the museum's hours?
  ko: 박물관 운영 시간이 어떻게 돼요?
extras:
  grammar_ko:
  - el cuadro는 벽에 건 그림 한 점이에요. la pintura는 회화라는 분야나 물감을 말할 때 많이 써요.
  - la guía는 안내 책자도, 여성 안내인도 돼요. 남성 안내인은 el guía라고 해요.
  - el guarda는 -a로 끝나도 남성 관사를 써요. 사람이 여성이면 la guarda예요.
  - la exposición처럼 -ción으로 끝나는 명사는 여성이고 복수는 exposiciones예요. 악센트 부호가 빠져요.
  cognates:
  - es: el museo
    en: museum
    note_ko: 둘 다 라틴어 museum에서 왔어요.
  - es: la escultura
    en: sculpture
    note_ko: 앞에 e가 붙고 -ura로 끝나요.
  - es: la exposición
    en: exposition
    note_ko: 영어 exhibition과 뜻이 같아요.
  - es: el pintor
    en: painter
    note_ko: pintar(그리다)에서 왔어요. -or는 사람을 나타내요.
  false_friend:
    es: la sala
    en: sale
    note_ko: la sala는 '방, 전시실'이에요. 할인 판매는 las rebajas라고 해요.
  fun_fact_ko: 벨라스케스의 「시녀들」(Las meninas)은 프라도 미술관에 있어요.
