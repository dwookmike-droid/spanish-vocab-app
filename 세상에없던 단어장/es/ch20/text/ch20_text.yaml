word_order:
  tema: La frase con se
  tema_sub_ko: 무인칭 se — 누가 하는지 말하지 않기
  point_ko: 무인칭·수동의 se
  lead_ko: 안내문은 누가 하는지 밝히지 않아요. 동사 앞에 se를 두면 '누구든, 일반적으로' 그렇다는 말이 돼요.
  sentences:
  - es: Se prohíbe tocar los cuadros.
    en: Touching the paintings is forbidden.
    ko: 그림을 만지면 안 돼요.
    note_ko: se + 3인칭 동사 · 안내문에 자주 나와요
    tokens:
    - es: Se
      gloss_ko: (누구든)
    - es: prohíbe
      gloss_ko: 금지한다
    - es: tocar
      gloss_ko: 만지기
    - es: los cuadros
      gloss_ko: 그 그림들
    highlight: [0]
  - es: Se venden entradas en la taquilla.
    en: Tickets are sold at the ticket office.
    ko: 입장권은 매표소에서 팔아요.
    note_ko: entradas가 복수라 동사도 venden
    tokens:
    - es: Se
      gloss_ko: (수동)
    - es: venden
      gloss_ko: 판다
    - es: entradas
      gloss_ko: 입장권들
    - es: en
      gloss_ko: ~에서
    - es: la taquilla
      gloss_ko: 그 매표소
    highlight: [0, 1]
  - es: No se puede tocar la escultura.
    en: You can't touch the sculpture.
    ko: 조각상은 만지면 안 돼요.
    note_ko: no는 se보다 앞에 · no + se + 동사
    tokens:
    - es: 'No'
      gloss_ko: 안
    - es: se
      gloss_ko: (누구든)
    - es: puede
      gloss_ko: 할 수 있다
    - es: tocar
      gloss_ko: 만지기
    - es: la escultura
      gloss_ko: 그 조각상
    highlight: [0, 1]
  - es: ¿Por dónde se entra a la sala?
    en: How do you get into the room?
    ko: 전시실은 어디로 들어가요?
    note_ko: 의문사 + se + 동사 · 주어 자리가 비어요
    tokens:
    - es: ¿Por dónde
      gloss_ko: 어디로
    - es: se
      gloss_ko: (누구든)
    - es: entra
      gloss_ko: 들어간다
    - es: a la sala?
      gloss_ko: 그 전시실로
    highlight: [1]
  patterns:
  - title_ko: 벽에서 보는 se 문구
    items:
    - es: Se prohíbe fumar.
      en: No smoking.
      ko: 금연이에요.
    - es: Se prohíbe entrar.
      en: No entry.
      ko: 출입 금지예요.
    - es: Se ruega silencio.
      en: Silence, please.
      ko: 조용히 해 주세요.
    - es: Se habla español.
      en: Spanish spoken here.
      ko: 스페인어를 써요.
  - title_ko: 단수와 복수
    items:
    - es: Se vende un cuadro.
      tag: 단수
      ko: 그림 한 점을 팔아요.
    - es: Se venden dos cuadros.
      tag: 복수
      ko: 그림 두 점을 팔아요.
    - es: Se alquila una audioguía.
      tag: 단수
      ko: 오디오 가이드를 빌려줘요.
    - es: Se venden entradas.
      tag: 복수
      ko: 입장권을 팔아요.
  - title_ko: se puede + 동사원형
    items:
    - es: Se puede entrar.
      lit: se · can · enter
      en: You can go in.
      ko: 들어가도 돼요.
    - es: No se puede fumar.
      lit: not · se · can · smoke
      en: You can't smoke.
      ko: 담배 피우면 안 돼요.
    - es: ¿Se puede pasar?
      lit: se · can · pass
      en: May I come through?
      ko: 지나가도 돼요?
  contrast:
    title_ko: 동사 수 맞추기
    items:
    - es: Se vende un plano.
      label_ko: 단수 명사 → 단수
      ko: 안내도를 팔아요.
    - es: Se venden planos.
      label_ko: 복수 명사 → 복수
      ko: 안내도들을 팔아요.
    - es: Se prohíbe tocar los cuadros.
      label_ko: 동사원형 앞 → 단수
      ko: 그림을 만지면 안 돼요.
  subject:
    title_ko: se와 사람 주어
    items:
    - es: Se abre a las diez.
      ko: 열 시에 열어요.
    - es: Abro a las diez.
      ko: 제가 열 시에 열어요.
    - es: El guarda abre a las diez.
      ko: 경비원이 열 시에 열어요.
  extra_notes_ko:
  - 이 se는 '자기 자신'이 아니에요. 말하는 사람이 행동한 사람을 굳이 밝히지 않을 때 써요. 그래서 표지판, 안내문, 규칙에 많이 보여요.
  - Se prohíbe 뒤에 동사원형이 오면 동사는 언제나 단수예요. 뒤에 los cuadros가 있어도 prohíbe 그대로 둬요. 금지하는 내용은 '만지기' 하나이기 때문이에요.
