  patterns:
  - title_ko: 명사 앞 · mi, tu, su
    items:
    - es: mi cama
      en: my bed
      ko: 내 침대
    - es: tu almohada
      en: your pillow
      ko: 네 베개
    - es: su maleta
      en: his, her suitcase
      ko: 그·그녀의 여행 가방
    - es: mis llaves
      en: my keys
      ko: 내 열쇠들
  - title_ko: 명사 뒤 · 성·수에 맞춘 mío
    items:
    - es: el armario mío
      tag: m
      ko: 내 옷장
    - es: la cama mía
      tag: f
      ko: 내 침대
    - es: los cajones míos
      tag: m pl
      ko: 내 서랍들
    - es: las llaves mías
      tag: f pl
      ko: 내 열쇠들
  contrast:
    title_ko: 같은 maleta, 다른 자리
    items:
    - es: Es mi maleta.
      label_ko: 명사 앞에 mi
      ko: 제 여행 가방이에요.
    - es: La maleta es mía.
      label_ko: es 뒤에 mía
      ko: 그 여행 가방은 제 거예요.
    - es: Es una maleta mía.
      label_ko: 명사 뒤에 mía
      ko: 제 여행 가방 중 하나예요.
  subject:
    title_ko: 누구 거예요?
    items:
    - es: ¿De quién es esta llave?
      ko: 이 열쇠 누구 거예요?
    - es: Es mía.
      ko: 제 거예요.
    - es: ¿Es tuya?
      ko: 네 거야?
  extra_notes_ko:
  - mi는 관사와 함께 쓰지 않아요. la mi cama는 틀린 말이에요. 일상에서 mío는 Esta cama es mía처럼 es 뒤에 가장 자주 나오고, 명사 뒤에 놓으면 ‘내 것’이라는 느낌이 더 또렷해져요.
  - 소유사는 가진 사람의 성별이 아니라 물건의 성·수에 맞춰요. 남자가 말해도 la cama mía, 여자가 말해도 el armario mío예요.
