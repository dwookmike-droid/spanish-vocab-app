  tema: Mi y mío
  tema_sub_ko: 소유 — mi는 앞에, mío는 뒤에
  point_ko: 소유사 · mi는 명사 앞, mío는 명사 뒤
  lead_ko: ‘내’를 말하는 자리는 두 곳이에요. 명사 앞에는 mi를 쓰고, 명사 뒤나 es 뒤에는 mío를 써요.
  sentences:
  - es: Mi cama. La cama mía.
