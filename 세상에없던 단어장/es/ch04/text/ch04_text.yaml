scenes:
- es: ¿Dónde está mi pijama?
  en: Where are my pyjamas?
  ko: 제 잠옷 어디 있어요?
- es: ¿Me despiertas a las ocho?
  en: Can you wake me at eight?
  ko: 8시에 깨워 줄래요?
- es: Apaga la luz, por favor.
  en: Turn off the light, please.
  ko: 불 좀 꺼 주세요.
- es: El enchufe no funciona.
  en: The socket doesn't work.
  ko: 콘센트가 안 돼요.
- es: ¿Tienes un cargador?
  en: Do you have a charger?
  ko: 충전기 있어요?
- es: Buenas noches, hasta mañana.
  en: Good night, see you tomorrow.
  ko: 잘 자요, 내일 봐요.
extras:
  grammar_ko:
  - el pijama는 -a로 끝나지만 스페인에서는 남성이에요. 중남미 일부에서는 la pijama라고 해요.
  - la llave, la luz는 끝 글자만 봐서는 성을 알 수 없어요. 관사와 함께 외워요.
  - la luz의 복수는 las luces예요. 끝의 -z는 복수가 되면 -ces로 바뀌어요.
  - las zapatillas는 한 켤레를 뜻해서 보통 복수로 말해요. 스페인에서는 운동화도 zapatillas라고 해요.
  cognates:
  - es: el armario
    en: armoire
    note_ko: 둘 다 라틴어 armarium에서 왔어요.
  - es: el balcón
    en: balcony
    note_ko: 둘 다 이탈리아어 balcone에서 왔어요.
  - es: la cómoda
    en: commode
    note_ko: 둘 다 프랑스어 commode에서 왔어요.
  - es: el pijama
    en: pyjamas
    note_ko: 힌디어에서 영어를 거쳐 스페인어로 들어온 말이에요.
  false_friend:
    es: la sábana
    en: savanna
    note_ko: la sábana는 침대 시트예요. 초원 savanna는 악센트 없이 la sabana라고 써요.
  fun_fact_ko: 톨레도는 옛 시가지 전체가 유네스코 세계유산이에요.
