word_order:
  tema: Un kilo de tomates
  tema_sub_ko: 수량 — 얼마만큼 + de + 무엇
  point_ko: 수량 + de + 명사
  lead_ko: 양을 말할 때는 수량이 먼저 오고 de를 거쳐 물건 이름이 와요. 한국어와 순서가 반대예요.
  sentences:
  - es: Un kilo de tomates, por favor.
    en: A kilo of tomatoes, please.
    ko: 토마토 1킬로 주세요.
    note_ko: 수량(un kilo) + de + 물건(tomates)
    tokens:
    - es: Un kilo
      gloss_ko: 1킬로
    - es: de
      gloss_ko: ~의
    - es: tomates,
      gloss_ko: 토마토들
    - es: por favor
      gloss_ko: 부탁합니다
    highlight: [0, 1]
  - es: Media docena de huevos, por favor.
    en: Half a dozen eggs, please.
    ko: 달걀 반 다스 주세요.
    note_ko: docena가 여성이라 media · 앞에 una는 안 붙여요
    tokens:
    - es: Media docena
      gloss_ko: 반 다스
    - es: de
      gloss_ko: ~의
    - es: huevos,
      gloss_ko: 달걀들
    - es: por favor
      gloss_ko: 부탁합니다
    highlight: [0, 1]
  - es: Quiero dos kilos de patatas.
    en: I'd like two kilos of potatoes.
    ko: 감자 2킬로 주세요.
    note_ko: 2킬로부터는 kilos · 물건도 복수로
    tokens:
    - es: Quiero
      gloss_ko: 원한다(나는)
    - es: dos kilos
      gloss_ko: 2킬로
    - es: de
      gloss_ko: ~의
    - es: patatas
      gloss_ko: 감자들
    highlight: [1, 2]
  - es: Hay una bolsa de cebollas.
    en: There's a bag of onions.
    ko: 양파 한 봉지가 있어요.
    note_ko: hay 뒤에도 같은 틀 · 봉지, 상자도 수량이에요
    tokens:
    - es: Hay
      gloss_ko: 있다
    - es: una bolsa
      gloss_ko: 한 봉지
    - es: de
      gloss_ko: ~의
    - es: cebollas
      gloss_ko: 양파들
    highlight: [1, 2]
  - es: Cien gramos de setas, por favor.
    en: A hundred grams of mushrooms, please.
    ko: 버섯 100그램 주세요.
    note_ko: 숫자 + 단위 + de + 물건
    tokens:
    - es: Cien gramos
      gloss_ko: 100그램
    - es: de
      gloss_ko: ~의
    - es: setas,
      gloss_ko: 버섯들
    - es: por favor
      gloss_ko: 부탁합니다
    highlight: [0, 1]
  patterns:
  - title_ko: 수량 + de + 명사
    items:
    - es: un kilo de tomates
      lit: kilo · of · tomatoes
      en: a kilo of tomatoes
      ko: 토마토 1킬로
    - es: media docena de huevos
      lit: half · dozen · of · eggs
      en: half a dozen eggs
      ko: 달걀 반 다스
    - es: medio kilo de uvas
      lit: half · kilo · of · grapes
      en: half a kilo of grapes
      ko: 포도 반 킬로
    - es: una bolsa de naranjas
      lit: bag · of · oranges
      en: a bag of oranges
      ko: 오렌지 한 봉지
  - title_ko: 물건마다 세는 말
    items:
    - es: una caja de fresas
      en: a box of strawberries
      ko: 딸기 한 상자
    - es: un racimo de uvas
      en: a bunch of grapes
      ko: 포도 한 송이
    - es: una cabeza de ajo
      en: a head of garlic
      ko: 마늘 한 통
  contrast:
    title_ko: de가 필요할 때와 아닐 때
    items:
    - es: Un kilo de tomates.
      label_ko: 수량 + de
      ko: 토마토 1킬로.
    - es: Dos tomates.
      label_ko: 숫자만이면 de 없이
      ko: 토마토 두 개.
    - es: Un tomate grande.
      label_ko: 형용사는 뒤에
      ko: 큰 토마토 하나.
  subject:
    title_ko: medio와 media
    items:
    - es: Medio kilo, por favor.
      ko: 반 킬로 주세요.
    - es: Media docena, por favor.
      ko: 반 다스 주세요.
    - es: Media sandía, por favor.
      ko: 수박 반 통 주세요.
  extra_notes_ko:
  - 셀 수 있는 물건은 de 뒤에 복수로 써요. un kilo de tomates, media docena de huevos처럼요. 마늘이나 우유처럼 낱개로 세지 않는 말은 un poco de ajo처럼 단수 그대로 둬요.
  - 숫자만 말할 때는 de가 필요 없어요(dos tomates). medio는 ‘반’인데 앞에 un을 붙이지 않고, 뒤에 오는 명사에 맞춰 medio kilo, media docena라고 해요.
