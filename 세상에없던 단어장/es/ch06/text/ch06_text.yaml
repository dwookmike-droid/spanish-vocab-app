scenes:
- es: ¿A cuánto está el kilo?
  en: How much is a kilo?
  ko: 1킬로에 얼마예요?
- es: Póngame medio kilo de fresas.
  en: Half a kilo of strawberries, please.
  ko: 딸기 반 킬로 주세요.
- es: ¿Algo más?
  en: Anything else?
  ko: 더 필요한 거 있어요?
- es: Nada más, gracias.
  en: Nothing else, thanks.
  ko: 이제 됐어요, 고마워요.
- es: ¿Me da una bolsa, por favor?
  en: Can I have a bag, please?
  ko: 봉지 하나 주시겠어요?
- es: ¿Puedo pagar con tarjeta?
  en: Can I pay by card?
  ko: 카드로 계산해도 돼요?
extras:
  grammar_ko:
  - 스페인에서 el plátano는 바나나예요. 과일 이름도 관사와 함께 외워요. el limón, la naranja처럼요.
  - el limón의 복수는 los limones, el melón은 los melones예요. -ón 단어는 -es가 붙으면 악센트 부호가 빠져요.
  - 복수는 모음 뒤에 -s(tomates), 자음 뒤에 -es(limones)를 붙여요.
  - 시장에서는 Me pone…, Póngame…(주세요)를 자주 들어요. 값을 물을 때는 ¿A cuánto está?라고 해요.
  cognates:
  - es: el tomate
    en: tomato
    note_ko: 둘 다 나우아틀어 tomatl에서 왔어요.
  - es: la patata
    en: potato
    note_ko: 영어 potato가 스페인어 patata에서 왔어요.
  - es: el limón
    en: lemon
    note_ko: 둘 다 아랍어 laymūn에서 왔어요.
  - es: la naranja
    en: orange
    note_ko: 둘 다 아랍어 nāranj에서 왔어요.
  false_friend:
    es: la fresa
    en: fresh
    note_ko: la fresa는 딸기예요. ‘신선한’은 fresco라고 해요.
  fun_fact_ko: 스페인에서는 새해 자정 종소리에 맞춰 포도 12알을 먹어요.
