scenes:
- es: ¿Dónde hay una farmacia?
  en: Where's a pharmacy?
  ko: 약국이 어디 있어요?
- es: Me duele la garganta.
  en: I have a sore throat.
  ko: 목이 아파요.
- es: ¿Necesito receta para esto?
  en: Do I need a prescription for this?
  ko: 이거 처방전이 필요해요?
- es: ¿Tiene algo para la tos?
  en: Do you have anything for a cough?
  ko: 기침약 있어요?
- es: Tome una pastilla cada ocho horas.
  en: Take a pill every eight hours.
  ko: 여덟 시간마다 한 알 드세요.
- es: ¿Me da unas tiritas, por favor?
  en: Can I have some plasters, please?
  ko: 반창고 좀 주세요.
extras:
  grammar_ko:
  - la mano는 -o로 끝나도 여성이에요. 복수도 las manos, 형용사도 la mano derecha처럼 여성으로 맞춰요.
  - pie의 복수는 pies, nariz의 복수는 narices예요. z는 복수에서 c로 바뀌어요.
  - la oreja는 겉으로 보이는 귀예요. 소리를 듣는 귓속은 el oído라고 해요.
  - el dedo는 손가락도 발가락도 뜻해요. 발가락만 말하려면 el dedo del pie라고 해요.
  cognates:
  - es: la farmacia
    en: pharmacy
    note_ko: ph 자리에 f를 써요.
  - es: el termómetro
    en: thermometer
    note_ko: th 자리에 t를 써요. 강세는 mó에 와요.
  - es: el estómago
    en: stomach
    note_ko: 앞에 e가 붙어요. 스페인어에서 자주 보는 모양이에요.
  - es: el jarabe
    en: syrup
    note_ko: 둘 다 아랍어 šarāb(마실 것)에서 왔어요.
  false_friend:
    es: la receta
    en: receipt
    note_ko: la receta는 '처방전, 요리법'이에요. 영수증은 el recibo라고 해요.
  fun_fact_ko: 스페인에서는 밤에도 여는 당번 약국을 farmacia de guardia라고 해요.
