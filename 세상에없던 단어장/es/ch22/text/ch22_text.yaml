  patterns:
  - title_ko: 누구에게 아픈가
    items:
    - es: Me duele el pie.
      en: My foot hurts.
      ko: 제 발이 아파요.
    - es: Te duele el pie.
      en: Your foot hurts.
      ko: 네 발이 아파.
    - es: Le duele el pie.
      en: His / her foot hurts.
      ko: 그 사람 발이 아파요.
    - es: Nos duelen los pies.
      en: Our feet hurt.
      ko: 우리는 발이 아파요.
  - title_ko: 단수 duele · 복수 duelen
    items:
    - es: Me duele la pierna.
      tag: f
      ko: 다리가 아파요.
    - es: Me duelen las piernas.
      tag: f pl
      ko: 두 다리가 아파요.
    - es: Me duele el dedo.
      tag: m
      ko: 손가락이 아파요.
    - es: Me duelen los dedos.
      tag: m pl
      ko: 손가락들이 아파요.
  - title_ko: 몸에는 정관사
    items:
    - es: Me lavo las manos.
      lit: me · I wash · the · hands
      en: I wash my hands.
      ko: 손을 씻어요.
    - es: Abre la boca.
      lit: open · the · mouth
      en: Open your mouth.
      ko: 입을 벌려.
    - es: Tengo el brazo roto.
      lit: have · the · arm · broken
      en: My arm is broken.
      ko: 팔이 부러졌어요.
  contrast:
    title_ko: 아픔을 말하는 세 가지
    items:
    - es: Me duele la cabeza.
      label_ko: 'doler: 머리가 주어'
      ko: 머리가 아파요.
    - es: Tengo dolor de cabeza.
      label_ko: 'tener: 내가 주어'
      ko: 두통이 있어요.
    - es: Estoy enfermo.
      label_ko: 'estar: 몸 상태'
      ko: 몸이 아파요.
  subject:
    title_ko: 주어 자리와 a mí
    items:
    - es: Me duele la cabeza.
      ko: 머리가 아파요.
    - es: La cabeza me duele.
      ko: 앞에 두면 머리를 강조해요.
    - es: A mí me duele la cabeza.
      ko: 저는 머리가 아파요.
  extra_notes_ko:
  - 한국어로는 '내가 머리가 아파요'지만 스페인어로 보면 '머리가 나를 아프게 해요'에 가까워요. 그래서 아픈 곳이 복수면 동사도 duelen으로 바뀌어요. 주어는 yo가 아니에요.
  - me가 '나에게'를 이미 말해 주니 mi cabeza라고 다시 쓰지 않아요. ch01에서 본 me lavo los dientes와 같은 이치예요.
