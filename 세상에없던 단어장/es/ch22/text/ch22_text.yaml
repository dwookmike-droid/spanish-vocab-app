  point_ko: 'doler: 아픈 곳이 주어 · 신체엔 정관사'
  lead_ko: doler는 gustar와 틀이 같아요. 아픈 곳이 주어이고 me는 동사 앞이에요. 몸에는 mi 대신 정관사를 써요.
