scenes:
- es: ¿Cuánto cuesta este?
  en: How much is this one?
  ko: 이거 얼마예요?
- es: ¿Puedo pagar con tarjeta?
  en: Can I pay by card?
  ko: 카드로 내도 돼요?
- es: ¿Tiene una talla más grande?
  en: Do you have a bigger size?
  ko: 더 큰 사이즈 있어요?
- es: ¿Dónde están los probadores?
  en: Where are the fitting rooms?
  ko: 탈의실이 어디예요?
- es: ¿Me hace un descuento?
  en: Can you give me a discount?
  ko: 좀 깎아 주실래요?
- es: Es para regalo.
  en: It's a gift.
  ko: 선물할 거예요.
extras:
  grammar_ko:
  - el cambio는 거스름돈과 환전을 다 뜻해요. 스페인에서는 거스름돈을 la vuelta라고도 해요.
  - el billete는 교통편의 표이면서 지폐이기도 해요. 쇼핑 장면에서는 대개 지폐예요.
  - la caja는 계산대이자 상자예요. Pague en caja는 '계산대에서 내세요'라는 뜻이에요.
  - antigüedad의 ü는 u 소리를 내라는 표시예요. 표기를 빼면 발음이 달라져요.
  cognates:
  - es: el precio
    en: price
    note_ko: c를 ㅅ으로 읽어요. 뜻은 같아요.
  - es: el descuento
    en: discount
    note_ko: des-와 dis-가 서로 대응해요.
  - es: la oferta
    en: offer
    note_ko: 스페인어에서는 '특가'로 자주 써요.
  - es: la antigüedad
    en: antiquity
    note_ko: 골동품도, 오래된 정도도 뜻해요.
  false_friend:
    es: la moneda
    en: money
    note_ko: la moneda는 '동전, 화폐'예요. '돈'은 el dinero라고 해요.
  fun_fact_ko: 스페인에서는 큰 세일(las rebajas)이 1월과 7월에 많이 열려요.
