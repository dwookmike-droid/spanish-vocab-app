word_order:
  tema: Este y ese
  tema_sub_ko: 지시사 — 명사 없이 혼자 쓰기
  point_ko: '지시사: este / ese + 대명사로 쓰기'
  lead_ko: este는 내 가까이, ese는 상대 가까이 있는 것을 가리켜요. 명사를 빼고 혼자 쓰면 '이것, 그것'이 돼요.
  sentences:
  - es: ¿Este o ese? Me llevo este.
    en: This or that? I'll take this one.
    ko: 이거요, 그거요? 이걸로 살게요.
    note_ko: 명사 없이 este · ese만 · 가리키는 물건의 성에 맞춰요
    tokens:
    - es: ¿Este o ese?
      gloss_ko: 이것 또는 그것?
    - es: Me
      gloss_ko: 나 자신(에게)
    - es: llevo
      gloss_ko: 가져간다
    - es: este
      gloss_ko: 이것
    highlight: [0, 3]
  - es: Esta talla no, quiero esa.
    en: Not this size, I want that one.
    ko: 이 사이즈 말고 그걸로 주세요.
    note_ko: talla가 여성이라 esta · esa
    tokens:
    - es: Esta talla
      gloss_ko: 이 사이즈
    - es: no,
      gloss_ko: 아니
    - es: quiero
      gloss_ko: 원한다
    - es: esa
      gloss_ko: 그것
    highlight: [0, 3]
  - es: Estos son baratos, esos no.
    en: These are cheap, those aren't.
    ko: 이건 싸고 그건 안 싸요.
    note_ko: 복수면 estos · esos · 형용사도 복수
    tokens:
    - es: Estos
      gloss_ko: 이것들
    - es: son
      gloss_ko: ~이다
    - es: baratos,
      gloss_ko: 싼
    - es: esos
      gloss_ko: 그것들
    - es: 'no'
      gloss_ko: 아니
    highlight: [0, 3]
  - es: ¿La bolsa? ¿Cuánto cuesta esa?
    en: The bag? How much is that one?
    ko: 봉지요? 그건 얼마예요?
    note_ko: 앞에 나온 명사는 지시사만으로 받아요
    tokens:
    - es: ¿La bolsa?
      gloss_ko: 그 봉지?
    - es: ¿Cuánto
      gloss_ko: 얼마
    - es: cuesta
      gloss_ko: 값이 나간다
    - es: esa?
      gloss_ko: 그것
    highlight: [3]
  - es: ¿Qué es eso? Es una antigüedad.
    en: What's that? It's an antique.
    ko: 그게 뭐예요? 골동품이에요.
    note_ko: 뭔지 모르면 중성 eso를 써요
    tokens:
    - es: ¿Qué
      gloss_ko: 무엇
    - es: es
      gloss_ko: ~이다
    - es: eso?
      gloss_ko: 그것
    - es: Es
      gloss_ko: ~이다
    - es: una
      gloss_ko: 하나의
    - es: antigüedad
      gloss_ko: 골동품
    highlight: [2]
  patterns:
  - title_ko: 이것 (내 가까이)
    items:
    - es: este bolso → este
      en: this bag → this one
      ko: 이 가방 → 이거
    - es: esta talla → esta
      en: this size → this one
      ko: 이 사이즈 → 이거
    - es: estos euros → estos
      en: these euros → these
      ko: 이 유로들 → 이것들
    - es: estas monedas → estas
      en: these coins → these
      ko: 이 동전들 → 이것들
  - title_ko: 그것 (상대 가까이)
    items:
    - es: ese puesto → ese
      tag: m
      ko: 그 노점 → 그거
    - es: esa tarjeta → esa
      tag: f
      ko: 그 카드 → 그거
    - es: esos regalos → esos
      tag: m pl
      ko: 그 선물들 → 그것들
    - es: esas bolsas → esas
      tag: f pl
      ko: 그 봉지들 → 그것들
  - title_ko: '성이 없는 말: esto · eso'
    items:
    - es: ¿Qué es esto?
      lit: what · is · this
      en: What's this?
      ko: 이게 뭐예요?
    - es: ¿Qué es eso?
      lit: what · is · that
      en: What's that?
      ko: 그게 뭐예요?
    - es: Eso es todo.
      lit: that · is · all
      en: That's all.
      ko: 그게 다예요.
  contrast:
    title_ko: 명사 앞 / 혼자
    items:
    - es: Me llevo este bolso.
      label_ko: este + 명사
      ko: 이 가방으로 살게요.
    - es: Me llevo este.
      label_ko: este 혼자
      ko: 이걸로 살게요.
    - es: Me lo llevo.
      label_ko: 'lo: 이미 정한 것'
      ko: 그걸로 살게요.
  subject:
    title_ko: 주어 자리의 지시사
    items:
    - es: Este es más barato.
      ko: 이게 더 싸요.
    - es: Esa es más cara.
      ko: 그게 더 비싸요.
  extra_notes_ko:
  - 이제는 대명사로 쓸 때도 악센트 없이 este, ese로 적어요. 옛 책에서 éste, ése를 보아도 뜻은 같아요. 헷갈릴 때만 부호를 붙여요.
  - 가리키는 물건의 성·수를 따라요. el bolso면 este, la talla면 esta예요. 무엇인지 모르거나 특정 물건을 가리키지 않을 때는 성이 없는 esto, eso를 써요.
practice:
- tiles: [este, llevo, Me]
  answer: Me llevo este.
  ko: 이걸로 살게요.
- tiles: [esa, 'no,', Esta, quiero, talla]
  answer: Esta talla no, quiero esa.
  ko: 이 사이즈 말고 그걸로 주세요.
- tiles: ['no', 'baratos,', son, esos, Estos]
  answer: Estos son baratos, esos no.
  ko: 이건 싸고 그건 안 싸요.
- tiles: [es, ¿Qué, 'eso?']
  answer: ¿Qué es eso?
  ko: 그게 뭐예요?
- tiles: [euros, Son, veinte]
  answer: Son veinte euros.
  ko: 20유로예요.
