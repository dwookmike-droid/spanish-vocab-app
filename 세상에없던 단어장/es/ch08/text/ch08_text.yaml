scenes:
- es: Una mesa para dos, por favor.
  en: A table for two, please.
  ko: 두 명 자리 부탁해요.
- es: Tengo una reserva a las nueve.
  en: I have a reservation at nine.
  ko: 아홉 시에 예약했어요.
- es: ¿Qué me recomienda?
  en: What do you recommend?
  ko: 뭘 추천하세요?
- es: De primero, sopa, y de segundo, carne.
  en: Soup first, then meat.
  ko: 먼저 수프, 그다음 고기로요.
- es: Está todo muy rico.
  en: Everything is delicious.
  ko: 다 정말 맛있어요.
- es: ¿Puedo pagar con tarjeta?
  en: Can I pay by card?
  ko: 카드로 내도 돼요?
extras:
  grammar_ko:
  - el agua는 여성 명사예요. 강세 있는 a로 시작해서 단수 관사만 el을 써요. 복수는 las aguas이고, 형용사도 el agua fría처럼 여성형이에요.
  - primero는 남성 단수 명사 앞에서 -o가 빠져요. 그래서 el primer plato예요. segundo는 그대로 el segundo plato라고 해요.
  - el vaso는 다리가 없는 컵이고, 다리 달린 잔은 la copa예요. 그래서 물은 un vaso de agua, 와인은 una copa de vino라고 해요.
  - el menú del día의 del은 de + el이 줄어든 말이에요. 여성 명사 앞의 de la는 줄지 않아요.
  cognates:
  - es: la ensalada
    en: salad
    note_ko: 둘 다 소금을 뜻하는 라틴어 sal과 이어져요.
  - es: la botella
    en: bottle
    note_ko: 철자가 닮아서 뜻이 금방 짐작돼요.
  - es: la sopa
    en: soup
    note_ko: 소리가 비슷해서 외우기 쉬워요.
  false_friend:
    es: el menú
    en: menu
    note_ko: 스페인 식당에서 el menú는 코스를 묶은 세트 메뉴를 말해요. 음식 목록이 적힌 메뉴판은 la carta예요.
  fun_fact_ko: el aceite는 아랍어 az-zayt에서 왔어요. el arroz도 아랍어 ar-ruzz에서 온 말이에요.
