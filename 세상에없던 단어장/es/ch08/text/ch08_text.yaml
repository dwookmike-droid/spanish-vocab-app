word_order:
  tema: Me trae, le traigo
  tema_sub_ko: 어순 — me · le는 동사 바로 앞에
  point_ko: 간접목적 me / le는 동사 앞 (주문하기)
  lead_ko: 주문할 때 ‘나에게’를 뜻하는 me는 동사 바로 앞에 와요. ‘당신에게’를 뜻하는 le도 자리가 같아요.
  sentences:
  - es: ¿Me trae la cuenta, por favor?
    en: Could you bring me the bill, please?
    ko: 계산서 좀 갖다주시겠어요?
    note_ko: me(나에게)는 동사 바로 앞 · 영어 me는 동사 뒤
    tokens:
    - es: ¿Me
      gloss_ko: 나에게
    - es: trae
      gloss_ko: 가져오다(당신)
    - es: la cuenta,
      gloss_ko: 그 계산서
    - es: por favor?
      gloss_ko: 부탁해요
    highlight: [0]
  - es: ¿Me pone un vaso de agua?
    en: Can I have a glass of water?
    ko: 물 한 잔 주시겠어요?
    note_ko: ¿Me pone…?는 바나 식당에서 주문할 때 흔히 써요
    tokens:
    - es: ¿Me
      gloss_ko: 나에게
    - es: pone
      gloss_ko: 놓다(당신)
    - es: un vaso
      gloss_ko: 한 잔
    - es: de
      gloss_ko: ~의
    - es: agua?
      gloss_ko: 물
    highlight: [0]
  - es: Le traigo la carta ahora.
    en: I'll bring you the menu now.
    ko: 메뉴판 지금 갖다드릴게요.
    note_ko: le(당신에게)도 동사 앞 · 직원이 손님에게 하는 말
    tokens:
    - es: Le
      gloss_ko: 당신에게
    - es: traigo
      gloss_ko: 가져오다(나)
    - es: la carta
      gloss_ko: 그 메뉴판
    - es: ahora
      gloss_ko: 지금
    highlight: [0]
  - es: Le recomiendo el pescado.
    en: I recommend the fish.
    ko: 생선 요리를 추천해 드려요.
    note_ko: 추천할 때도 le + 동사 + 목적어 순서예요
    tokens:
    - es: Le
      gloss_ko: 당신에게
    - es: recomiendo
      gloss_ko: 추천하다(나)
    - es: el pescado
      gloss_ko: 그 생선
    highlight: [0]
  - es: ¿Nos trae otra botella?
    en: Could you bring us another bottle?
    ko: 한 병 더 갖다주시겠어요?
    note_ko: 여럿이면 nos(우리에게) · 자리는 me와 같아요
    tokens:
    - es: ¿Nos
      gloss_ko: 우리에게
    - es: trae
      gloss_ko: 가져오다(당신)
    - es: otra
      gloss_ko: 또 하나의
    - es: botella?
      gloss_ko: 병
    highlight: [0]
  patterns:
  - title_ko: 주문할 때 쓰는 틀
    items:
    - es: ¿Me trae la carta?
      en: Could I have the menu?
      ko: 메뉴판 주시겠어요?
    - es: ¿Me pone una copa de vino?
      en: A glass of wine, please?
      ko: 와인 한 잔 주시겠어요?
    - es: ¿Me trae la cuenta?
      en: Could I have the bill?
      ko: 계산서 주시겠어요?
  - title_ko: 누구에게? me · le · nos
    items:
    - es: me trae
      lit: to me · brings
      ko: 나에게 갖다줘요
    - es: le trae
      lit: to you, him, her · brings
      ko: 그 사람에게 갖다줘요
    - es: nos trae
      lit: to us · brings
      ko: 우리에게 갖다줘요
  - title_ko: 코스 고르기
    items:
    - es: De primero, la sopa.
      en: First, the soup.
      ko: 첫 요리는 수프로요.
    - es: De segundo, el pescado.
      en: Then the fish.
      ko: 다음은 생선으로요.
    - es: De postre, fruta.
      en: Fruit for dessert.
      ko: 디저트는 과일로요.
  contrast:
    title_ko: me의 자리
    items:
    - es: ¿Me trae la cuenta?
      label_ko: 활용된 동사 앞에
      ko: 계산서 갖다주시겠어요?
    - es: ¿Me puede traer la cuenta?
      label_ko: 앞에 둬도 같은 뜻
      ko: 계산서 갖다주실 수 있어요?
    - es: ¿Puede traerme la cuenta?
      label_ko: 동사원형 끝에 붙여서
      ko: 계산서 갖다주실 수 있어요?
  subject:
    title_ko: le가 누구인지 밝히기
    items:
    - es: Le traigo la carta a usted.
      ko: 손님께 메뉴판을 갖다드려요.
    - es: Le traigo la sopa a ella.
      ko: 저 여자분께 수프를 갖다드려요.
    - es: Le traigo el agua a él.
      ko: 저 남자분께 물을 갖다드려요.
  extra_notes_ko:
  - 'le 하나로 ‘당신에게’, ‘그에게’, ‘그녀에게’를 다 말해요. 누구인지 헷갈리면 a usted, a ella를 뒤에 덧붙여요. 이때도 le는 빼지 않아요: Le traigo la carta a usted.'
  - trae, pone는 usted(당신)에게 쓰는 동사 모양이에요. 처음 보는 식당 직원에게는 이렇게 말하면 무난해요. 끝에 por favor를 붙이면 말투가 더 부드러워져요.
