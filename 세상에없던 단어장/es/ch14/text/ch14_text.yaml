- es: ¿Cuánto retraso lleva el vuelo?
  en: How late is the flight?
  ko: 항공편이 얼마나 늦어요?
- es: No tengo equipaje que facturar.
  en: I have no luggage to check.
  ko: 부칠 짐이 없어요.
- es: ¿El vuelo sale de esta terminal?
  en: Does the flight leave from here?
  ko: 이 터미널에서 출발해요?
- es: ¿Dónde recojo el equipaje?
