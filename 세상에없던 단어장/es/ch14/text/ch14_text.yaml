word_order:
  tema: La negación
  tema_sub_ko: 부정 — no는 동사 앞에
  point_ko: '부정: no + 동사 · 이중 부정 nada / nunca'
  lead_ko: no는 동사 앞에 와요. nada나 nunca가 동사 뒤에 있어도 no를 그대로 둬요. 부정어가 둘이어도 뜻은 부정이에요.
  sentences:
  - es: No tengo nada que declarar.
    en: I have nothing to declare.
    ko: 신고할 것이 없어요.
    note_ko: no + 동사 + nada · 부정어 둘이 함께 나와요
    tokens:
    - es: 'No'
      gloss_ko: 안
    - es: tengo
      gloss_ko: 가지다(나는)
    - es: nada
      gloss_ko: 아무것도
    - es: que declarar
      gloss_ko: 신고할
    highlight: [0, 2]
  - es: El avión no sale hoy.
    en: The plane isn't leaving today.
    ko: 비행기가 오늘 안 떠나요.
    note_ko: 주어가 있어도 no는 동사 앞
    tokens:
    - es: El avión
      gloss_ko: 그 비행기
    - es: 'no'
      gloss_ko: 안
    - es: sale
      gloss_ko: 떠난다
    - es: hoy
      gloss_ko: 오늘
    highlight: [1]
  - es: No llevo nada en la maleta.
    en: I have nothing in my suitcase.
    ko: 가방에 아무것도 없어요.
    note_ko: '같은 틀: no + 동사 + nada + 장소'
    tokens:
    - es: 'No'
      gloss_ko: 안
    - es: llevo
      gloss_ko: 가져간다
    - es: nada
      gloss_ko: 아무것도
    - es: en
      gloss_ko: ~에
    - es: la maleta
      gloss_ko: 그 가방
    highlight: [0, 2]
  - es: No viajo nunca sin pasaporte.
    en: I never travel without a passport.
    ko: 여권 없이는 절대 여행 안 해요.
    note_ko: nunca가 동사 뒤면 no가 동사 앞에
    tokens:
    - es: 'No'
      gloss_ko: 안
    - es: viajo
      gloss_ko: 여행한다
    - es: nunca
      gloss_ko: 결코
    - es: sin
      gloss_ko: ~없이
    - es: pasaporte
      gloss_ko: 여권
    highlight: [0, 2]
  - es: Nunca facturo la maleta.
    en: I never check my suitcase.
    ko: 저는 가방을 절대 안 부쳐요.
    note_ko: nunca가 동사 앞이면 no를 빼요
    tokens:
    - es: Nunca
      gloss_ko: 결코
    - es: facturo
      gloss_ko: 부친다
    - es: la maleta
      gloss_ko: 그 가방
    highlight: [0]
  patterns:
  - title_ko: no + 동사
    items:
    - es: No tengo billete.
      en: I have no ticket.
      ko: 표가 없어요.
    - es: No hay retraso.
      en: There's no delay.
      ko: 지연이 없어요.
    - es: No sale hoy.
      en: It isn't leaving today.
      ko: 오늘 안 떠나요.
  - title_ko: no + 동사 + nada
    items:
    - es: No tengo nada.
      en: I have nothing.
      ko: 아무것도 없어요.
    - es: No veo nada.
      en: I can't see anything.
      ko: 아무것도 안 보여요.
    - es: No llevo nada.
      en: I'm carrying nothing.
      ko: 가진 게 없어요.
  - title_ko: no + 동사 + nunca
    items:
    - es: No vuelo nunca.
      en: I never fly.
      ko: 절대 비행기 안 타요.
    - es: No facturo nunca.
      en: I never check bags.
      ko: 절대 안 부쳐요.
    - es: No viajo nunca.
      en: I never travel.
      ko: 절대 여행 안 해요.
  contrast:
    title_ko: nunca의 자리
    items:
    - es: No viajo nunca en avión.
      label_ko: 동사 뒤에는 no와 함께
      ko: 비행기로는 절대 안 다녀요.
    - es: Nunca viajo en avión.
      label_ko: 동사 앞에는 no 없이
      ko: 비행기로는 절대 안 다녀요.
  extra_notes_ko:
  - 영어는 I don't have anything처럼 부정어를 한 번만 쓰지만, 스페인어는 No tengo nada처럼 no와 nada를 같이 써요. 둘이 있어도 긍정으로 뒤집히지 않아요.
  - que + 동사원형은 ‘~할’이에요. que declarar가 nada를 뒤에서 꾸며 ‘신고할 것’이 돼요.
practice:
