  answer: No tengo nada que declarar.
  ko: 신고할 것이 없어요.
- tiles: [billete, 'No', tengo]
  answer: No tengo billete.
  ko: 표가 없어요.
- tiles: [sin, nunca, viajo, pasaporte, 'No']
  answer: No viajo nunca sin pasaporte.
  ko: 여권 없이는 절대 여행 안 해요.
- tiles: [la, facturo, maleta, Nunca]
  answer: Nunca facturo la maleta.
  ko: 가방을 절대 안 부쳐요.
- tiles: ['no', hoy, El, sale, vuelo]
  answer: El vuelo no sale hoy.
  ko: 비행기가 오늘 안 떠나요.
