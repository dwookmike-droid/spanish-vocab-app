extras:
  grammar_ko:
  - -aje로 끝나는 명사는 대개 남성이에요. el equipaje, el viaje, el pasaje처럼요.
  - 공항 안내판의 Salidas는 출발, Llegadas는 도착이에요. la salida는 ‘나가는 곳’이라 건물에서는 출구가 돼요.
  - 공항·버스 터미널을 뜻하는 terminal은 여성 명사예요. -al로 끝나도 la terminal이라고 해요.
  - la ventanilla는 la ventana(창문)에 ‘작은’을 뜻하는 -illa가 붙은 말이에요. 비행기나 기차의 창을 가리켜요.
  cognates:
  - es: el aeropuerto
    en: airport
    note_ko: puerto는 항구예요. 영어 port와 뿌리가 같아요.
  - es: el pasaporte
    en: passport
    note_ko: 철자가 비슷해서 뜻이 바로 보여요.
  - es: la terminal
    en: terminal
    note_ko: 철자가 같고 소리만 달라요. 강세는 끝 음절에 와요.
  false_friend:
    es: el éxito
    en: exit
    note_ko: el éxito는 ‘성공’이에요. 출구는 la salida라고 해요.
  fun_fact_ko: facturar는 공항에서 ‘짐을 부치다’예요. 청구서 la factura와 뿌리가 같아요.
