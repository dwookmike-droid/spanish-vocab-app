  - es: Hay grandes árboles en el jardín.
    en: There are great trees in the garden.
    ko: 정원에 멋진 나무들이 있어요.
    note_ko: 복수는 앞에 와도 grandes로 그대로
    tokens:
    - es: Hay
      gloss_ko: 있다
    - es: grandes
      gloss_ko: 멋진
    - es: árboles
      gloss_ko: 나무들
    - es: en
      gloss_ko: ~에
    - es: el jardín
      gloss_ko: 그 정원
