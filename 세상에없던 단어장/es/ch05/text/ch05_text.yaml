scenes:
- es: ¡Qué patio tan bonito!
  en: What a lovely patio!
  ko: 안뜰이 정말 예뻐요!
- es: ¿Se puede entrar?
  en: Can we go in?
  ko: 들어가도 돼요?
- es: ¿Puedo hacer una foto?
  en: Can I take a photo?
  ko: 사진 찍어도 돼요?
- es: ¿Cómo se llaman estas flores?
  en: What are these flowers called?
  ko: 이 꽃들 이름이 뭐예요?
- es: Vamos a la sombra.
  en: Let's go into the shade.
  ko: 그늘로 가요.
- es: Hay que regar las macetas.
  en: The pots need watering.
  ko: 화분에 물을 줘야 해요.
extras:
  grammar_ko:
  - la flor는 -r로 끝나지만 여성이에요. 복수는 las flores처럼 -es를 붙여요.
  - el árbol과 el césped은 -l, -d로 끝나는데 강세가 끝에서 두 번째 음절에 있어서 악센트 부호를 써요.
  - el jardín의 복수는 los jardines예요. -es가 붙으면 강세 자리는 그대로인데 부호는 빠져요.
  - a la sombra(그늘에서), al sol(햇볕에서)처럼 짝으로 외우면 쉬워요.
  cognates:
  - es: el patio
    en: patio
    note_ko: 영어가 스페인어에서 그대로 빌려 간 말이에요.
  - es: el geranio
    en: geranium
    note_ko: 둘 다 ‘두루미’를 뜻하는 그리스어에서 왔어요.
  - es: la hamaca
    en: hammock
    note_ko: 카리브해 타이노어에서 스페인어를 거쳐 영어로 갔어요.
  - es: la buganvilla
    en: bougainvillea
    note_ko: 프랑스 탐험가 부갱빌의 이름에서 왔어요.
  false_friend:
    es: el banco
    en: bank
    note_ko: 은행도 el banco지만 정원의 el banco는 벤치예요. 앉는 자리인지 보고 구별해요.
  fun_fact_ko: 코르도바에서는 해마다 5월에 파티오 축제(Fiesta de los Patios)가 열려요.
