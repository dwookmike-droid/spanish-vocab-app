word_order:
  tema: Gran y grande
  tema_sub_ko: 형용사 — 자리가 바뀌면 뜻도 바뀌어요
  point_ko: 형용사 자리가 바뀌면 뜻도 바뀜 (gran / grande)
  lead_ko: 형용사는 보통 명사 뒤에 와요. 그런데 grande는 앞으로 나오면 gran이 되고 뜻도 달라져요.
  sentences:
  - es: Un gran patio. Un patio grande.
    en: A great patio. A big patio.
    ko: 멋진 안뜰. 넓은 안뜰.
    note_ko: 앞의 gran은 ‘멋진’ · 뒤의 grande는 ‘넓은’
    tokens:
    - es: Un
      gloss_ko: 하나의
    - es: gran
      gloss_ko: 멋진
    - es: patio.
      gloss_ko: 안뜰
    - es: Un
      gloss_ko: 하나의
    - es: patio
      gloss_ko: 안뜰
    - es: grande
      gloss_ko: 넓은
    highlight: [1, 5]
  - es: Es una gran fuente.
    en: It's a great fountain.
    ko: 멋진 분수예요.
    note_ko: 여성 명사 앞에서도 똑같이 gran
    tokens:
    - es: Es
      gloss_ko: ~이다
    - es: una
      gloss_ko: 하나의
    - es: gran
      gloss_ko: 멋진
    - es: fuente
      gloss_ko: 분수
    highlight: [2]
  - es: Es una fuente grande.
    en: It's a big fountain.
    ko: 큰 분수예요.
    note_ko: 명사 뒤 grande는 크기를 말해요
    tokens:
    - es: Es
      gloss_ko: ~이다
    - es: una
      gloss_ko: 하나의
    - es: fuente
      gloss_ko: 분수
    - es: grande
      gloss_ko: 큰
    highlight: [3]
  - es: Hay un árbol viejo en el patio.
    en: There's an old tree in the patio.
    ko: 안뜰에 오래된 나무가 있어요.
    note_ko: 다른 형용사는 대부분 명사 뒤 · viejo는 ‘오래된’
    tokens:
    - es: Hay
      gloss_ko: 있다
    - es: un
      gloss_ko: 하나의
    - es: árbol
