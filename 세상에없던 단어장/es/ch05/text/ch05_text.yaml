  patterns:
  - title_ko: 자리에 따라 달라지는 뜻
    items:
    - es: un gran patio
      en: a great patio
      ko: 멋진 안뜰
    - es: un patio grande
      en: a big patio
      ko: 넓은 안뜰
    - es: una gran fuente
      en: a great fountain
      ko: 멋진 분수
    - es: una fuente grande
      en: a big fountain
      ko: 큰 분수
  - title_ko: viejo, pobre도 그래요
    items:
    - es: un viejo amigo
      en: an old friend
      ko: 오랜 친구
    - es: un amigo viejo
      en: an elderly friend
      ko: 나이 든 친구
    - es: un pobre hombre
      en: a poor (pitiable) man
      ko: 불쌍한 남자
    - es: un hombre pobre
      en: a poor (penniless) man
      ko: 가난한 남자
  - title_ko: 보통 형용사는 명사 뒤
    items:
    - es: la maceta azul
      en: the blue pot
      ko: 파란 화분
    - es: la flor roja
      en: the red flower
      ko: 빨간 꽃
    - es: el árbol alto
      en: the tall tree
      ko: 키 큰 나무
  contrast:
    title_ko: gran과 grande
    items:
    - es: Es un gran jardín.
      label_ko: 명사 앞 · 평가
      ko: 멋진 정원이에요.
    - es: Es un jardín grande.
      label_ko: 명사 뒤 · 크기
      ko: 넓은 정원이에요.
    - es: El jardín es grande.
      label_ko: es 뒤 · 크기
      ko: 정원이 넓어요.
  extra_notes_ko:
  - grande는 단수 명사 앞에서 gran으로 짧아져요. 남성이든 여성이든 같아서 un gran patio, una gran fuente라고 해요. 복수 명사 앞에서는 grandes를 그대로 써요.
  - 명사 앞의 gran에는 ‘훌륭하다’는 평가가 담기고, 명사 뒤의 grande는 크기만 말해요. 다른 형용사는 대부분 ch01에서 본 대로 명사 뒤에 둬요.
