scenes:
- es: ¿Qué tiempo va a hacer mañana?
  en: What will the weather be tomorrow?
  ko: 내일 날씨 어떨까요?
- es: ¿Va a llover esta tarde?
  en: Is it going to rain this afternoon?
  ko: 오늘 오후에 비가 올까요?
- es: Llévate el paraguas, por si acaso.
  en: Take the umbrella, just in case.
  ko: 혹시 모르니 우산 챙겨요.
- es: Estamos a veinte grados.
  en: It's twenty degrees.
  ko: 지금 20도예요.
- es: ¡Qué frío hace hoy!
  en: It's so cold today!
  ko: 오늘 정말 춥네요!
extras:
  grammar_ko:
  - el paraguas는 parar(막다)와 aguas(물)를 합친 말이에요. 그래서 단수도 -s로 끝나고, 복수는 관사만 바꿔 los paraguas라고 해요.
  - el tiempo는 ‘날씨’와 ‘시간’을 다 뜻해요. ¿Qué tiempo hace?는 날씨를, ¿Tienes tiempo?는 시간을 묻는 말이에요.
  - la estación은 ‘역’과 ‘계절’을 다 뜻해요. 네 계절은 la primavera, el verano, el otoño, el invierno예요.
  - llover와 nevar는 3인칭 단수로만 써요. llueve, nieva, está lloviendo처럼요.
  cognates:
  - es: la temperatura
    en: temperature
    note_ko: 철자가 거의 같아서 뜻이 바로 보여요.
  - es: el frío
    en: frigid
    note_ko: 둘 다 라틴어 frigidus에서 왔어요.
  false_friend:
    es: el rayo
    en: ray
    note_ko: el rayo는 주로 ‘번개’예요. ‘햇살’은 un rayo de sol처럼 de sol을 붙여 말해요.
  fun_fact_ko: Donostia는 바스크어 이름이에요. 스페인어로는 San Sebastián이라고 해요.
