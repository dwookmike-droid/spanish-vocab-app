  contrast:
    title_ko: 덥다 · 뜨겁다를 말하는 세 가지
    items:
    - es: Hace calor.
      label_ko: 날씨가 더울 때
      ko: 더워요.
    - es: Tengo calor.
      label_ko: 내 몸이 더울 때
      ko: 저는 더워요.
    - es: El café está caliente.
      label_ko: 물건이 뜨거울 때
      ko: 커피가 뜨거워요.
  extra_notes_ko:
  - 'calor와 frío는 명사라서 ‘많이’는 mucho로 꾸며요: Hace mucho calor. muy는 형용사 앞에 오는 말이어서 Hace muy calor라고 하지 않아요.'
  - '기온은 estar로 말해요: Estamos a veinte grados. ‘우리가 20도에 있다’는 틀로 ‘지금 20도예요’를 뜻해요.'
